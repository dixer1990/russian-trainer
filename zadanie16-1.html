<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Задание 16 ЕГЭ. Однородные члены и сложное предложение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1320; --bg2:#121A2C; --panel:#171E31; --panel2:#1D2640; --solid:#131A2B;
    --line:#2A3350; --line2:#3A4460;
    --text:#F1E9D6; --dim:#A7AFC2;
    --gold:#D4A64A; --gold2:#E7C27A; --gold-bg:rgba(212,166,74,.14);
    --green:#6FBF8E; --green-bg:rgba(111,191,142,.15);
    --red:#E07A6A;   --red-bg:rgba(224,122,106,.15);
    --blue:#8FB2E8;  --blue-bg:rgba(143,178,232,.14);
    --lilac:#C9A3E0;
    --f-head:'PT Serif', Georgia, serif;
    --f-body:'PT Sans', 'Segoe UI', system-ui, sans-serif;
    --f-mono:'JetBrains Mono', Consolas, monospace;
    --step: clamp(1rem, .96rem + .18vw, 1.08rem);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html{height:100%;overflow:hidden;}
  /* каркас прибит к краям экрана: нижняя панель видна даже там, где 100dvh больше видимой области (Android) */
  body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(ellipse 80% 55% at 70% -10%, rgba(212,166,74,.10), transparent 60%),
               linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--text);font-family:var(--f-body);font-size:var(--step);line-height:1.6;}

  /* прогресс — нотный стан */
  .bar{flex:0 0 auto;height:14px;position:relative;z-index:3;
    background:repeating-linear-gradient(180deg, transparent 0 2px, rgba(241,233,214,.10) 2px 3px);}
  .bar-fill{position:absolute;left:0;top:5px;height:4px;width:0;background:var(--gold);border-radius:0 3px 3px 0;transition:width .35s ease;}

  .stage{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:flex-start;
    padding:26px 22px 28px;position:relative;z-index:1;}
  .slide{width:100%;max-width:880px;animation:rise .4s cubic-bezier(.22,1,.36,1);}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  .nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;z-index:3;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(14,19,32,.94);}
  .nav button{font-family:var(--f-body);font-size:.95rem;color:var(--text);background:var(--panel);
    border:1px solid var(--line2);border-radius:11px;min-height:2.75rem;padding:0 16px;cursor:pointer;}
  .nav button:hover:not(:disabled){border-color:var(--gold);}
  .nav button:disabled{opacity:.35;cursor:default;}
  .nav-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-width:0;}
  .nav .toggle{font-size:.82rem;padding:0 12px;}
  .nav .toggle[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);}
  .sh{display:none;}
  .toc-btn{font-family:var(--f-mono)!important;font-size:.82rem!important;color:var(--dim)!important;white-space:nowrap;}
  :where(button,input,[tabindex]):focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  body.calm .slide, body.calm .cm.pop{animation:none!important;}
  @media (prefers-reduced-motion: reduce){ .slide,.cm.pop{animation:none!important;} *{transition-duration:.01ms!important;} }

  h1{font-family:var(--f-head);font-weight:700;line-height:1.15;margin:0 0 12px;font-size:clamp(1.55rem,1.2rem + 1.6vw,2.3rem);}
  h2{font-family:var(--f-head);font-weight:700;line-height:1.2;margin:0 0 10px;font-size:clamp(1.3rem,1.1rem + 1vw,1.75rem);}
  h3{font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--gold2);margin:0 0 8px;}
  p{margin:0 0 10px;}
  .kicker{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.08em;color:var(--gold);margin-bottom:8px;}
  .lead{color:var(--dim);max-width:68ch;margin-bottom:16px;}
  b.hl{color:var(--gold2);}

  /* заставка раздела */
  .banner{position:relative;border-radius:14px;overflow:hidden;margin:0 0 18px;height:clamp(92px,19vw,176px);
    background:var(--panel);border:1px solid var(--line);}
  .banner img{width:100%;height:100%;object-fit:cover;object-position:72% 50%;display:block;}
  .banner svg{width:100%;height:100%;display:block;}
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,19,32,.55),transparent 55%);}

  /* титул */
  .hero{position:relative;border-radius:18px;overflow:hidden;min-height:min(74dvh,620px);display:flex;align-items:flex-end;
    border:1px solid var(--line);background:var(--bg2);}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 50%;}
  .hero .hero-img{position:absolute;inset:0;}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,19,32,.92) 0%,rgba(14,19,32,.72) 42%,rgba(14,19,32,.08) 78%);}
  .hero-in{position:relative;padding:clamp(22px,5vw,48px);max-width:560px;}
  .hero-sup{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.24em;color:var(--gold);}
  .hero-title{font-family:var(--f-head);font-weight:700;font-size:clamp(2.6rem,9vw,4.6rem);line-height:1;margin:10px 0 10px;}
  .hero-name{font-family:var(--f-head);font-size:clamp(1.15rem,3.2vw,1.5rem);margin-bottom:14px;}
  .hero-sub{color:var(--dim);margin-bottom:24px;max-width:36ch;}
  .start{font-family:var(--f-body);font-weight:700;font-size:1.05rem;background:var(--gold);color:#0E1320;border:0;
    border-radius:13px;min-height:3.25rem;padding:0 34px;cursor:pointer;}
  .start:hover{filter:brightness(1.08);}
  @media (max-width:620px){ .hero{display:block;min-height:0;} .hero::before{display:none;} .hero .hero-img{position:relative;aspect-ratio:4/3;} .hero .hero-img::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 0%,rgba(18,26,44,0) 45%);} .hero img{object-position:80% 50%;} .hero-in{padding:6px 20px 24px;} }

  /* карта */
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin:14px 0 16px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;
    padding:12px 14px;text-align:left;cursor:pointer;color:var(--text);font-family:var(--f-body);font-size:1rem;min-height:2.75rem;}
  .tile:hover{background:var(--panel2);}
  .tile b{display:block;font-family:var(--f-head);font-size:1.05rem;margin-bottom:2px;}
  .tile span{display:block;color:var(--dim);font-size:.9rem;line-height:1.45;}
  .tile i{font-style:normal;font-family:var(--f-mono);font-size:.76rem;color:var(--gold);letter-spacing:.06em;}
  .quote{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:14px;}
  ol.steps{margin:0;padding-left:1.3em;} ol.steps li{margin-bottom:8px;}

  /* правило */
  .rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 17px;margin-bottom:12px;}
  .ex{font-family:var(--f-head);font-size:1.02rem;color:var(--text);line-height:1.8;margin:8px 0 0;
    padding-left:12px;border-left:2px solid var(--line2);}
  .ex .src{font-family:var(--f-body);font-size:.85rem;color:var(--dim);}
  .cm-ex{color:var(--gold2);font-weight:700;}
  .us{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:4px;}
  .up{text-decoration:underline double;text-decoration-color:var(--blue);text-decoration-thickness:1.5px;text-underline-offset:5px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .two .rule{margin-bottom:0;}
  .yes h3{color:var(--green);} .no3 h3{color:var(--red);}
  ul.sch{margin:0;padding-left:1.15em;} ul.sch li{margin-bottom:9px;}
  .schema{font-family:var(--f-mono);font-size:.9rem;color:var(--gold2);white-space:nowrap;}
  .trap{background:var(--gold-bg);border:1px solid rgba(212,166,74,.35);border-left:3px solid var(--gold);
    border-radius:11px;padding:13px 16px;margin-top:12px;}
  .trap b{color:var(--gold2);}
  .muted{color:var(--dim);font-size:.93rem;}

  /* упражнения */
  .instr{color:var(--dim);margin-bottom:12px;max-width:68ch;}
  .tools{position:sticky;top:-26px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--bg);padding:10px 0;margin-bottom:10px;border-bottom:1px solid var(--line);box-shadow:0 6px 10px -6px rgba(0,0,0,.6);isolation:isolate;}
  .tools .lab{font-size:.85rem;color:var(--dim);margin-right:2px;}
  .brush{font-family:var(--f-body);font-size:.95rem;color:var(--text);background:transparent;border:1.5px solid var(--line2);
    border-radius:10px;min-height:2.75rem;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .brush.on{border-color:var(--gold);background:var(--gold-bg);}
  .sw{display:inline-block;width:22px;height:10px;}
  .sw.s{border-bottom:2px solid var(--gold);} .sw.p{border-bottom:5px double var(--blue);}
  .sw.r1{background:var(--gold);border-radius:3px;} .sw.r2{background:var(--blue);border-radius:3px;} .sw.r3{background:var(--lilac);border-radius:3px;}

  .list{display:flex;flex-direction:column;gap:11px;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .card.ok{border-color:var(--green);background:var(--green-bg);}
  .card.no{border-color:var(--red);background:var(--red-bg);}
  .card.na{border-color:var(--blue);background:var(--blue-bg);}
  .num{font-family:var(--f-mono);font-size:.8rem;color:var(--dim);margin-bottom:2px;}
  .sent{font-family:var(--f-head);font-size:1.14rem;line-height:2.05;}
  .wd{font:inherit;color:inherit;background:transparent;border:0;border-radius:6px;padding:.32em .04em;margin:0;cursor:pointer;
    display:inline;line-height:inherit;-webkit-tap-highlight-color:transparent;}
  .wd:hover:not(:disabled){background:rgba(241,233,214,.08);}
  .wd:disabled{cursor:default;}
  .cm{color:var(--gold);font-weight:700;font-size:1.35em;line-height:0;margin-left:.02em;}
  .cm.pop{display:inline-block;animation:pop .25s ease-out;}
  @keyframes pop{from{transform:scale(1.8);opacity:.2;}to{transform:none;opacity:1;}}
  .cm.good{color:var(--green);} .cm.bad{color:var(--red);text-decoration:line-through;}
  .cm.miss{color:var(--blue);border:1.5px dashed var(--blue);border-radius:4px;padding:0 .1em;line-height:1;}
  .wd.S{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:5px;}
  .wd.P{text-decoration:underline double;text-decoration-color:var(--blue);text-decoration-thickness:1.5px;text-underline-offset:6px;}
  .wd.r1,.wd.r2,.wd.r3{border-radius:6px;color:#0E1320;}
  .wd.r1{background:var(--gold);} .wd.r2{background:var(--blue);} .wd.r3{background:var(--lilac);}
  .wd sup{font-family:var(--f-mono);font-size:.62em;margin-left:1px;}
  .row-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
  .chip{font-family:var(--f-body);font-size:.92rem;color:var(--text);background:transparent;border:1.5px solid var(--line2);
    border-radius:10px;min-height:2.75rem;min-width:2.75rem;padding:0 12px;cursor:pointer;}
  .chip.on{background:var(--gold);color:#0E1320;border-color:var(--gold);font-weight:700;}
  .chip.t2.on{background:var(--blue);border-color:var(--blue);} .chip.t3.on{background:var(--lilac);border-color:var(--lilac);}
  .chip.t1:not(.on){border-color:rgba(212,166,74,.45);} .chip.t2:not(.on){border-color:rgba(143,178,232,.45);} .chip.t3:not(.on){border-color:rgba(201,163,224,.45);}
  .chip:disabled{cursor:default;opacity:.55;} .chip.on:disabled{opacity:1;}
  .ctl-lab{font-size:.88rem;color:var(--dim);}
  .rowtag{font-family:var(--f-mono);font-size:.8rem;border-radius:6px;padding:1px 7px;color:#0E1320;}
  .rowtag.t1{background:var(--gold);} .rowtag.t2{background:var(--blue);} .rowtag.t3{background:var(--lilac);}
  .flag{font-family:var(--f-mono);font-size:.8rem;margin-top:6px;color:var(--blue);}
  .why{font-size:var(--step);line-height:1.55;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);}
  .why .key{font-family:var(--f-head);font-size:1.05rem;display:block;margin-bottom:4px;}
  .why .cnt{font-family:var(--f-mono);font-size:.85rem;color:var(--gold2);}

  .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .btn{font-family:var(--f-body);font-size:1rem;font-weight:700;border-radius:11px;min-height:2.9rem;padding:0 20px;cursor:pointer;border:1px solid transparent;}
  .btn.main{background:var(--gold);color:#0E1320;} .btn.main:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line2);} .btn.ghost:hover{border-color:var(--gold);}
  .score{font-family:var(--f-mono);font-size:.92rem;color:var(--dim);}
  .score b.g{color:var(--green);} .score b.r{color:var(--red);} .score b.a{color:var(--blue);}
  .hint{flex-basis:100%;color:var(--dim);font-size:.92rem;}

  /* ЕГЭ */
  .ege-q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:12px;}
  .ege-src{font-size:.85rem;color:var(--dim);margin-top:6px;}
  .elist{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .elist li{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px;display:flex;gap:10px;}
  .elist .n{font-family:var(--f-mono);color:var(--gold);font-weight:700;}
  .elist .t{font-family:var(--f-head);font-size:1.08rem;line-height:1.6;}
  .elist li.one{border-color:var(--green);}
  .ans-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .ans-row input{font-family:var(--f-mono);font-size:1.2rem;letter-spacing:.2em;color:var(--text);background:var(--solid);
    border:1.5px solid var(--line2);border-radius:10px;min-height:3rem;width:11rem;padding:0 12px;}
  .ans-row input.ok{border-color:var(--green);} .ans-row input.no{border-color:var(--red);}
  .verdict{font-family:var(--f-mono);font-size:.95rem;}

  /* итог */
  .curtain{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;background:var(--bg);min-height:clamp(300px,34vw,380px);}
  .curtain > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right 60%;}
  .curtain::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,19,32,.9) 0%,rgba(14,19,32,.62) 46%,rgba(14,19,32,0) 72%);}
  .curtain-in{position:relative;z-index:2;padding:22px 24px 24px;max-width:60%;}
  .curtain .stats{grid-template-columns:1fr 1fr;margin:12px 0 0;}
  .curtain .stat{background:rgba(23,30,49,.78);}
  @media (max-width:620px){
    .curtain{border:0;background:none;overflow:visible;min-height:0;}
    .curtain > img{position:relative;display:block;height:auto;aspect-ratio:21/9;border-radius:14px;border:1px solid var(--line);object-position:right center;}
    .curtain::before{display:none;}
    .curtain-in{max-width:none;padding:14px 0 0;}
  }
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:6px 0 18px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat .v{font-family:var(--f-head);font-size:1.9rem;line-height:1.1;}
  .stat .l{font-size:.88rem;color:var(--dim);}
  .topics{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .topic{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:11px;padding:10px 14px;}
  .topic.bad{border-left-color:var(--red);} .topic.mid{border-left-color:var(--gold);} .topic.good{border-left-color:var(--green);}
  .topic .tn{flex:1 1 auto;min-width:150px;} .topic .tv{font-family:var(--f-mono);font-size:.9rem;color:var(--dim);}
  .topic button{font-family:var(--f-body);font-size:.9rem;color:var(--text);background:transparent;border:1px solid var(--line2);
    border-radius:9px;min-height:2.75rem;padding:0 13px;cursor:pointer;}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:11px;padding:14px 16px;}
  .copied{color:var(--green);font-family:var(--f-mono);font-size:.9rem;}
  .copybox{width:100%;min-height:9rem;margin-top:10px;font-family:var(--f-mono);font-size:.85rem;color:var(--text);
    background:var(--solid);border:1px solid var(--line2);border-radius:10px;padding:10px;}

  /* оглавление */
  .toc-overlay{position:fixed;inset:0;z-index:40;background:rgba(6,9,16,.9);display:none;align-items:center;justify-content:center;padding:18px;}
  .toc-overlay.open{display:flex;}
  .toc-panel{background:var(--solid);border:1px solid var(--line2);border-radius:14px;width:min(760px,100%);max-height:86dvh;display:flex;flex-direction:column;}
  .toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .toc-head h2{margin:0;font-size:1.2rem;color:var(--gold2);}
  .toc-close{background:transparent;border:1px solid var(--line2);color:var(--text);border-radius:9px;min-height:2.75rem;padding:0 15px;cursor:pointer;font-family:var(--f-body);font-weight:700;}
  .toc-body{overflow-y:auto;padding:8px 12px 16px;}
  .toc-group{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.1em;color:var(--gold);font-weight:700;margin:14px 6px 6px;}
  .toc-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    border-radius:10px;color:var(--text);font-family:var(--f-body);font-size:.95rem;padding:8px 10px;min-height:2.75rem;cursor:pointer;}
  .toc-item:hover{border-color:var(--line);background:var(--panel);}
  .toc-item.current{border-color:var(--gold);background:var(--gold-bg);}
  .toc-num{font-family:var(--f-mono);font-size:.8rem;color:var(--dim);min-width:26px;}
  .toc-name{flex:1;line-height:1.4;}
  .toc-tag{font-family:var(--f-mono);font-size:.72rem;color:var(--dim);border:1px solid var(--line2);border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .toc-score{font-family:var(--f-mono);font-size:.82rem;min-width:46px;text-align:right;}

  @media (max-width:620px){
    .stage{padding:18px 14px 20px;}
    .two{grid-template-columns:1fr;}
    .map{grid-template-columns:1fr;}
    .toc-tag{display:none;}
    .tools{top:-18px;}
    .schema{white-space:normal;}
    .nav .toggle{padding:0 10px;}
    .nav-mid{flex-wrap:nowrap;gap:6px;}
    .lg{display:none;} .sh{display:inline;}
    .nav > button{min-width:2.75rem;padding:0 12px;}
  }
  @media (max-width:400px){
    .stage{padding:14px 11px 18px;}
    .nav{gap:6px;padding-left:8px;padding-right:8px;}
    .nav button{padding:0 11px;font-size:.88rem;}
    .card,.rule{padding-left:12px;padding-right:12px;}
    .tools{top:-14px;}
    .sent{font-size:1.06rem;}
  }
</style>
</head>
<body>
  <div class="bar" aria-hidden="true"><div class="bar-fill" id="barFill"></div></div>
  <div class="toc-overlay" id="tocOverlay" role="dialog" aria-modal="true" aria-label="Оглавление">
    <div class="toc-panel">
      <div class="toc-head"><h2>Программа концерта</h2><button class="toc-close" id="tocClose" type="button">Закрыть</button></div>
      <div class="toc-body" id="tocBody"></div>
    </div>
  </div>

 "13", "s": [{"p": "Порывистый ветер утих, и повалил крупными хлопьями первый снег.", "why": "Две основы (ветер утих; снег повалил), общего члена нет — запятая перед И.", "t": "Порывистый ветер утих и повалил крупными хлопьями первый снег."}, {"p": "А звёзды неожиданно в тумане блеснули и свет свой холодный под липами пролили.", "why": "Подлежащее одно — звёзды: блеснули и пролили. Одиночный И, запятых нет.", "t": "А звёзды неожиданно в тумане блеснули и свет свой холодный под липами пролили."}, {"p": "По-комариному тонко просвистит малюсенький королёк-оливка, да резко крикнет сойка.", "why": "Две основы: королёк просвистит; сойка крикнет. ДА = И соединяет части сложного предложения, общего члена нет — запятая.", "t": "По-комариному тонко просвистит малюсенький королёк-оливка да резко крикнет сойка."}, {"p": "Срубленные осины придавили собой траву и мелкий кустарник.", "why": "Однородные дополнения с одиночным И — запятых нет.", "t": "Срубленные осины придавили собой траву и мелкий кустарник."}, {"p": "Я или зарыдаю, или закричу, или в обморок упаду.", "why": "Повторяющийся ИЛИ…ИЛИ…ИЛИ: запятые перед вторым и третьим. Две.", "t": "Я или зарыдаю или закричу или в обморок упаду."}]}, {"src": "Сборник Дощинского, вариант 43", "key": "345", "s": [{"p": "К полудню дождь уже не сеял сквозь солнечные лучи свои прозрачные капли и небо было подёрнуто сизой дымкой.", "why": "«К полудню» общее для обеих основ — запятой нет.", "t": "К полудню дождь уже не сеял сквозь солнечные лучи свои прозрачные капли и небо было подёрнуто сизой дымкой."}, {"p": "Мгновения полного единения мыслей и устремлений мы страшились спугнуть неверным словом или даже некстати брошенным взглядом.", "why": "Одиночный ИЛИ — запятых нет.", "t": "Мгновения полного единения мыслей и устремлений мы страшились спугнуть неверным словом или даже некстати брошенным взглядом."}, {"p": "В территориальной общине людей объединяло прежде всего не родство, а общность территории и хозяйственной жизни.", "why": "Противительный А: не родство, а общность — запятая. «Прежде всего» здесь не вводное.", "t": "В территориальной общине людей объединяло прежде всего не родство а общность территории и хозяйственной жизни."}, {"p": "В свои тяжёлые русые косы Катюша вплетала то розовые, то белые шёлковые ленты.", "why": "ТО… ТО — запятая перед вторым ТО. «Белые шёлковые» — неоднородные определения.", "t": "В свои тяжёлые русые косы Катюша вплетала то розовые то белые шёлковые ленты."}, {"p": "Вековые сосны угрюмы, и полны они тягостных дум.", "why": "Похоже на однородные сказуемые, но во второй части своё подлежащее «они». Две основы — запятая.", "t": "Вековые сосны угрюмы и полны они тягостных дум."}]}, {"src": "Сборник Дощинского, вариант 9", "key": "235", "s": [{"p": "Боярская дочь не хотела ни пить, ни есть, перестала спать и насилу могла ходить.", "why": "НИ…НИ: запятая перед вторым НИ; ещё запятая между сказуемыми без союза (не хотела…, перестала). Две.", "t": "Боярская дочь не хотела ни пить ни есть перестала спать и насилу могла ходить."}, {"p": "Во времена Шекспира в театре не было актрис, и поэтому женские роли тогда исполнялись исключительно мужчинами.", "why": "Две основы (актрис не было; роли исполнялись). «Во времена Шекспира» не общее: во второй части своё «тогда». Запятая.", "t": "Во времена Шекспира в театре не было актрис и поэтому женские роли тогда исполнялись исключительно мужчинами."}, {"p": "Довольно скоро он мог бы обжиться в этом районе, да не подружился с соседями.", "why": "ДА = НО: «мог бы обжиться, но не подружился». Запятая.", "t": "Довольно скоро он мог бы обжиться в этом районе да не подружился с соседями."}, {"p": "Квартира предназначалась для содержания жильцов со столом и прислугой и занята была Ганей и его семейством не более двух месяцев.", "why": "Подлежащее одно — квартира: предназначалась и занята была. Запятых нет.", "t": "Квартира предназначалась для содержания жильцов со столом и прислугой и занята была Ганей и его семейством не более двух месяцев."}, {"p": "Гул битвы то затихал, то начинал бушевать с невиданной силой.", "why": "ТО… ТО — запятая перед вторым ТО.", "t": "Гул битвы то затихал то начинал бушевать с невиданной силой."}]}, {"src": "Сборник Дощинского, вариант 27", "key": "134", "s": [{"p": "Загремела якорная цепь, и корма парохода задрожала и зашумела винтами и водой.", "why": "Две основы (цепь загремела; корма задрожала и зашумела) — запятая перед первым И. Остальные И одиночные.", "t": "Загремела якорная цепь и корма парохода задрожала и зашумела винтами и водой."}, {"p": "К кормушкам прилетали и воробьи, и синицы, и сороки.", "why": "Повторяющийся И перед каждым членом: и воробьи, и синицы, и сороки — две запятые.", "t": "К кормушкам прилетали и воробьи и синицы и сороки."}, {"p": "Победный бросок капитана баскетбольной команды не только позволил досрочно завершить матч, но и обеспечил выход команды в суперфинал.", "why": "НЕ ТОЛЬКО… НО И — запятая перед НО И.", "t": "Победный бросок капитана баскетбольной команды не только позволил досрочно завершить матч но и обеспечил выход команды в суперфинал."}, {"p": "Было спокойно и тепло, и гомон невидимых насекомых не прерывался.", "why": "Две основы: было спокойно и тепло (без подлежащего); гомон не прерывался. Запятая перед вторым И.", "t": "Было спокойно и тепло и гомон невидимых насекомых не прерывался."}, {"p": "По вечерам взрослые обсуждали свои дела и дети весело играли в мяч.", "why": "«По вечерам» общее для обеих основ — запятой нет.", "t": "По вечерам взрослые обсуждали свои дела и дети весело играли в мяч."}]}, {"src": "Сборник Дощинского, вариант 36", "key": "13", "s": [{"p": "На вольном просторе блеск и движение, грохот и гром.", "why": "Попарно: блеск и движение, грохот и гром — запятая между парами.", "t": "На вольном просторе блеск и движение грохот и гром."}, {"p": "Без матери не было бы ни тепла, ни радости, ни жизни.", "why": "НИ…НИ…НИ перед каждым членом — две запятые.", "t": "Без матери не было бы ни тепла ни радости ни жизни."}, {"p": "Миновали столетия, и под натиском варваров пала когда-то могучая Римская империя.", "why": "Две основы (столетия миновали; империя пала), общего члена нет — запятая.", "t": "Миновали столетия и под натиском варваров пала когда-то могучая Римская империя."}, {"p": "Человек велик, да прекрасен, да полон мечты.", "why": "Повторяющийся ДА…ДА: велик, да прекрасен, да полон — две запятые.", "t": "Человек велик да прекрасен да полон мечты."}, {"p": "Художники и скульпторы объединились и создали свою ассоциацию.", "why": "Однородные подлежащие и однородные сказуемые с одиночным И — запятых нет.", "t": "Художники и скульпторы объединились и создали свою ассоциацию."}]}]};

function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

const OPT = new Set("в во на с со о об обо к ко по из от до за над под у для без через при про перед между сквозь вокруг вдоль и или либо да но а ни не то как так же ли бы только".split(" "));
const bare = w => w.toLowerCase().replace(/[«».,!?:;…()—"]/g,"");

/* ==================== ПРОВЕРКА ПОЗИЦИЙ ==================== */
/* каждая функция возвращает {st:"ok"|"no"|"e", x:лишние, m:пропущенные} */
function evalCommas(it, a){
  if(!a || (!a.none && !(a.c && a.c.length))) return {st:"e", x:0, m:0};
  const mine = a.none ? [] : a.c;
  const x = mine.filter(i=>!it.c.includes(i)).length;
  const m = it.c.filter(i=>!mine.includes(i)).length;
  return {st:(x||m) ? "no" : "ok", x, m};
}
function evalOsn(it, a){
  const marks = (a && a.m) || {};
  if(!a || (a.n == null && !Object.keys(marks).length)) return {st:"e"};
  if(a.n !== it.n) return {st:"no"};
  for(let i=0;i<it.w.length;i++){
    const need = it.r[i], got = marks[i] || "";
    if(need === "O") continue;
    if(!need && OPT.has(bare(it.w[i])) && bare(it.w[i]) !== "") { if(got) continue; }
    if(need !== got) return {st:"no"};
  }
  return {st:"ok"};
}
function rowsOf(it){ const r={}; it.r.forEach((v,i)=>{ if(v){ (r[v]=r[v]||[]).push(i); } }); return r; }
function evalRows(it, a){
  const marks = (a && a.m) || {};
  const types = (a && a.t) || {};
  const used = Object.keys(marks).length;
  if(!a || (!a.none && !used)) return {st:"e"};
  const need = rowsOf(it);
  const needKeys = Object.keys(need);
  if(a.none) return {st: needKeys.length ? "no" : "ok"};
  const mine = {};
  Object.keys(marks).forEach(i=>{ const w = it.w[i]; if(it.r[i]===0 && OPT.has(bare(w))) return; (mine[marks[i]]=mine[marks[i]]||[]).push(+i); });
  const mineKeys = Object.keys(mine);
  if(mineKeys.length !== needKeys.length) return {st:"no"};
  const usedMine = new Set();
  for(const nk of needKeys){
    const target = need[nk].slice().sort((p,q)=>p-q).join(",");
    const hit = mineKeys.find(mk=>!usedMine.has(mk) && mine[mk].slice().sort((p,q)=>p-q).join(",") === target);
    if(!hit) return {st:"no"};
    if(types[hit] !== it.t[nk]) return {st:"no"};
    usedMine.add(hit);
  }
  return {st:"ok"};
}
function evalItem(s, i){
  const it = s.items[i], a = A(s.k)[i];
  if(s.type === "commas") return evalCommas(it, a);
  if(s.type === "osn") return evalOsn(it, a);
  if(s.type === "rows") return evalRows(it, a);
}
function parseEge(v){ const d = String(v||"").replace(/[^1-5]/g,""); return [...new Set(d.split(""))].sort().join(""); }

function scoreOf(s){ return PH(s.k) ? scoreRaw(s) : null; }
function scoreRaw(s){
  if(s.type === "ege"){
    const v = parseEge(A(s.k).v);
    if(!v) return {r:0,w:0,e:1,t:1,x:0,m:0};
    const ok = v === s.data.key;
    return {r:ok?1:0, w:ok?0:1, e:0, t:1, x:0, m:0};
  }
  if(!s.items) return null;
  let r=0,w=0,e=0,x=0,m=0;
  s.items.forEach((it,i)=>{ const v = evalItem(s,i); if(v.st==="ok") r++; else if(v.st==="no") w++; else e++; x += v.x||0; m += v.m||0; });
  return {r,w,e,t:s.items.length,x,m};
}

let AC = null;
function audio(){
  if(!ST.snd) return null;
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function note(ctx, f, t, dur, vol){
  try{
    const g = ctx.createGain(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), lp = ctx.createBiquadFilter();
    o1.type = "triangle"; o1.frequency.value = f;
    o2.type = "sine"; o2.frequency.value = f*2;
    lp.type = "lowpass"; lp.frequency.value = 2400;
    const g2 = ctx.createGain(); g2.gain.value = .25;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o1.start(t); o2.start(t); o1.stop(t+dur+.05); o2.stop(t+dur+.05);
  }catch(e){}
}
const HZ = n => 440*Math.pow(2,(n-69)/12);

  const t = c.currentTime + .05;
  [60,64,67,72].forEach((n,i)=>note(c, HZ(n), t+i*.14, 1.6, .16));

}
function playCorrect(count, whole){
  const c = audio(); if(!c || count <= 0) return;
  const t = c.currentTime + .05;
  const k = Math.min(count, 12);
  for(let i=0;i<k;i++){ note(c, HZ(MEL[(ST.mel + i) % MEL.length]), t + i*.13, .7, .14); }
  ST.mel = (ST.mel + k) % MEL.length;
  if(whole){ const tt = t + k*.13 + .08; [60,67,72,76].forEach(n=>note(c, HZ(n), tt, 2, .07)); }
}

/* --- общий футер с двухшаговой проверкой --- */
function scoreLine(sc){
  if(!sc) return "";
  let o = '<span class="score">Верно <b class="g">'+sc.r+'</b>';
  if(sc.w) o += ' · неверно <b class="r">'+sc.w+'</b>';
  if(sc.e) o += ' · не отвечено <b class="a">'+sc.e+'</b>';
  return o + ' из '+sc.t+'</span>';
}
function footer(el, s){
  const k = s.k, ph = PH(k), foot = el.querySelector("#foot");
  let h = "";
  if(ph === 0 || ph === 15){
    h = '<button class="btn main" type="button" id="chk">Проверить</button>' +
        (ph === 15 ? '<span class="score">Открыты только неверные и пропущенные</span>' : '');
  } else if(ph === 1){
    h = '<button class="btn main" type="button" id="again">Ещё попытка</button>' + (s.type === "ege" ? "" : scoreLine(scoreOf(s))) +
        '<div class="hint">' + (s.type === "ege"
          ? 'Пройдите ещё раз по каждому предложению: основы, ряды, союзы, определения — и пересчитайте запятые.'
          : 'Верные ответы закреплены. Неверные и пропущенные откроются для правки — правильный вариант пока не показываем, вспоминайте.') + '</div>';
  } else {
    h = scoreLine(scoreOf(s)) + '<button class="btn ghost" type="button" id="rst">Пройти заново</button>';
  }
  foot.innerHTML = h;
  const chk = foot.querySelector("#chk"), ag = foot.querySelector("#again"), rs = foot.querySelector("#rst");
  if(chk) chk.addEventListener("click", ()=>doCheck(s));
  if(ag) ag.addEventListener("click", ()=>{ ST.ph[k] = 15; save(); rerender(); });
  if(rs) rs.addEventListener("click", ()=>{ ST.ans[k] = {}; ST.ph[k] = 0; ST.fr[k] = []; delete ST.first[k]; save(); rerender(); });
}
function doCheck(s){

    const ok = parseEge(A(k).v) === s.data.key;
    if(ok) playCorrect(5, true);
    ST.ph[k] = (ok || ph === 15) ? 2 : 1;
    save(); rerender(); return;
  }
  const frozen = [];
  let pending = 0;
  s.items.forEach((it,i)=>{ (evalItem(s,i).st === "ok") ? frozen.push(i) : pending++; });
  const fresh = frozen.filter(i=>!before.includes(i)).length;
  ST.fr[k] = frozen;
  ST.ph[k] = (pending === 0 || ph === 15) ? 2 : 1;
  playCorrect(fresh, pending === 0);
  save(); rerender();
}
function live(s, i){ const ph = PH(s.k); return ph === 0 || (ph === 15 && !FR(s.k).includes(i)); }
function cardCls(s, i){
  const ph = PH(s.k); if(!ph || ph === 15 && !FR(s.k).includes(i)) return "card";
  const st = evalItem(s,i).st;
  return "card " + (st === "ok" ? "ok" : st === "no" ? "no" : "na");
}
function cardFlag(s, i){
  const ph = PH(s.k); if(ph !== 1 && ph !== 2) return "";
  return evalItem(s,i).st === "e" ? '<div class="flag">не отвечено</div>' : "";
}

/* --- запятые: нажатие на слово --- */
function rCommas(el, s){
  const k = s.k, ph = PH(k), ans = A(k);
  const cards = ORD[k].map((i,pos)=>{
    const it = s.items[i], a = ans[i] || {}, mine = a.none ? [] : (a.c || []), lv = live(s,i);
    let words;
    if(ph === 2){
      words = it.w.map((w,wi)=>{
        const need = it.c.includes(wi), got = mine.includes(wi);
        let mark = "";
        if(need && got) mark = '<span class="cm good">,</span>';
        else if(got) mark = '<span class="cm bad">,</span>';
        else if(need) mark = '<span class="cm miss">,</span>';
        return '<span class="wd">'+esc(w)+mark+'</span>';
      }).join(" ");
    } else {
      words = it.w.map((w,wi)=>{
        const last = wi === it.w.length-1;
        const on = mine.includes(wi);
        const pop = (on && POP && POP[0]===k && POP[1]===i && POP[2]===wi) ? " pop" : "";
        return '<button type="button" class="wd" data-i="'+i+'" data-w="'+wi+'"'+((!lv||last)?" disabled":"")+'>'+esc(w)+(on?'<span class="cm'+pop+'">,</span>':'')+'</button>';
      }).join(" ");
    }
    let why = "";
    if(ph === 2){
      const n = it.c.length;
      why = '<div class="why"><span class="cnt">'+(n===0?"запятых нет":n===1?"одна запятая":n+" запятые")+'</span><br>'+esc(it.why)+'</div>';
    }
    const none = (ph === 2) ? "" :
      '<div class="row-ctl"><button type="button" class="chip'+(a.none?" on":"")+'" data-none="'+i+'"'+(lv?"":" disabled")+'>Запятые не нужны</button></div>';
    return '<div class="'+cardCls(s,i)+'"><div class="num">'+(pos+1)+'</div><div class="sent">'+words+'</div>'+none+cardFlag(s,i)+why+'</div>';
  }).join("");
  el.innerHTML = head(s, s.title) + '<p class="instr">'+(s.instr || TAP_INSTR)+'</p><div class="list">'+cards+'</div><div class="foot" id="foot"></div>';
  POP = null;
  el.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.i, wi = +b.dataset.w, a = ans[i] || (ans[i] = {c:[]});
    a.c = a.c || []; a.none = false;
    const p = a.c.indexOf(wi);
    if(p === -1){ a.c.push(wi); POP = [k,i,wi]; } else a.c.splice(p,1);
    RESTORE = '[data-i="'+i+'"][data-w="'+wi+'"]'; save(); rerender();
  }));
  el.querySelectorAll("[data-none]").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.none, a = ans[i] || (ans[i] = {c:[]});
    a.none = !a.none; if(a.none) a.c = [];
    RESTORE = '[data-none="'+i+'"]'; save(); rerender();
  }));
  footer(el, s);
}
let POP = null;

/* --- основа: число основ и кисти --- */
let BRUSH_OSN = "S";
function markedWords(it, marks, cls){
  return it.w.map((w,wi)=>{ const r = marks[wi]; return '<span class="wd'+(r?" "+cls(r):"")+'">'+esc(w)+'</span>'; }).join(" ");
}
function rOsn(el, s){
  const k = s.k, ph = PH(k), ans = A(k);
  const tools = (ph === 2) ? "" :
    '<div class="tools"><span class="lab">Кисть:</span>' +
    [["S",'<span class="sw s"></span>Подлежащее'],["P",'<span class="sw p"></span>Сказуемое'],["X","Стереть"]].map(b=>
      '<button type="button" class="brush'+(BRUSH_OSN===b[0]?" on":"")+'" data-brush="'+b[0]+'">'+b[1]+'</button>').join("") + '</div>';
  const cards = ORD[k].map((i,pos)=>{
    const it = s.items[i], a = ans[i] || {}, marks = a.m || {}, lv = live(s,i);

      body = '<div class="sent">'+markedWords(it, marks, r=>r)+'</div>';
    } else {
      body = '<div class="sent">'+it.w.map((w,wi)=>{
        const r = marks[wi];

    }

      '<button type="button" class="chip'+(a.n===n?" on":"")+'" data-i="'+i+'" data-n="'+n+'"'+((lv && ph!==2)?"":" disabled")+'>'+n+'</button>').join("") + '</div>';
    let why = "";

    }
    return '<div class="'+cardCls(s,i)+'"><div class="num">'+(pos+1)+'</div>'+body+cnt+cardFlag(s,i)+why+'</div>';

  el.innerHTML = head(s, s.title) + '<p class="instr">'+s.instr+'</p>' + tools + '<div class="list">'+cards+'</div><div class="foot" id="foot"></div>';
  el.querySelectorAll("[data-brush]").forEach(b=>b.addEventListener("click",()=>{ BRUSH_OSN = b.dataset.brush; RESTORE='[data-brush="'+BRUSH_OSN+'"]'; rerender(); }));
  el.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{

    a.m = a.m || {};

/* --- ряды однородных --- */
let BRUSH_ROW = 1;
const TYPES = ["подлежащие","сказуемые","дополнения","определения","обстоятельства"];
function rRows(el, s){
  const k = s.k, ph = PH(k), ans = A(k);
  const tools = (ph === 2) ? "" :
    '<div class="tools"><span class="lab">Кисть:</span>' +
    [[1,'<span class="sw r1"></span>Ряд 1'],[2,'<span class="sw r2"></span>Ряд 2'],[3,'<span class="sw r3"></span>Ряд 3'],[0,"Стереть"]].map(b=>
      '<button type="button" class="brush'+(BRUSH_ROW===b[0]?" on":"")+'" data-brush="'+b[0]+'">'+b[1]+'</button>').join("") + '</div>';
  const cards = ORD[k].map((i,pos)=>{
    const it = s.items[i], a = ans[i] || {}, marks = a.m || {}, types = a.t || {}, lv = live(s,i);
    const wordsHTML = (m, clickable)=> it.w.map((w,wi)=>{
      const r = m[wi];
      const cls = "wd" + (r ? " r"+r : "");
      const inner = esc(w) + (r ? "<sup>"+r+"</sup>" : "");
      return clickable ? '<button type="button" class="'+cls+'" data-i="'+i+'" data-w="'+wi+'"'+(lv?"":" disabled")+'>'+inner+'</button>'
                       : '<span class="'+cls+'">'+inner+'</span>';
    }).join(" ");
    let body = '<div class="sent">'+wordsHTML(marks, ph !== 2)+'</div>';
    let ctl = "";
    if(ph !== 2){
      const usedRows = [...new Set(Object.values(marks))].sort();
      ctl = usedRows.map(r=>'<div class="row-ctl"><span class="rowtag t'+r+'">ряд '+r+'</span>' + TYPES.map(t=>
        '<button type="button" class="chip t'+r+(types[r]===t?" on":"")+'" data-i="'+i+'" data-row="'+r+'" data-t="'+t+'"'+(lv?"":" disabled")+'>'+t+'</button>').join("") + '</div>').join("") +
        '<div class="row-ctl"><button type="button" class="chip'+(a.none?" on":"")+'" data-none="'+i+'"'+(lv?"":" disabled")+'>Однородных нет</button></div>';
    }
    let why = "";
    if(ph === 2){
      const right = {}; it.r.forEach((r,wi)=>{ if(r) right[wi] = r; });
      const list = Object.keys(it.t).map(r=>'<span class="rowtag t'+r+'">ряд '+r+'</span> '+esc(it.t[r])).join(" · ");
      why = '<div class="why"><span class="key">'+wordsHTML(right, false)+'</span>'+(list ? list+'<br>' : '<span class="cnt">однородных нет</span><br>')+esc(it.why)+'</div>';
    }
    return '<div class="'+cardCls(s,i)+'"><div class="num">'+(pos+1)+'</div>'+body+ctl+cardFlag(s,i)+why+'</div>';
  }).join("");
  el.innerHTML = head(s, s.title) + '<p class="instr">'+s.instr+'</p>' + tools + '<div class="list">'+cards+'</div><div class="foot" id="foot"></div>';
  el.querySelectorAll("[data-brush]").forEach(b=>b.addEventListener("click",()=>{ BRUSH_ROW = +b.dataset.brush; RESTORE='[data-brush="'+BRUSH_ROW+'"]'; rerender(); }));
  el.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.i, wi = +b.dataset.w, a = ans[i] || (ans[i] = {m:{}, t:{}});
    a.m = a.m || {}; a.t = a.t || {}; a.none = false;
    if(BRUSH_ROW === 0 || a.m[wi] === BRUSH_ROW) delete a.m[wi]; else a.m[wi] = BRUSH_ROW;
    const left = new Set(Object.values(a.m)); Object.keys(a.t).forEach(r=>{ if(!left.has(+r)) delete a.t[r]; });
    RESTORE = '[data-i="'+i+'"][data-w="'+wi+'"]'; save(); rerender();
  }));
  el.querySelectorAll("[data-row]").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.i, r = b.dataset.row, t = b.dataset.t, a = ans[i];
    a.t = a.t || {}; a.t[r] = (a.t[r] === t) ? undefined : t; if(!a.t[r]) delete a.t[r];
    RESTORE = '[data-i="'+i+'"][data-row="'+r+'"][data-t="'+t+'"]'; save(); rerender();
  }));
  el.querySelectorAll("[data-none]").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.none, a = ans[i] || (ans[i] = {m:{}, t:{}});
    a.none = !a.none; if(a.none){ a.m = {}; a.t = {}; }
    RESTORE = '[data-none="'+i+'"]'; save(); rerender();
  }));
  footer(el, s);
}

function rEge(el, s){
  const k = s.k, ph = PH(k), a = A(k), D = s.data, lv = ph === 0 || ph === 15;
  const val = a.v || "";
  const ok = parseEge(val) === D.key;
  const items = D.s.map((x,i)=>{
    if(ph === 2){
      const n = (x.p.match(/,/g)||[]).length;
      return '<li class="'+(n===1?"one":"")+'"><span class="n">'+(i+1)+')</span><span class="t">'+
        esc(x.p).replace(/,/g,'<span class="cm-ex">,</span>')+'<div class="why" style="border:0;padding-top:4px;margin-top:4px;"><span class="cnt">'+(n===0?"запятых нет":n===1?"одна запятая":n+" запятые")+'</span> — '+esc(x.why)+'</div></span></li>';
    }
    return '<li><span class="n">'+(i+1)+')</span><span class="t">'+esc(x.t)+'</span></li>';
  }).join("");
  let verdict = "";

  if(ph === 1) verdict = empty ? '<span class="verdict" style="color:var(--blue)">Не отвечено</span>'
                               : '<span class="verdict" style="color:var(--'+(ok?"green":"red")+')">'+(ok?"Верно":"Неверно")+'</span>';
  if(ph === 2) verdict = '<span class="verdict">Ответ: <b style="color:var(--gold2)">'+D.key+'</b>'+(ok?' · <span style="color:var(--green)">у вас верно</span>':' · у вас: '+(esc(val)||"—")+'</span>');
  el.innerHTML =
    '<div class="kicker">Концерт · '+esc(s.title)+'</div><h1>Задание 16</h1>' +
    '<div class="ege-q">Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.<div class="ege-src">'+esc(D.src)+'</div></div>' +
    '<ol class="elist">'+items+'</ol>' +
    '<div class="ans-row"><label for="egeIn" class="ctl-lab">Ответ:</label><input id="egeIn" inputmode="numeric" autocomplete="off" maxlength="9" value="'+esc(val)+'"'+(lv?"":" disabled")+(ph?' class="'+(ok?"ok":"no")+'"':'')+'>'+verdict+'</div>' +
    '<div class="foot" id="foot"></div>';
  const inp = el.querySelector("#egeIn");
  inp.addEventListener("input", ()=>{ a.v = inp.value; save(); });
  footer(el, s);
}

/* --- итог --- */
function rFinal(el, s){
  const secs = {};
  SLIDES.forEach(x=>{
    if(!x.sec || x.type === "rule") return;
    const b = secs[x.sec] || (secs[x.sec] = {r:0,w:0,e:0,t:0,x:0,m:0,back:x.back||x.k,any:false});
    const sc = baseScore(x); if(!sc) return;
    b.any = true; b.r+=sc.r; b.w+=sc.w; b.e+=sc.e; b.t+=sc.t; b.x+=sc.x||0; b.m+=sc.m||0;
  });
  let R=0,W=0,X=0,M=0;
  Object.values(secs).forEach(b=>{ R+=b.r; W+=b.w; X+=b.x; M+=b.m; });
  const pct = (R+W) ? Math.round(R/(R+W)*100) : null;
  const done = Math.round((ST.max+1)/SLIDES.length*100);
  const list = Object.keys(secs).map(n=>{ const b = secs[n]; const p = (b.any && b.r+b.w) ? Math.round(b.r/(b.r+b.w)*100) : null; return {n,b,p}; })
    .sort((a,b)=>{ if(a.p===null) return 1; if(b.p===null) return -1; return a.p-b.p; });
  const topics = list.map(o=>{
    const cls = o.p===null ? "" : o.p<55 ? " bad" : o.p<80 ? " mid" : " good";
    const v = (o.p===null ? "не пройдено" : o.p+"%") + (o.b.e ? " · пропущено "+o.b.e : "");
    return '<div class="topic'+cls+'"><span class="tn">'+esc(o.n)+'</span><span class="tv">'+v+'</span><button type="button" data-b="'+esc(o.b.back)+'">К теории</button></div>';
  }).join("");
  const bow = BANNERS[s.banner];
  el.innerHTML = (bow ? '<div class="curtain"><img src="'+bow+'" alt=""><div class="curtain-in">' : '<div>' + bannerHTML(s.banner) + '<div>') +
    '<div class="kicker">Поклон · Итог</div><h1>Что получилось с заданием 16</h1>' +
    '<div class="stats">' +
      '<div class="stat"><div class="v">'+done+'%</div><div class="l">пройдено</div></div>' +
      '<div class="stat"><div class="v">'+(pct===null?"—":pct+"%")+'</div><div class="l">верно с первой попытки</div></div>' +
      '<div class="stat"><div class="v">'+X+'</div><div class="l">лишних запятых — лишних вдохов</div></div>' +
      '<div class="stat"><div class="v">'+M+'</div><div class="l">пропущенных запятых</div></div>' +
    '</div></div></div>' +
    '<p class="lead">Проценты считаются по <b class="hl">первой проверке</b>: исправления после «Ещё попытки» в них не входят, иначе слабые темы перестали бы быть видны.</p>' +
    '<h2>Темы на повторение</h2><p class="lead">Сверху — то, что проседает сильнее всего. Эти же проценты видны в оглавлении.</p>' +
    '<div class="topics">'+topics+'</div>' +
    '<div class="foot" style="margin-bottom:14px;"><button class="btn main" type="button" id="cp">Скопировать итог</button>' +
    '<button class="btn ghost" type="button" id="clr">Очистить прогресс</button><span id="cpmsg"></span></div><div id="cpbox"></div>' +
    '<div class="note"><b>Что делать дальше.</b> Если лишних запятых больше, чем пропущенных, — вы ставите вдох «на слух»: вернитесь к одиночным союзам и неоднородным определениям. Если больше пропущенных — повторите двойные союзы и сложносочинённое предложение.</div>';
  el.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>go(IDX[b.dataset.b])));
  el.querySelector("#cp").addEventListener("click", ()=>copySummary(list, pct, done, X, M));
  const clr = el.querySelector("#clr");
  clr.addEventListener("click", ()=>{
    if(clr.dataset.arm !== "1"){ clr.dataset.arm = "1"; clr.textContent = "Точно стереть? Нажмите ещё раз"; return; }
    ST.ans={}; ST.ph={}; ST.fr={}; ST.first={}; ST.max=ST.cur; ST.mel=0; save(); rerender();
  });
}
function copySummary(list, pct, done, X, M){
  const L = ["Задание 16. Однородные члены и сложное предложение — итог тренажёра",
    "Пройдено: "+done+"%. Верно с первой попытки: "+(pct===null?"—":pct+"%")+".",
    "Лишних запятых: "+X+". Пропущенных запятых: "+M+".", ""];
  list.forEach(o=>L.push("• "+o.n+" — "+(o.p===null?"не пройдено":o.p+"% (верно "+o.b.r+", неверно "+o.b.w+(o.b.e?", пропущено "+o.b.e:"")+")")));
  const text = L.join("\n");
  const ok = ()=>{ const m = document.getElementById("cpmsg"); if(m){ m.className="copied"; m.textContent="Скопировано"; } };
  const manual = ()=>{ const box = document.getElementById("cpbox"); if(box){ box.innerHTML = '<p class="muted">Скопировать автоматически не получилось. Выделите текст и скопируйте вручную:</p><textarea class="copybox" readonly>'+esc(text)+'</textarea>'; } };
  const fallback = ()=>{
    try{
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      const done2 = document.execCommand && document.execCommand("copy"); ta.remove();
      if(done2) ok(); else manual();
    }catch(e){ manual(); }
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }catch(e){ fallback(); }
}

/* ==================== НАВИГАЦИЯ ==================== */
function go(i){
  ST.cur = Math.max(0, Math.min(SLIDES.length-1, i));
  ST.max = Math.max(ST.max, ST.cur);
  save(); render(ST.cur); updateNav(); stage.scrollTop = 0;
}
function updateNav(){
  prevBtn.disabled = ST.cur === 0;
  nextBtn.disabled = ST.cur === SLIDES.length-1;
  const narrow = window.matchMedia && window.matchMedia("(max-width:620px)").matches;
  counter.textContent = narrow ? (ST.cur+1)+" / "+SLIDES.length+" ▾" : "слайд "+(ST.cur+1)+" из "+SLIDES.length+" ▾";
  counter.setAttribute("aria-label", "Оглавление, слайд "+(ST.cur+1)+" из "+SLIDES.length);
  barFill.style.width = Math.round((ST.cur+1)/SLIDES.length*100)+"%";
}

  return s.title;
}
const tocOverlay = document.getElementById("tocOverlay"), tocBody = document.getElementById("tocBody");
function buildTOC(){
  let h = "", last = null;
  SLIDES.forEach((s,i)=>{
    const grp = s.mus || null;
    if(grp && grp !== last){ h += '<div class="toc-group">'+esc(grp.toUpperCase())+'</div>'; last = grp; }
    const f = baseScore(s);
    let sc = '<span class="toc-score" style="color:var(--dim)">·</span>';
    if(f){ const n = f.r+f.w; const p = n ? Math.round(f.r/n*100) : null;
      const col = p===null ? "var(--dim)" : p>=80 ? "var(--green)" : p>=55 ? "var(--gold)" : "var(--red)";
      sc = '<span class="toc-score" style="color:'+col+'">'+(p===null?"—":p+"%")+'</span>'; }
    h += '<button type="button" class="toc-item'+(i===ST.cur?" current":"")+'" data-i="'+i+'"><span class="toc-num">'+(i+1)+'</span><span class="toc-name">'+esc(slideName(s))+'</span><span class="toc-tag">'+esc(TAGS[s.type]||"")+'</span>'+sc+'</button>';
  });
  tocBody.innerHTML = h;
  tocBody.querySelectorAll(".toc-item").forEach(b=>b.addEventListener("click",()=>{ closeTOC(); go(+b.dataset.i); }));
  const cur = tocBody.querySelector(".toc-item.current");
  if(cur && cur.scrollIntoView) setTimeout(()=>{ try{ cur.scrollIntoView({block:"center"}); }catch(e){} }, 0);
}
function openTOC(){ buildTOC(); tocOverlay.classList.add("open"); const c = tocBody.querySelector(".toc-item.current"); if(c) c.focus({preventScroll:true}); }
function closeTOC(){ if(!tocOverlay.classList.contains("open")) return; tocOverlay.classList.remove("open"); counter.focus({preventScroll:true}); }
counter.addEventListener("click", openTOC);
document.getElementById("tocClose").addEventListener("click", closeTOC);
tocOverlay.addEventListener("click", e=>{ if(e.target === tocOverlay) closeTOC(); });
prevBtn.addEventListener("click", ()=>go(ST.cur-1));
nextBtn.addEventListener("click", ()=>go(ST.cur+1));
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeTOC(); return; }
  if(tocOverlay.classList.contains("open")) return;
  const t = e.target;
  if(t && t.closest && (t.closest("input,textarea") || t.closest("button"))) return;
  if(e.key === "ArrowRight") go(ST.cur+1);
  if(e.key === "ArrowLeft") go(ST.cur-1);
});
function setCalm(on){ ST.calm = on; document.body.classList.toggle("calm", on); calmBtn.setAttribute("aria-pressed", on?"true":"false");
  calmBtn.innerHTML = on ? '<span class="lg">Движение выключено</span><span class="sh">Спокойно ✓</span>' : '<span class="lg">Спокойный режим</span><span class="sh">Спокойно</span>'; save(); }
function setSnd(on){ ST.snd = on; sndBtn.setAttribute("aria-pressed", on?"true":"false"); sndBtn.innerHTML = on ? '♪<span class="lg"> Звук</span>' : '<s>♪</s><span class="lg"> Без звука</span>'; sndBtn.setAttribute("aria-label", on ? "Звук включён" : "Звук выключен"); save(); }
calmBtn.addEventListener("click", ()=>setCalm(!ST.calm));
sndBtn.addEventListener("click", ()=>{ setSnd(!ST.snd); if(ST.snd){ const c = audio(); if(c) note(c, HZ(76), c.currentTime+.03, .6, .12); } });
setCalm(!!ST.calm); setSnd(ST.snd !== false);
function fitHeight(){
  try{
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height : window.innerHeight);
    if(h > 200) document.body.style.maxHeight = h + "px";
  }catch(e){}
}
fitHeight();
try{ if(window.visualViewport) window.visualViewport.addEventListener("resize", fitHeight); }catch(e){}
window.addEventListener("orientationchange", ()=>setTimeout(fitHeight, 300));
window.addEventListener("resize", ()=>{ updateNav(); fitHeight(); });
go(ST.cur || 0);
</script>
</body>
</html>
