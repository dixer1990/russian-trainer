<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Задание 13 ЕГЭ. Правописание НЕ и НИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0B0716; --bg2:#150D2B; --bg3:#221547;
    --panel:rgba(255,255,255,.06);
    --panel-2:rgba(255,255,255,.10);
    --panel-solid:#1B1136;
    --line:rgba(160,130,255,.28);
    --text:#EFEAFF;
    --dim:#A79BCF;
    --gold:#FFCC33;
    --violet:#A78BFF;
    --green:#4ADE80; --green-bg:rgba(74,222,128,.15);
    --red:#FF7C8F;   --red-bg:rgba(255,124,143,.16);
    --amber:#FFD166; --amber-bg:rgba(255,209,102,.14);

    --f-head:'PT Serif', Georgia, serif;
    --f-body:'PT Sans', 'Segoe UI', system-ui, sans-serif;
    --f-mono:'JetBrains Mono', 'Consolas', 'Courier New', monospace;

    --step: clamp(1rem, .96rem + .18vw, 1.08rem);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100dvh; height:100dvh;
    background:
      radial-gradient(ellipse 70% 50% at 50% -8%, rgba(139,107,255,.20) 0%, transparent 58%),
      radial-gradient(ellipse 55% 40% at 88% 10%, rgba(255,204,51,.08) 0%, transparent 60%),
      linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--f-body);
    font-size:var(--step);
    line-height:1.6;
    display:flex; flex-direction:column;
    overflow:hidden; position:relative;
  }

  /* ---------- фон: статичные пиксельные звёзды и сетка арены ---------- */
  .fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .stars i{position:absolute;width:3px;height:3px;background:var(--gold);opacity:.5;}
  .stars i.v{background:var(--violet);opacity:.45;}
  .grid-floor{
    position:fixed;left:0;right:0;bottom:0;height:30dvh;z-index:0;pointer-events:none;
    background:
      linear-gradient(to top, rgba(139,107,255,.14), transparent 78%),
      repeating-linear-gradient(to right, rgba(139,107,255,.11) 0 1px, transparent 1px 74px),
      repeating-linear-gradient(to top, rgba(139,107,255,.11) 0 1px, transparent 1px 48px);
    transform:perspective(430px) rotateX(50deg);
    transform-origin:bottom center;
    opacity:.45;
  }
  body.calm .slide{animation:none !important;}
  body.calm .bit{display:none !important;}
  body.calm .hero-badge{animation:none !important;}
  @media (prefers-reduced-motion: reduce){
    .slide,.hero-badge{animation:none !important;}
    *{transition-duration:.01ms !important;}
  }

  /* ---------- каркас ---------- */
  .bar{height:6px;background:rgba(255,255,255,.07);flex:0 0 auto;position:relative;z-index:3;}
  .bar-fill{height:100%;width:0%;
    background:repeating-linear-gradient(90deg, var(--gold) 0 13px, #FFE27A 13px 17px);
    transition:width .35s steps(8);box-shadow:0 0 10px rgba(255,204,51,.5);}

  .stage{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;align-items:flex-start;justify-content:center;
    padding:32px 22px 28px;position:relative;z-index:1;}
  .slide{width:100%;max-width:900px;animation:rise .4s cubic-bezier(.22,1,.36,1);}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  .nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:2px solid var(--line);background:rgba(11,7,22,.82);
    backdrop-filter:blur(10px);position:relative;z-index:3;}
  .nav button{
    font-family:var(--f-body);font-size:.95rem;color:var(--text);
    background:var(--panel);border:1.5px solid var(--line);border-radius:6px;
    min-height:44px;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.5);}
  .nav button:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
  .nav button:disabled{opacity:.35;cursor:default;}
  .calm-btn{font-size:.82rem;padding:0 12px;min-height:34px;box-shadow:none !important;}
  .calm-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);}

  :where(button,[tabindex]):focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- типографика ---------- */
  h1{font-family:var(--f-head);font-weight:700;line-height:1.15;margin:0 0 14px;
    font-size:clamp(1.6rem, 1.25rem + 1.7vw, 2.4rem);}
  h2{font-family:var(--f-head);font-weight:700;line-height:1.2;margin:0 0 12px;
    font-size:clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem);}
  h3{font-family:var(--f-head);font-weight:700;font-size:1.12rem;color:var(--gold);margin:0 0 8px;}
  p{margin:0 0 10px;}
  .kicker{font-family:var(--f-mono);font-size:.82rem;color:var(--violet);
    letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase;}
  .kicker::before{content:"\25AE  ";color:var(--gold);}
  .lead{color:var(--dim);max-width:66ch;margin-bottom:18px;}
  b.hl{color:var(--gold);}

  /* ---------- титул ---------- */
  .hero{min-height:min(72dvh,640px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:4px;}
  .hero-badge{width:clamp(88px,20vw,128px);height:auto;margin-bottom:16px;
    animation:glow 4.5s ease-in-out infinite;}
  @keyframes glow{0%,100%{opacity:.85;}50%{opacity:1;}}
  .hero-sup{font-family:var(--f-mono);font-size:clamp(.76rem,2vw,.92rem);
    letter-spacing:.3em;color:var(--dim);}
  .hero-title{font-family:var(--f-head);font-weight:700;letter-spacing:.02em;
    font-size:clamp(2.4rem,9vw,4.8rem);line-height:1;margin:6px 0 10px;color:var(--gold);}
  .hero-sub{font-family:var(--f-body);color:var(--violet);max-width:32ch;
    font-size:clamp(1rem,3vw,1.2rem);margin-bottom:26px;}
  .start{font-family:var(--f-body);font-size:1.05rem;font-weight:700;
    background:linear-gradient(180deg,#FFDE6B 0%,var(--gold) 60%,#D9A81C 100%);
    color:#241800;border:0;border-radius:8px;
    min-height:52px;padding:0 34px;cursor:pointer;
    box-shadow:0 5px 0 #6b4f00, 0 0 22px rgba(255,204,51,.3);}
  .start:hover{filter:brightness(1.06);}
  .start:active{transform:translateY(3px);box-shadow:0 2px 0 #6b4f00;}

  /* ---------- карта ---------- */
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin:16px 0 18px;}
  .tile{background:var(--panel);border:1.5px solid var(--line);border-left:4px solid var(--violet);
    border-radius:7px;padding:13px 15px;text-align:left;cursor:pointer;
    font-family:var(--f-body);color:var(--text);font-size:1rem;min-height:44px;
    box-shadow:0 3px 0 rgba(0,0,0,.45);transition:border-color .15s, background .15s;}
  .tile:hover{background:var(--panel-2);border-left-color:var(--gold);}
  .tile b{display:block;font-family:var(--f-head);font-size:1.05rem;margin-bottom:3px;}
  .tile span{color:var(--dim);font-size:.9rem;line-height:1.45;display:block;}

  /* ---------- блоки правил ---------- */
  .rule{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;
    padding:15px 17px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.45);}
  .rule .ex{font-family:var(--f-mono);font-size:.94rem;color:var(--violet);
    line-height:1.8;margin:8px 0 0;}
  u{text-decoration:none;color:var(--gold);font-weight:700;}
  .steps{margin:0;padding-left:1.25em;}
  .steps li{margin-bottom:9px;}
  .trap{background:var(--red-bg);border:1.5px solid rgba(255,124,143,.4);
    border-left:4px solid var(--red);border-radius:8px;padding:14px 16px;margin-top:12px;
    font-size:1rem;}
  .trap b{color:var(--red);}
  .memo{background:rgba(255,204,51,.1);border:1.5px dashed rgba(255,204,51,.45);
    border-radius:8px;padding:11px 14px;margin-top:10px;font-size:.98rem;}
  .memo b{color:var(--gold);}

  /* ---------- упражнения ---------- */
  .instr{color:var(--dim);margin-bottom:14px;max-width:64ch;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;margin-bottom:14px;}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px 13px;
    box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .phrase{font-family:var(--f-mono);font-size:1.02rem;line-height:1.5;margin-bottom:10px;}
  .phrase .gap{color:var(--gold);font-weight:700;font-size:1.12em;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{font-family:var(--f-body);font-size:.98rem;font-weight:700;color:var(--text);
    background:transparent;border:1.5px solid var(--dim);border-radius:7px;
    min-height:44px;padding:0 15px;cursor:pointer;}
  .chip:hover:not(:disabled){border-color:var(--gold);}
  .chip.on{background:var(--violet);color:#12082C;border-color:var(--violet);}
  .chip:disabled{cursor:default;opacity:.5;}
  .chip.on:disabled{opacity:1;}
  .card.ok{border-color:var(--green);background:var(--green-bg);}
  .card.no{border-color:var(--red);background:var(--red-bg);}
  .card.na{border-color:var(--amber);background:var(--amber-bg);}
  .why{font-size:.98rem;line-height:1.55;margin-top:10px;padding-top:9px;
    border-top:1px solid var(--line);color:var(--text);}
  .why .fix{font-family:var(--f-mono);color:var(--green);font-weight:700;}
  .flag{font-size:.84rem;font-family:var(--f-mono);margin-top:7px;}
  .flag.na{color:var(--amber);}

  /* ---------- футер упражнения ---------- */
  .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .btn{font-family:var(--f-body);font-size:1rem;font-weight:700;border-radius:8px;
    min-height:46px;padding:0 20px;cursor:pointer;border:1.5px solid transparent;}
  .btn.main{background:linear-gradient(180deg,#FFDE6B 0%,var(--gold) 60%,#D9A81C 100%);
    color:#241800;box-shadow:0 4px 0 #6b4f00;}
  .btn.main:active{transform:translateY(2px);box-shadow:0 2px 0 #6b4f00;}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line);
    box-shadow:0 3px 0 rgba(0,0,0,.45);}
  .btn.ghost:hover{border-color:var(--gold);}
  .score{font-family:var(--f-mono);font-size:.95rem;color:var(--dim);}
  .score b.g{color:var(--green);} .score b.r{color:var(--red);} .score b.a{color:var(--amber);}

  /* ---------- сортировка ---------- */
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;margin-bottom:14px;
    padding:10px;border:1.5px dashed var(--line);border-radius:8px;}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:14px;}
  .bucket{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;
    cursor:pointer;min-height:96px;box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .bucket:hover{border-color:var(--gold);}
  .bucket h4{font-family:var(--f-head);font-size:1rem;margin:0 0 8px;color:var(--gold);}
  .bucket .row{display:flex;flex-wrap:wrap;gap:6px;}
  .tok{font-family:var(--f-mono);font-size:.94rem;color:var(--text);
    background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:7px;
    min-height:40px;padding:0 12px;cursor:pointer;}
  .tok:hover:not(:disabled){border-color:var(--gold);}
  .tok.sel{border-color:var(--gold);background:rgba(255,204,51,.18);}
  .tok.ok{border-color:var(--green);background:var(--green-bg);}
  .tok.no{border-color:var(--red);background:var(--red-bg);}
  .tok:disabled{cursor:default;}
  .fixlist{margin-top:10px;font-size:.96rem;line-height:1.65;}
  .fixlist span{font-family:var(--f-mono);color:var(--green);}

  /* ---------- флеш-карты ---------- */
  .flash{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;padding:24px 18px;text-align:center;cursor:pointer;margin-bottom:12px;
    box-shadow:0 4px 0 rgba(0,0,0,.5);}
  .flash .fw{font-family:var(--f-mono);font-size:clamp(1.2rem,4.6vw,1.7rem);font-weight:700;}
  .flash .fw .gap{color:var(--gold);}
  .flash .fh{color:var(--violet);font-size:.98rem;line-height:1.5;max-width:40ch;}
  .flash .tap{color:var(--dim);font-size:.84rem;font-family:var(--f-mono);}
  .flash-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .flash-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  /* ---------- ЕГЭ ---------- */
  .ege-q{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:14px;font-size:1rem;box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .rows{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .erow{display:flex;gap:12px;align-items:flex-start;text-align:left;
    background:var(--panel);border:1.5px solid var(--line);border-radius:8px;
    padding:12px 14px;cursor:pointer;min-height:48px;color:var(--text);
    box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .erow:hover:not(:disabled){border-color:var(--gold);}
  .erow.on{border-color:var(--gold);background:rgba(255,204,51,.13);}
  .erow.ok{border-color:var(--green);background:var(--green-bg);}
  .erow.no{border-color:var(--red);background:var(--red-bg);}
  .erow.miss{border-color:var(--amber);background:var(--amber-bg);}
  .erow:disabled{cursor:default;}
  .enum{font-family:var(--f-mono);font-weight:700;color:var(--violet);flex:0 0 auto;}
  .ewords{font-size:1rem;line-height:1.65;}
  .ewords .ew{font-family:var(--f-mono);font-weight:700;color:var(--gold);}
  .ekey{font-size:.96rem;color:var(--text);margin-top:6px;line-height:1.55;
    padding-top:7px;border-top:1px solid var(--line);}
  .ekey .fix{font-family:var(--f-mono);color:var(--green);font-weight:700;}

  /* ---------- финал ---------- */
  .gauges{display:flex;gap:26px;flex-wrap:wrap;justify-content:flex-start;margin:6px 0 20px;}
  .gauge{text-align:center;}
  .gauge svg{width:clamp(122px,32vw,152px);height:auto;}
  .gauge .lab{font-size:.9rem;color:var(--dim);margin-top:5px;}
  .topics{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .topic{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;
    border-left:4px solid var(--dim);}
  .topic.bad{border-left-color:var(--red);}
  .topic.mid{border-left-color:var(--amber);}
  .topic.good{border-left-color:var(--green);}
  .topic .tn{flex:1 1 auto;min-width:150px;}
  .topic .tv{font-family:var(--f-mono);font-size:.95rem;color:var(--dim);}
  .topic button{font-family:var(--f-body);font-size:.92rem;color:var(--text);
    background:transparent;border:1.5px solid var(--line);border-radius:7px;
    min-height:40px;padding:0 13px;cursor:pointer;}
  .topic button:hover{border-color:var(--gold);}
  .note{background:var(--panel);border:1.5px solid var(--line);border-left:4px solid var(--gold);
    border-radius:8px;padding:15px 17px;font-size:.98rem;}
  .copied{color:var(--green);font-size:.94rem;font-family:var(--f-mono);}
  .copybox{width:100%;margin-top:10px;font-family:var(--f-mono);font-size:.9rem;
    background:var(--panel-solid);color:var(--text);border:1.5px solid var(--line);
    border-radius:8px;padding:10px;min-height:150px;}

  /* ---------- оглавление ---------- */
  .nav-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;}
  .toc-btn{background:transparent;border:1.5px solid var(--line);border-radius:6px;
    color:var(--dim);font-family:var(--f-mono);font-size:.84rem;
    padding:0 14px;min-height:40px;cursor:pointer;white-space:nowrap;}
  .toc-btn:hover{border-color:var(--gold);color:var(--gold);}
  .toc-overlay{position:fixed;inset:0;z-index:40;background:rgba(6,3,15,.92);display:none;
    align-items:center;justify-content:center;padding:20px;}
  .toc-overlay.open{display:flex;}
  .toc-panel{background:var(--panel-solid);border:2px solid var(--line);border-radius:10px;
    width:min(760px,100%);max-height:86dvh;display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.7);}
  .toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1.5px solid var(--line);}
  .toc-head h2{margin:0;font-size:1.2rem;color:var(--gold);}
  .toc-close{background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:7px;
    min-height:40px;padding:0 15px;cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:.94rem;}
  .toc-close:hover{border-color:var(--gold);color:var(--gold);}
  .toc-body{overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch;}
  .toc-group{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;color:var(--violet);
    font-weight:700;margin:14px 6px 6px;}
  .toc-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
    border:1.5px solid transparent;border-radius:7px;color:var(--text);font-family:var(--f-body);
    font-size:.96rem;padding:9px 10px;min-height:44px;cursor:pointer;}
  .toc-item:hover{border-color:var(--line);background:var(--panel);}
  .toc-item.current{border-color:var(--gold);background:rgba(255,204,51,.12);}
  .toc-num{font-family:var(--f-mono);font-size:.84rem;color:var(--dim);min-width:26px;}
  .toc-name{flex:1;line-height:1.4;}
  .toc-tag{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.05em;color:var(--dim);
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap;}
  .toc-score{font-family:var(--f-mono);font-size:.84rem;min-width:48px;text-align:right;}

  .bit{position:fixed;width:6px;height:6px;pointer-events:none;z-index:60;
    animation:bitOut .45s ease-out forwards;}
  @keyframes bitOut{to{transform:translate(var(--dx),var(--dy));opacity:0;}}

  /* ---------- телефон ---------- */
  @media (max-width:620px){
    .stage{padding:22px 15px 20px;}
    .grid{grid-template-columns:1fr;}
    .map{grid-template-columns:1fr;}
    .buckets{grid-template-columns:1fr;}
    .gauges{gap:16px;justify-content:center;}
    .toc-tag{display:none;}
    .toc-panel{max-height:90dvh;}
    .grid-floor{height:22dvh;}
  }
  @media (max-width:400px){
    .stage{padding:18px 12px 18px;}
    .nav{padding-left:10px;padding-right:10px;gap:7px;}
    .nav button{padding:0 12px;font-size:.9rem;}
    .rule,.card,.erow{padding-left:12px;padding-right:12px;}
    .phrase{font-size:.98rem;}
  }
</style>
</head>
<body>
  <div class="fx stars" id="stars"></div>
  <div class="grid-floor"></div>

  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="toc-overlay" id="tocOverlay" role="dialog" aria-modal="true" aria-label="Оглавление">
    <div class="toc-panel">
      <div class="toc-head"><h2>Оглавление</h2><button class="toc-close" id="tocClose" type="button">Закрыть</button></div>
      <div class="toc-body" id="tocBody"></div>
    </div>
  </div>
  <main class="stage" id="stage"></main>
  <nav class="nav">
    <button id="prevBtn" type="button">← Назад</button>
    <div class="nav-mid">
      <button class="toc-btn" id="counter" type="button" aria-haspopup="dialog"></button>
      <button class="calm-btn" id="calmBtn" type="button" aria-pressed="false">Спокойный режим</button>
    </div>
    <button id="nextBtn" type="button">Далее →</button>
  </nav>
<script>
/* ==================== ДАННЫЕ ====================
   Все примеры взяты из файлов проекта: презентация-интенсив по орфографии,
   «Экспресс-зачёты по орфографии», демоверсия ЕГЭ 2027.

/* порядок карточек перемешивается при каждой загрузке страницы */
const ORD = {};
function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
SLIDES.forEach(s=>{
  if(s.items) ORD[s.k] = shuffled(s.items.length);
  else if(s.data && s.data.items) ORD[s.k] = shuffled(s.data.items.length);
});

const A = k => (ST.ans[k] || (ST.ans[k] = {}));
const PH = k => ST.ph[k] || 0;
const FR = k => ST.fr[k] || [];

/* ==================== ПОДСЧЁТ ==================== */

function scoreOf(s){
  const k = s.k, ph = PH(k);
  if(ph === 0) return null;
  const ans = A(k);

  if(s.type === "practice"){
    let r=0,w=0,e=0;
    s.items.forEach((it,i)=>{
      const v = ans[i];
      if(v === undefined || v === null) e++;
      else if(v === it.a) r++;
      else w++;
    });
    return {r,w,e,t:s.items.length};
  }
  if(s.type === "sort"){
    let r=0,w=0,e=0;
    s.data.items.forEach((it,i)=>{
      const v = ans[i];
      if(!v) e++; else if(v === it.b) r++; else w++;
    });
    return {r,w,e,t:s.data.items.length};
  }
  if(s.type === "ege"){
    const sel = (ans.sel || []).slice().sort((a,b)=>a-b);
    if(!sel.length) return {r:0,w:0,e:1,t:1};
    const right = s.data.right.slice().sort((a,b)=>a-b);
    const hit = sel.length === right.length && sel.every((v,i)=>v === right[i]);
    return {r:hit?1:0, w:hit?0:1, e:0, t:1};
  }
  if(s.type === "flash"){
    const st = ST.fl[k] || {rat:{}};
    const known = Object.values(st.rat).filter(v=>v==="know").length;
    const rated = Object.keys(st.rat).length;
    if(!rated) return null;
    return {r:known, w:rated-known, e:s.items.length-rated, t:s.items.length, self:true};
  }
  return null;
}

/* диагностика строится по ПЕРВОЙ проверке: после исправлений счёт
   всегда близок к ста процентам и слабые темы перестают быть видны */
function baseScore(s){
  if(s.type === "flash") return scoreOf(s);
  return ST.first[s.k] || null;
}

function allScores(){
  const bySec = {};
  SLIDES.forEach(s=>{
    if(!s.sec) return;
    const sc = baseScore(s);
    if(!sc) return;
    const b = bySec[s.sec] || (bySec[s.sec] = {r:0,w:0,e:0,t:0,self:false,back:s.back||s.k});
    b.r+=sc.r; b.w+=sc.w; b.e+=sc.e; b.t+=sc.t;
    if(sc.self) b.self = true;
  });
  return bySec;
}

/* ==================== УТИЛИТЫ ==================== */

const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* подсвечиваем (НЕ) и (НИ) вместе с предлогом внутри: (НЕ)(С)ЧЕМ */
function gaps(t){
  return esc(t).replace(/\((?:НЕ|НИ|не|ни|С|с|К|к|У|у|О|о|ЗА|за)\)/g, m => '<span class="gap">'+m+'</span>');
}

function scoreLine(sc){
  if(!sc) return "";
  let out = '<span class="score">Верно <b class="g">'+sc.r+'</b>';
  if(sc.w) out += ' · неверно <b class="r">'+sc.w+'</b>';
  if(sc.e) out += ' · не отвечено <b class="a">'+sc.e+'</b>';
  out += ' из '+sc.t+'</span>';
  return out;
}

function bits(el){
  if(document.body.classList.contains("calm")) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const rc = el.getBoundingClientRect();
  const cx = rc.left+rc.width/2, cy = rc.top+rc.height/2;
  const cols = ["#FFCC33","#A78BFF"];
  for(let i=0;i<5;i++){
    const ang = (i/5)*Math.PI*2 + Math.random()*.4, dist = 18+Math.random()*12;
    const d = document.createElement("div");
    d.className = "bit";
    d.style.background = cols[i%2];
    d.style.left = cx+"px"; d.style.top = cy+"px";
    d.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    d.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    document.body.appendChild(d);
    d.addEventListener("animationend", ()=>d.remove());
  }
}

/* --- практика «слитно или раздельно» --- */
const OPTS = ["слитно","раздельно"];
function rPractice(el, s){
  const k = s.k, ph = PH(k), ans = A(k), fr = FR(k), ord = ORD[k];

  const cards = ord.map(i=>{
    const it = s.items[i];
    const v = ans[i];
    let cls = "card", flag = "", why = "";
    if(ph >= 1){
      if(v === undefined) { cls += " na"; flag = '<div class="flag na">не отвечено</div>'; }
      else if(v === it.a) cls += " ok";
      else cls += " no";
    }
    if(ph === 2){
      why = '<div class="why"><span class="fix">' + esc(it.full) + '</span> — ' + it.why + '</div>';
    }
    const live = (ph === 0) || (ph === 15 && !fr.includes(i));
    const dis = live ? "" : " disabled";

    const body = '<div class="phrase">' + gaps(it.t) + '</div>' +
      '<div class="chips">' + OPTS.map(o=>
        '<button type="button" class="chip '+(v===o?"on":"")+'" data-i="'+i+'" data-v="'+o+'"'+dis+'>'+o+'</button>'
      ).join("") + '</div>';
    return '<div class="'+cls+'">' + body + flag + why + '</div>';
  }).join("");

  el.innerHTML = head(s) +
    '<p class="instr">'+s.instr+'</p>' +
    '<div class="grid">'+cards+'</div>' +
    '<div class="foot" id="foot"></div>';

  el.querySelectorAll("[data-v]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.i;
      if(ans[i] === b.dataset.v) delete ans[i]; else ans[i] = b.dataset.v;
      RESTORE = '[data-i="'+i+'"][data-v="'+b.dataset.v+'"]';
      save(); bits(b); render(ST.cur);
    });
  });
  footer(el, s);
}

/* --- футер с двухшаговой проверкой --- */
function footer(el, s){
  const k = s.k, ph = PH(k), foot = el.querySelector("#foot");
  const sc = scoreOf(s);
  let html = "";
  if(ph === 0){
    html = '<button class="btn main" type="button" id="chk">Проверить</button>';
  } else if(ph === 1){
    html = '<button class="btn main" type="button" id="again">Ещё попытка</button>' + scoreLine(sc) +
      '<div style="flex-basis:100%;color:var(--dim);font-size:.92rem;">Верные ответы закреплены, неверные и пропущенные открыты для правки. Правильные написания пока не показываем — вспоминайте.</div>';
  } else if(ph === 15){
    html = '<button class="btn main" type="button" id="chk">Проверить</button>' +
      '<span class="score">Открыты только неверные и пропущенные позиции</span>';
  } else {
    html = scoreLine(sc) + '<button class="btn ghost" type="button" id="rst">Пройти заново</button>';
  }
  foot.innerHTML = html;
  const chk = foot.querySelector("#chk"), ag = foot.querySelector("#again"), rst = foot.querySelector("#rst");
  if(chk) chk.addEventListener("click", ()=>doCheck(s));
  if(ag) ag.addEventListener("click", ()=>{ ST.ph[k] = 15; save(); render(ST.cur); });
  if(rst) rst.addEventListener("click", ()=>{
    ST.ans[k] = {}; ST.ph[k] = 0; ST.fr[k] = [];
    delete ST.first[k]; if(ST.fl[k]) delete ST.fl[k];
    save(); render(ST.cur);
  });
}

function doCheck(s){
  const k = s.k, ph = PH(k);
  if(ph === 15){ ST.ph[k] = 2; save(); render(ST.cur); return; }

  const ans = A(k);
  const frozen = [];
  let pending = 0;

  if(s.type === "practice"){
    s.items.forEach((it,i)=>{ (ans[i] === it.a) ? frozen.push(i) : pending++; });
  } else if(s.type === "sort"){
    s.data.items.forEach((it,i)=>{ (ans[i] === it.b) ? frozen.push(i) : pending++; });
  } else if(s.type === "ege"){
    const sel = ans.sel || [];
    sel.forEach(r=>{ if(s.data.right.includes(r)) frozen.push(r); });
    const done = sel.length === s.data.right.length && s.data.right.every(r=>sel.includes(r));
    pending = done ? 0 : 1;
  }

  ST.fr[k] = frozen;
  ST.ph[k] = pending === 0 ? 2 : 1;
  if(!ST.first[k]){
    const sc = scoreOf(s);
    if(sc) ST.first[k] = {r:sc.r, w:sc.w, e:sc.e, t:sc.t};
  }
  save(); render(ST.cur);
}

/* --- сортировка --- */
let SEL = null;
function rSort(el, s){
  const k = s.k, ph = PH(k), ans = A(k), fr = FR(k), ord = ORD[k], D = s.data;
  const live = (ph === 0 || ph === 15);

  const tok = i=>{
    const it = D.items[i];
    let cls = "tok";
    if(ph >= 1 && ans[i]) cls += (ans[i] === it.b) ? " ok" : " no";
    if(SEL === i) cls += " sel";
    const movable = live && !fr.includes(i);
    return '<button type="button" class="'+cls+'" data-t="'+i+'"'+(movable?"":" disabled")+'>'+esc(it.t)+'</button>';
  };

  const pool = ord.filter(i=>!ans[i]).map(tok).join("") ||
               '<span style="color:var(--dim);font-size:.92rem;">Все слова разложены</span>';

  const buckets = D.buckets.map(b=>{
    const inside = ord.filter(i=>ans[i] === b).map(tok).join("");
    return '<div class="bucket" data-b="'+esc(b)+'"><h4>'+esc(b)+'</h4><div class="row">'+inside+'</div></div>';
  }).join("");

  let fix = "";
  if(ph === 2){
    const wrong = D.items.map((it,i)=>({it,i})).filter(x=>ans[x.i] !== x.it.b);
    fix = wrong.length
      ? '<div class="fixlist"><b>Верное распределение:</b><br>' +
        wrong.map(x=>esc(x.it.t)+' → <span>'+esc(x.it.b)+'</span>').join("<br>") + '</div>'
      : '<div class="fixlist">Все слова разложены верно.</div>';
  }

  el.innerHTML = head(s) +
    '<p class="instr">'+s.instr+'</p>' +
    '<div class="pool">'+pool+'</div>' +
    '<div class="buckets">'+buckets+'</div>' +
    fix + '<div class="foot" id="foot"></div>';

  if(live){
    el.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{
      SEL = (SEL === +b.dataset.t) ? null : +b.dataset.t;
      render(ST.cur);
    }));
    el.querySelectorAll(".bucket").forEach(b=>b.addEventListener("click",(ev)=>{
      if(ev.target.closest("[data-t]")) return;
      if(SEL === null) return;
      ans[SEL] = b.dataset.b; SEL = null; save(); render(ST.cur);
    }));
  }
  footer(el, s);
  const ag = el.querySelector("#again");
  if(ag){
    ag.addEventListener("click", ()=>{
      D.items.forEach((it,i)=>{ if(!FR(k).includes(i)) delete ans[i]; });
      save();
    }, true);
  }
}

/* --- флеш-карты --- */
function rFlash(el, s){
  const k = s.k;
  const st = ST.fl[k] || (ST.fl[k] = {pos:0, rat:{}, flip:false});
  const ord = ORD[k];
  const i = ord[st.pos];
  const it = s.items[i];
  const rated = Object.keys(st.rat).length;
  const known = Object.values(st.rat).filter(v=>v==="know").length;

  const face = st.flip
    ? '<div class="fw">'+esc(it.full)+'</div><div class="fh">'+it.why+'</div>'
    : '<div class="fw">'+gaps(it.t)+'</div><div class="tap">нажмите, чтобы проверить себя</div>';

  el.innerHTML = head(s) +
    '<p class="instr">'+s.instr+'</p>' +
    '<div class="flash" id="fcard">'+face+'</div>' +
    '<div class="flash-btns">' +
      '<button class="btn main" type="button" id="know">Знаю</button>' +
      '<button class="btn ghost" type="button" id="rev">Повторю</button>' +
    '</div>' +
    '<div class="flash-nav">' +
      '<button class="btn ghost" type="button" id="fp">← Назад</button>' +
      '<span class="score">Карточка '+(st.pos+1)+' из '+s.items.length+' · отмечено '+rated+' · знаю '+known+'</span>' +
      '<button class="btn ghost" type="button" id="fn">Вперёд →</button>' +
    '</div>' +
    (rated === s.items.length ? '<div class="foot" style="margin-top:14px;"><button class="btn ghost" type="button" id="frst">Пройти заново</button></div>' : '');

  el.querySelector("#fcard").addEventListener("click", ()=>{ st.flip = !st.flip; save(); render(ST.cur); });
  const rate = v => { st.rat[i] = v; st.flip = false; if(st.pos < s.items.length-1) st.pos++; save(); render(ST.cur); };
  el.querySelector("#know").addEventListener("click", ()=>rate("know"));
  el.querySelector("#rev").addEventListener("click", ()=>rate("review"));
  el.querySelector("#fp").addEventListener("click", ()=>{ st.pos = Math.max(0, st.pos-1); st.flip=false; save(); render(ST.cur); });
  el.querySelector("#fn").addEventListener("click", ()=>{ st.pos = Math.min(s.items.length-1, st.pos+1); st.flip=false; save(); render(ST.cur); });
  const f2 = el.querySelector("#frst");
  if(f2) f2.addEventListener("click", ()=>{ delete ST.fl[k]; save(); render(ST.cur); });
}

function rEge(el, s){
  const k = s.k, ph = PH(k), ans = A(k), fr = FR(k), D = s.data;
  const sel = ans.sel || (ans.sel = []);
  const live = (ph === 0 || ph === 15);
  const want = D.mode === "R";

  const rows = D.rows.map((row, ri)=>{
    const on = sel.includes(ri);
    let cls = "erow" + (on ? " on" : "");
    if(ph === 1 && on) cls = "erow " + (D.right.includes(ri) ? "ok" : "no");
    if(ph === 2){
      if(D.right.includes(ri)) cls = "erow " + (on ? "ok" : "miss");
      else cls = "erow" + (on ? " no" : "");
    }
    const shown = (ph === 2) ? '<span class="ew">'+esc(row.full)+'</span>' : '<span class="ew">'+esc(row.w)+'</span>';
    const text = esc(row.s).replace("{w}", shown);
    const key = (ph === 2)
      ? '<div class="ekey"><span class="fix">'+esc(row.full)+'</span> — '+row.why+'</div>'
      : "";
    const movable = live && !fr.includes(ri);
    return '<button type="button" class="'+cls+'" data-r="'+ri+'"'+(movable?"":" disabled")+'>' +
      '<span class="enum">'+(ri+1)+')</span><span class="ewords">'+text+key+'</span></button>';
  }).join("");

  let verdict = "";
  if(ph === 2){
    const nums = D.right.map(r=>r+1).join("");
    verdict = '<div class="memo" style="margin-bottom:14px;"><b>Ответ: '+nums+'</b></div>';
  }

  const q = want
    ? 'Укажите варианты ответов, в которых НЕ с выделенным словом пишется <b class="hl">РАЗДЕЛЬНО</b>. Запишите номера ответов.'
    : 'Укажите варианты ответов, в которых НЕ (НИ) с выделенным словом пишется <b class="hl">СЛИТНО</b>. Запишите номера ответов.';

  el.innerHTML =
    '<div class="kicker">Формат ЕГЭ · '+s.title+'</div>' +
    '<h1>Задание 13</h1>' +
    '<div class="ege-q">'+q+'</div>' +
    '<div class="rows">'+rows+'</div>' + verdict +
    '<div class="foot" id="foot"></div>';

  if(live){
    el.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
      const ri = +b.dataset.r, p = sel.indexOf(ri);
      (p === -1) ? sel.push(ri) : sel.splice(p,1);
      RESTORE = '[data-r="'+ri+'"]';
      save(); render(ST.cur);
    }));
  }
  footer(el, s);
  const ag = el.querySelector("#again");
  if(ag) ag.addEventListener("click", ()=>{
    ans.sel = sel.filter(r=>FR(k).includes(r));
    save();
  }, true);
}

/* --- итоги --- */
function gauge(pct, color, label, text){
  const id = "g"+Math.random().toString(36).slice(2,8);
  const r = 62, c = 72, top = c + r - (pct/100)*(2*r);
  return '<div class="gauge"><svg viewBox="0 0 144 144">' +
    '<defs><clipPath id="'+id+'"><rect x="10" y="10" width="124" height="124"/></clipPath></defs>' +
    '<rect x="10" y="10" width="124" height="124" fill="rgba(255,255,255,.04)" stroke="rgba(167,139,255,.4)" stroke-width="2"/>' +
    '<g clip-path="url(#'+id+')"><rect x="10" y="'+top+'" width="124" height="170" fill="'+color+'" opacity=".75"/></g>' +
    '<rect x="10" y="10" width="124" height="124" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2"/>' +
    '<text x="72" y="80" text-anchor="middle" font-family="PT Serif, serif" font-weight="700" font-size="25" fill="#EFEAFF">'+text+'</text>' +
    '</svg><div class="lab">'+label+'</div></div>';
}

function rFinal(el){
  const bySec = allScores();
  const keys = Object.keys(bySec);

  let R2=0, W2=0;
  keys.forEach(x=>{ if(!bySec[x].self){ R2 += bySec[x].r; W2 += bySec[x].w; } });
  const und = (R2+W2) ? Math.round(R2/(R2+W2)*100) : null;
  const done = Math.round(((ST.max+1)/SLIDES.length)*100);

  const list = keys.map(x=>{
    const v = bySec[x];
    const pct = (v.r+v.w) ? Math.round(v.r/(v.r+v.w)*100) : null;
    return {name:x, v, pct};
  }).sort((a,b)=>{
    if(a.pct === null) return 1; if(b.pct === null) return -1;
    return a.pct - b.pct;
  });

  const topics = list.length ? list.map(o=>{
    const cls = o.pct === null ? "" : (o.pct < 60 ? " bad" : o.pct < 85 ? " mid" : " good");
    const val = (o.pct === null ? "нет ответов" : o.pct + "%") +
      (o.v.e ? " · пропущено " + o.v.e : "") + (o.v.self ? " · самооценка" : "");
    return '<div class="topic'+cls+'"><span class="tn">'+esc(o.name)+'</span>' +
      '<span class="tv">'+val+'</span>' +
      '<button type="button" data-b="'+esc(o.v.back)+'">К теории</button></div>';
  }).join("") : '<div class="topic"><span class="tn">Практика ещё не пройдена — вернитесь к упражнениям.</span></div>';

  el.innerHTML =
    '<div class="kicker">Итоги</div>' +
    '<h1>Что получилось с заданием 13</h1>' +
    '<p class="lead">Слева — сколько тренажёра пройдено. Справа — доля верных ответов <b class="hl">с первой попытки</b>: исправления после «Ещё попытки» в этот процент не идут, иначе слабые темы перестали бы быть видны. Флеш-карты в общий счёт не входят: там оценка ставится самостоятельно.</p>' +
    '<div class="gauges">' +
      gauge(done, "#A78BFF", "Пройдено", done+"%") +
      (und === null ? gauge(0, "#3A2A6B", "Верных ответов", "—")
                    : gauge(und, und >= 70 ? "#4ADE80" : "#FF7C8F", "Верных ответов", und+"%")) +
    '</div>' +
    '<h2>Темы на повторение</h2>' +
    '<p class="lead">Сверху — то, что проседает сильнее всего. Тот же список с процентами есть в оглавлении: кнопка со счётчиком слайдов внизу экрана.</p>' +
    '<div class="topics">'+topics+'</div>' +
    '<div class="foot" style="margin-bottom:16px;">' +
      '<button class="btn main" type="button" id="cp">Скопировать итог</button>' +
      '<button class="btn ghost" type="button" id="clr">Очистить прогресс</button>' +
      '<span id="cpmsg"></span>' +
    '</div>' +
    '<div class="note"><b>Что делать дальше.</b> Пройдите ещё раз флеш-карты, начав с отмеченных «Повторю»: порядок карточек меняется при каждом открытии страницы, запомнить расположение не выйдет. Если проседает блок «Часть речи решает», повторяйте его отдельно от остальных: там ошибается не память, а разбор предложения.</div>';

  el.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>go(IDX[b.dataset.b])));
  el.querySelector("#cp").addEventListener("click", ()=>copySummary(list, und, done));
  el.querySelector("#clr").addEventListener("click", ()=>{
    if(!confirm("Стереть все ответы и начать тренажёр заново?")) return;
    ST.ans = {}; ST.ph = {}; ST.fr = {}; ST.fl = {}; ST.first = {}; ST.max = 0;
    save(); render(ST.cur);
  });
}

function copySummary(list, und, done){
  const lines = ["Задание 13. Правописание НЕ и НИ — итог тренажёра",
    "Пройдено: "+done+"%   Верных с первой попытки: "+(und === null ? "—" : und+"%"), ""];
  if(!list.length) lines.push("Упражнения не пройдены.");
  list.forEach(o=>{
    const pct = o.pct === null ? "нет ответов" : o.pct+"%";
    lines.push("• "+o.name+" — "+pct+" (верно "+o.v.r+", неверно "+o.v.w+
      (o.v.e ? ", пропущено "+o.v.e : "")+")"+(o.v.self ? " [самооценка]" : ""));
  });
  const text = lines.join("\n");
  const ok = ()=>{
    const m = document.getElementById("cpmsg");
    if(m){ m.className = "copied"; m.textContent = "Скопировано"; setTimeout(()=>{ m.textContent=""; }, 2500); }
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, ()=>fallbackCopy(text, ok));
      return;
    }
  }catch(e){}
  fallbackCopy(text, ok);
}

function fallbackCopy(text, cb){
  let copied = false;
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    copied = document.execCommand("copy");
    ta.remove();
  }catch(e){}
  if(copied){ cb(); return; }
  showCopyBox(text);
}

function showCopyBox(text){
  const foot = document.getElementById("cpmsg");
  if(!foot) return;
  if(document.getElementById("copybox")) return;
  const ta = document.createElement("textarea");
  ta.id = "copybox"; ta.className = "copybox"; ta.value = text; ta.readOnly = true;
  foot.parentNode.appendChild(ta);
  foot.className = "score";
  foot.textContent = "Скопируйте текст вручную:";
  ta.focus(); ta.select();
}

/* ==================== НАВИГАЦИЯ ==================== */

function go(i){
  SEL = null;
  ST.cur = Math.max(0, Math.min(SLIDES.length-1, i));
  ST.max = Math.max(ST.max, ST.cur);
  save(); render(ST.cur); updateNav();
  stage.scrollTop = 0;
}

function updateNav(){
  prevBtn.disabled = ST.cur === 0;
  nextBtn.disabled = ST.cur === SLIDES.length-1;
  counter.textContent = "слайд " + (ST.cur+1) + " из " + SLIDES.length + "  \u25BE";
  barFill.style.width = Math.round(((ST.cur+1)/SLIDES.length)*100) + "%";
}

/* ---------- оглавление ---------- */
const tocOverlay = document.getElementById("tocOverlay");
const tocBody = document.getElementById("tocBody");
const TAGS = {title:"Начало", map:"Карта", rule:"Теория", practice:"Практика",
  sort:"Практика", flash:"Карточки", egeIntro:"Формат ЕГЭ", ege:"Задание ЕГЭ", final:"Итог"};

function slideName(s, i){
  if(s.type === "title") return "Титульный слайд";
  if(s.type === "map") return "Карта задания 13";
  if(s.type === "egeIntro") return "Как устроены задания ЕГЭ";
  if(s.type === "final") return "Итог и темы на повторение";
  return s.title || TAGS[s.type] || ("Слайд " + (i+1));
}

function buildTOC(){
  let html = "", lastSec = null;
  SLIDES.forEach((s,i)=>{
    const sec = s.sec || null;
    if(sec && sec !== lastSec){ html += '<div class="toc-group">'+esc(sec)+'</div>'; lastSec = sec; }
    if(!sec) lastSec = null;

    const f = baseScore(s);
    let score;
    if(f){
      const a = f.r + f.w;
      const pct = a ? Math.round(f.r/a*100) : null;
      const col = pct === null ? "var(--dim)" : (pct >= 80 ? "var(--green)" : (pct >= 55 ? "var(--amber)" : "var(--red)"));
      score = '<span class="toc-score" style="color:'+col+'">'+(pct === null ? "—" : pct+"%")+'</span>';
    } else {
      score = '<span class="toc-score" style="color:var(--dim)">·</span>';
    }
    html += '<button type="button" class="toc-item'+(i === ST.cur ? " current" : "")+'" data-i="'+i+'">' +
      '<span class="toc-num">'+(i+1)+'</span>' +
      '<span class="toc-name">'+esc(slideName(s,i))+'</span>' +
      '<span class="toc-tag">'+esc(TAGS[s.type] || "")+'</span>' + score + '</button>';
  });
  tocBody.innerHTML = html;
  tocBody.querySelectorAll(".toc-item").forEach(b=>{
    b.addEventListener("click", ()=>{ closeTOC(); go(+b.dataset.i); });
  });
  const cur = tocBody.querySelector(".toc-item.current");
  if(cur && cur.scrollIntoView) setTimeout(()=>cur.scrollIntoView({block:"center"}), 0);
}

function openTOC(){ buildTOC(); tocOverlay.classList.add("open"); const c = tocBody.querySelector(".toc-item.current"); if(c && c.focus) c.focus({preventScroll:true}); }
function closeTOC(){ tocOverlay.classList.remove("open"); if(counter.focus) counter.focus({preventScroll:true}); }
counter.addEventListener("click", openTOC);
document.getElementById("tocClose").addEventListener("click", closeTOC);
tocOverlay.addEventListener("click", e=>{ if(e.target === tocOverlay) closeTOC(); });

prevBtn.addEventListener("click", ()=>go(ST.cur-1));
nextBtn.addEventListener("click", ()=>go(ST.cur+1));
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeTOC(); return; }
  if(tocOverlay.classList.contains("open")) return;
  if(e.target && e.target.closest && e.target.closest("button,textarea")) return;
  if(e.key === "ArrowRight") go(ST.cur+1);
  if(e.key === "ArrowLeft") go(ST.cur-1);
});

function setCalm(on){
  ST.calm = on;
  document.body.classList.toggle("calm", on);
  calmBtn.setAttribute("aria-pressed", on ? "true" : "false");
  calmBtn.textContent = on ? "Движение выключено" : "Спокойный режим";
  save();
}
