<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Задание 9 ЕГЭ. Правописание корней</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#04202F; --bg2:#083A52; --bg3:#0B5170;
    --panel:rgba(255,255,255,.06);
    --panel-2:rgba(255,255,255,.09);
    --panel-solid:#07293A;
    --line:rgba(255,255,255,.16);
    --text:#EDF7FC;
    --dim:#A9CEDD;
    --aqua:#5FDCD0;
    --sand:#FFB27D;
    --green:#4BE3A2; --green-bg:rgba(75,227,162,.15);
    --red:#FF7C6E;   --red-bg:rgba(255,124,110,.16);
    --amber:#FFD166;  --amber-bg:rgba(255,209,102,.14);

    --f-head:'PT Serif', Georgia, serif;
    --f-body:'PT Sans', 'Segoe UI', system-ui, sans-serif;
    --f-mono:'JetBrains Mono', 'Consolas', 'Courier New', monospace;

    --step: clamp(1rem, .96rem + .18vw, 1.08rem);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100dvh; height:100dvh;
    background:
      radial-gradient(ellipse 70% 50% at 20% 0%, rgba(95,220,208,.15) 0%, transparent 55%),
      radial-gradient(ellipse 60% 45% at 85% 12%, rgba(11,81,112,.5) 0%, transparent 60%),
      linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--f-body);
    font-size:var(--step);
    line-height:1.6;
    display:flex; flex-direction:column;
    overflow:hidden; position:relative;
  }

  /* ---------- фон ---------- */
  .fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .rays span{
    position:absolute;top:-15%;width:120px;height:130%;
    background:linear-gradient(180deg, rgba(120,225,215,.10), transparent 70%);
    transform:skewX(-12deg);filter:blur(6px);
    animation:rayGlow 9s ease-in-out infinite;
  }
  .rays span:nth-child(1){left:12%;animation-delay:0s;}
  .rays span:nth-child(2){left:36%;width:80px;animation-delay:2.2s;}
  .rays span:nth-child(3){left:64%;width:150px;animation-delay:1.1s;}
  .rays span:nth-child(4){left:84%;width:90px;animation-delay:3.4s;}
  @keyframes rayGlow{0%,100%{opacity:.22;}50%{opacity:.5;}}

  .bubbles i{
    position:absolute;bottom:-40px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.45), rgba(120,225,215,.07) 60%, transparent 70%);
    border:1px solid rgba(255,255,255,.10);
    animation:bubbleRise linear infinite;
  }
  @keyframes bubbleRise{
    0%{transform:translateY(0);opacity:0;}
    12%{opacity:.6;}
    88%{opacity:.4;}
    100%{transform:translateY(-105dvh) translateX(26px);opacity:0;}
  }
  .wave{position:fixed;left:0;right:0;bottom:0;width:100%;z-index:0;pointer-events:none;}
  .wave.w1{opacity:.28;height:190px;} .wave.w2{opacity:.18;height:145px;} .wave.w3{opacity:.11;height:105px;}
  .wave.w1 path{animation:drift 13s linear infinite;}
  .wave.w2 path{animation:drift 9s linear infinite reverse;}
  .wave.w3 path{animation:drift 17s linear infinite;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(-300px);}}
  .shimmer{position:fixed;top:0;left:0;right:0;height:64px;z-index:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(160,235,225,.11), transparent);}

  /* спокойный режим: гасим всё фоновое движение */
  body.calm .rays span,
  body.calm .bubbles i,
  body.calm .wave path{animation:none !important;}
  body.calm .bubbles{display:none;}
  body.calm .slide{animation:none !important;}
  body.calm .drop{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    .rays span,.bubbles i,.wave path,.slide{animation:none !important;}
    .bubbles{display:none;}
    *{transition-duration:.01ms !important;}
  }

  /* ---------- каркас ---------- */
  .bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;position:relative;z-index:3;}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--aqua),#9df0e6);transition:width .35s ease;
    box-shadow:0 0 12px rgba(95,220,208,.6);}

  .stage{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;align-items:flex-start;justify-content:center;
    padding:34px 22px 28px;position:relative;z-index:1;}
  .slide{width:100%;max-width:880px;animation:surface .45s cubic-bezier(.22,1,.36,1);}
  @keyframes surface{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }

  .nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(4,32,47,.72);
    backdrop-filter:blur(10px);position:relative;z-index:3;}
  .nav button{
    font-family:var(--f-body);font-size:.95rem;color:var(--text);
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    min-height:44px;padding:0 16px;cursor:pointer;}
  .nav button:hover:not(:disabled){border-color:var(--aqua);}
  .nav button:disabled{opacity:.35;cursor:default;}
  .calm-btn{font-size:.8rem;padding:0 12px;min-height:34px;}
  .calm-btn[aria-pressed="true"]{border-color:var(--aqua);color:var(--aqua);}

  :where(button,[tabindex]):focus-visible{outline:2px solid var(--aqua);outline-offset:2px;}

  /* ---------- типографика ---------- */
  h1{font-family:var(--f-head);font-weight:700;line-height:1.15;margin:0 0 14px;
    font-size:clamp(1.6rem, 1.25rem + 1.7vw, 2.4rem);}
  h2{font-family:var(--f-head);font-weight:700;line-height:1.2;margin:0 0 12px;
    font-size:clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem);}
  h3{font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--aqua);margin:0 0 8px;}
  p{margin:0 0 10px;}
  .kicker{font-family:var(--f-mono);font-size:.82rem;color:var(--aqua);
    letter-spacing:.06em;margin-bottom:8px;}
  .lead{color:var(--dim);max-width:66ch;margin-bottom:18px;}
  b.hl{color:var(--sand);}

  /* ---------- титул ---------- */
  .hero{min-height:min(72dvh,640px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:4px;}
  .hero svg{width:clamp(74px,17vw,116px);height:auto;margin-bottom:14px;}
  .hero .ring{fill:none;stroke:var(--aqua);stroke-width:2;transform-origin:60px 60px;}
  .hero .r1{animation:pulse 3.6s ease-out infinite;}
  .hero .r2{animation:pulse 3.6s ease-out .9s infinite;}
  .hero .r3{animation:pulse 3.6s ease-out 1.8s infinite;}
  @keyframes pulse{0%{transform:scale(.28);opacity:0;}25%{opacity:.85;}100%{transform:scale(1);opacity:0;}}
  body.calm .hero .ring{animation:none;opacity:.5;}
  .hero-sup{font-family:var(--f-mono);font-size:clamp(.76rem,2vw,.92rem);
    letter-spacing:.32em;color:var(--dim);}
  .hero-title{font-family:var(--f-head);font-weight:700;letter-spacing:.02em;
    font-size:clamp(2.6rem,10vw,5.2rem);line-height:1;margin:6px 0 10px;}
  .hero-sub{font-family:var(--f-body);color:var(--sand);max-width:30ch;
    font-size:clamp(1rem,3vw,1.2rem);margin-bottom:26px;}
  .start{font-family:var(--f-body);font-size:1.05rem;font-weight:700;
    background:var(--aqua);color:#04202F;border:0;border-radius:13px;
    min-height:52px;padding:0 34px;cursor:pointer;
    box-shadow:0 8px 26px rgba(95,220,208,.28);}
  .start:hover{filter:brightness(1.08);}

  /* ---------- карта ---------- */
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin:16px 0 18px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--aqua);
    border-radius:12px;padding:13px 15px;text-align:left;cursor:pointer;
    font-family:var(--f-body);color:var(--text);font-size:1rem;min-height:44px;
    transition:border-color .15s, background .15s;}
  .tile:hover{background:var(--panel-2);border-left-color:var(--sand);}
  .tile b{display:block;font-family:var(--f-head);font-size:1.05rem;margin-bottom:3px;}
  .tile span{color:var(--dim);font-size:.88rem;line-height:1.45;display:block;}

  /* ---------- блоки правил ---------- */
  .rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 17px;margin-bottom:12px;}
  .rule .ex{font-family:var(--f-mono);font-size:.92rem;color:var(--aqua);
    line-height:1.75;margin:8px 0 0;word-spacing:.05em;}
  u{text-decoration:none;color:var(--sand);font-weight:700;}
  .rule .ex u{color:var(--sand);}
  .steps .ex{display:block;margin-top:5px;}
  .steps{margin:0;padding-left:1.25em;}
  .steps li{margin-bottom:9px;}
  .trap{background:var(--amber-bg);border:1px solid rgba(255,209,102,.32);
    border-left:3px solid var(--amber);border-radius:11px;padding:14px 16px;margin-top:12px;
    font-size:.98rem;}
  .trap b{color:var(--amber);}
  .memo{background:rgba(95,220,208,.1);border:1px dashed rgba(95,220,208,.4);
    border-radius:10px;padding:11px 14px;margin-top:10px;
    font-family:var(--f-mono);font-size:.95rem;color:var(--text);}

  /* ---------- упражнения ---------- */
  .instr{color:var(--dim);margin-bottom:14px;max-width:64ch;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
  .card .ctx{font-size:.82rem;color:var(--dim);margin-bottom:3px;line-height:1.35;}
  .word{font-family:var(--f-mono);font-size:1.05rem;font-weight:700;
    letter-spacing:.01em;margin-bottom:9px;word-break:keep-all;}
  .blank{display:inline-block;min-width:1.5em;text-align:center;
    border-bottom:2px solid var(--dim);color:var(--sand);font-size:1.18em;font-weight:700;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{font-family:var(--f-mono);font-size:1rem;font-weight:700;color:var(--text);
    background:transparent;border:1.5px solid var(--dim);border-radius:10px;
    min-height:44px;min-width:52px;padding:0 14px;cursor:pointer;}
  .chip:hover:not(:disabled){border-color:var(--aqua);}
  .chip.on{background:var(--aqua);color:#04202F;border-color:var(--aqua);}
  .chip:disabled{cursor:default;opacity:.5;}
  .chip.on:disabled{opacity:1;}
  .card.ok{border-color:var(--green);background:var(--green-bg);}
  .card.no{border-color:var(--red);background:var(--red-bg);}
  .card.na{border-color:var(--amber);background:var(--amber-bg);}
  .why{font-size:.92rem;line-height:1.5;margin-top:9px;padding-top:9px;
    border-top:1px solid var(--line);color:var(--text);}
  .why .fix{font-family:var(--f-mono);color:var(--green);font-weight:700;}
  .flag{font-size:.8rem;font-family:var(--f-mono);margin-top:7px;}
  .flag.na{color:var(--amber);}

  /* выбор из двух слов */
  .pick{display:flex;gap:9px;flex-wrap:wrap;}
  .pick button{font-family:var(--f-mono);font-size:.98rem;color:var(--text);
    background:transparent;border:1.5px solid var(--dim);border-radius:10px;
    min-height:44px;padding:0 14px;cursor:pointer;}
  .pick button:hover:not(:disabled){border-color:var(--aqua);}
  .pick button.on{background:var(--aqua);color:#04202F;border-color:var(--aqua);}
  .pick button:disabled{cursor:default;opacity:.5;}
  .pick button.on:disabled{opacity:1;}

  /* ---------- футер упражнения ---------- */
  .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .btn{font-family:var(--f-body);font-size:1rem;font-weight:700;border-radius:11px;
    min-height:46px;padding:0 20px;cursor:pointer;border:1px solid transparent;}
  .btn.main{background:var(--aqua);color:#04202F;}
  .btn.main:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--aqua);}
  .score{font-family:var(--f-mono);font-size:.95rem;color:var(--dim);}
  .score b.g{color:var(--green);} .score b.r{color:var(--red);} .score b.a{color:var(--amber);}

  /* ---------- сортировка ---------- */
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;margin-bottom:14px;
    padding:10px;border:1px dashed var(--line);border-radius:12px;}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px;}
  .bucket{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    cursor:pointer;min-height:88px;}
  .bucket:hover{border-color:var(--aqua);}
  .bucket h4{font-family:var(--f-head);font-size:.98rem;margin:0 0 8px;color:var(--aqua);}
  .bucket .row{display:flex;flex-wrap:wrap;gap:6px;}
  .tok{font-family:var(--f-mono);font-size:.94rem;color:var(--text);
    background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:9px;
    min-height:40px;padding:0 12px;cursor:pointer;}
  .tok:hover:not(:disabled){border-color:var(--aqua);}
  .tok.sel{border-color:var(--sand);background:rgba(255,178,125,.18);}
  .tok.ok{border-color:var(--green);background:var(--green-bg);}
  .tok.no{border-color:var(--red);background:var(--red-bg);}
  .tok:disabled{cursor:default;}
  .fixlist{margin-top:10px;font-size:.93rem;line-height:1.6;}
  .fixlist span{font-family:var(--f-mono);color:var(--green);}

  /* ---------- флеш-карты ---------- */
  .flash{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px 18px;text-align:center;cursor:pointer;margin-bottom:12px;}
  .flash .fw{font-family:var(--f-mono);font-size:clamp(1.3rem,5vw,1.8rem);font-weight:700;}
  .flash .fc{color:var(--dim);font-size:.92rem;}
  .flash .fh{color:var(--aqua);font-size:.92rem;}
  .flash .tap{color:var(--dim);font-size:.82rem;font-family:var(--f-mono);}
  .flash-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .flash-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  /* ---------- найди без ошибки ---------- */
  .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;margin-bottom:14px;}
  .wbtn{font-family:var(--f-mono);font-size:1rem;color:var(--text);text-align:left;
    background:var(--panel);border:1.5px solid var(--line);border-radius:11px;
    min-height:48px;padding:9px 13px;cursor:pointer;line-height:1.4;}
  .wbtn:hover:not(:disabled){border-color:var(--aqua);}
  .wbtn.on{border-color:var(--aqua);background:rgba(95,220,208,.16);}
  .wbtn.ok{border-color:var(--green);background:var(--green-bg);}
  .wbtn.no{border-color:var(--red);background:var(--red-bg);}
  .wbtn:disabled{cursor:default;}
  .wbtn em{display:block;font-family:var(--f-body);font-style:normal;
    font-size:.84rem;color:var(--dim);margin-top:3px;}

  /* ---------- ЕГЭ ---------- */
  .ege-q{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px;font-size:.98rem;}
  .rows{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .erow{display:flex;gap:12px;align-items:flex-start;text-align:left;
    background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;min-height:48px;color:var(--text);}
  .erow:hover:not(:disabled){border-color:var(--aqua);}
  .erow.on{border-color:var(--aqua);background:rgba(95,220,208,.14);}
  .erow.ok{border-color:var(--green);background:var(--green-bg);}
  .erow.no{border-color:var(--red);background:var(--red-bg);}
  .erow.miss{border-color:var(--amber);background:var(--amber-bg);}
  .erow:disabled{cursor:default;}
  .enum{font-family:var(--f-mono);font-weight:700;color:var(--aqua);flex:0 0 auto;}
  .ewords{font-family:var(--f-mono);font-size:.96rem;line-height:1.75;}
  .ewords .cx{font-family:var(--f-body);color:var(--dim);font-size:.86rem;}
  .ekey{font-family:var(--f-body);font-size:.88rem;color:var(--dim);margin-top:5px;line-height:1.5;}

  /* ---------- финал ---------- */
  .gauges{display:flex;gap:26px;flex-wrap:wrap;justify-content:flex-start;margin:6px 0 20px;}
  .gauge{text-align:center;}
  .gauge svg{width:clamp(122px,32vw,152px);height:auto;}
  .gauge .lab{font-size:.88rem;color:var(--dim);margin-top:5px;}
  .topics{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .topic{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
    border-left:3px solid var(--dim);}
  .topic.bad{border-left-color:var(--red);}
  .topic.mid{border-left-color:var(--amber);}
  .topic.good{border-left-color:var(--green);}
  .topic .tn{flex:1 1 auto;min-width:150px;}
  .topic .tv{font-family:var(--f-mono);font-size:.95rem;color:var(--dim);}
  .topic button{font-family:var(--f-body);font-size:.9rem;color:var(--text);
    background:transparent;border:1px solid var(--line);border-radius:9px;
    min-height:40px;padding:0 13px;cursor:pointer;}
  .topic button:hover{border-color:var(--aqua);}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sand);
    border-radius:11px;padding:15px 17px;font-size:.96rem;}
  .copied{color:var(--green);font-size:.92rem;font-family:var(--f-mono);}


  /* ---------- оглавление ---------- */
  .nav-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;}
  .toc-btn{background:transparent;border:1px solid var(--line);border-radius:9px;
    color:var(--dim);font-family:var(--f-mono);font-size:.84rem;
    padding:0 14px;min-height:40px;cursor:pointer;white-space:nowrap;}
  .toc-btn:hover{border-color:var(--aqua);color:var(--aqua);}
  .toc-overlay{position:fixed;inset:0;z-index:40;background:rgba(3,16,24,.9);display:none;
    align-items:center;justify-content:center;padding:20px;}
  .toc-overlay.open{display:flex;}
  .toc-panel{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;
    width:min(760px,100%);max-height:86dvh;display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);}
  .toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);}
  .toc-head h2{margin:0;font-size:1.2rem;color:var(--aqua);}
  .toc-close{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;
    min-height:40px;padding:0 15px;cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:.92rem;}
  .toc-close:hover{border-color:var(--aqua);color:var(--aqua);}
  .toc-body{overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch;}
  .toc-group{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;color:var(--aqua);
    font-weight:700;margin:14px 6px 6px;}
  .toc-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
    border:1px solid transparent;border-radius:10px;color:var(--text);font-family:var(--f-body);
    font-size:.95rem;padding:9px 10px;min-height:44px;cursor:pointer;}
  .toc-item:hover{border-color:var(--line);background:var(--panel);}
  .toc-item.current{border-color:var(--aqua);background:rgba(95,220,208,.12);}
  .toc-num{font-family:var(--f-mono);font-size:.82rem;color:var(--dim);min-width:26px;}
  .toc-name{flex:1;line-height:1.4;}
  .toc-tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;color:var(--dim);
    border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .toc-score{font-family:var(--f-mono);font-size:.82rem;min-width:48px;text-align:right;}
  @media (max-width:620px){ .toc-tag{display:none;} .toc-panel{max-height:90dvh;} }

/* порядок карточек перемешивается при каждой загрузке страницы */
const ORD = {};
function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
SLIDES.forEach(s=>{
  if(s.items) ORD[s.k] = shuffled(s.items.length);
  else if(s.data && s.data.items) ORD[s.k] = shuffled(s.data.items.length);
});

const A = k => (ST.ans[k] || (ST.ans[k] = {}));
const PH = k => ST.ph[k] || 0;
const FR = k => ST.fr[k] || [];

/* ==================== ПОДСЧЁТ ==================== */

function scoreOf(s){
  const k = s.k, ph = PH(k);
  if(ph === 0) return null;
  const ans = A(k);

  if(s.type === "practice" || s.type === "choice"){
    let r=0,w=0,e=0;
    s.items.forEach((it,i)=>{
      const v = ans[i];
      if(v === undefined || v === null) e++;
      else if(v === it.a) r++;
      else w++;
    });
    return {r,w,e,t:s.items.length};
  }
  if(s.type === "sort"){
    let r=0,w=0,e=0;
    s.data.items.forEach((it,i)=>{
      const v = ans[i];
      if(!v) e++; else if(v === it.b) r++; else w++;
    });
    return {r,w,e,t:s.data.items.length};
  }
  if(s.type === "find"){
    const sel = ans.sel || [];
    if(!sel.length) return {r:0,w:0,e:s.data.items.length,t:s.data.items.length};
    let r=0,w=0;
    s.data.items.forEach((it,i)=>{ (sel.includes(i) === it.ok) ? r++ : w++; });
    return {r,w,e:0,t:s.data.items.length};
  }
  if(s.type === "ege"){
    const sel = (ans.sel || []).slice().sort();
    if(!sel.length) return {r:0,w:0,e:1,t:1};
    const right = s.data.right.slice().sort();
    const hit = sel.length === right.length && sel.every((v,i)=>v === right[i]);
    return {r:hit?1:0, w:hit?0:1, e:0, t:1};
  }
  if(s.type === "flash"){
    const st = ST.fl[k] || {rat:{}};
    const known = Object.values(st.rat).filter(v=>v==="know").length;
    const rated = Object.keys(st.rat).length;
    if(!rated) return null;
    return {r:known, w:rated-known, e:s.items.length-rated, t:s.items.length, self:true};
  }
  return null;
}

/* для диагностики берём результат ПЕРВОЙ проверки: после исправлений
   счёт всегда близок к 100% и слабые темы перестают быть видны */
function baseScore(s){
  if(s.type === "flash") return scoreOf(s);
  return ST.first[s.k] || null;
}

function allScores(){
  const bySec = {};
  SLIDES.forEach(s=>{
    if(!s.sec) return;
    const sc = baseScore(s);
    if(!sc) return;
    const b = bySec[s.sec] || (bySec[s.sec] = {r:0,w:0,e:0,t:0,self:false,back:s.back||s.k});
    b.r+=sc.r; b.w+=sc.w; b.e+=sc.e; b.t+=sc.t;
    if(sc.self) b.self = true;
  });
  return bySec;
}

const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function wordHTML(pair, val, reveal){
  const shown = reveal !== undefined ? reveal : (val || "·");
  return esc(pair[0]) + '<span class="blank">' + esc(shown) + '</span>' + esc(pair[1]);
}

function scoreLine(sc){
  if(!sc) return "";
  let out = '<span class="score">Верно <b class="g">'+sc.r+'</b>';
  if(sc.w) out += ' · неверно <b class="r">'+sc.w+'</b>';
  if(sc.e) out += ' · не отвечено <b class="a">'+sc.e+'</b>';
  out += ' из '+sc.t+'</span>';
  return out;
}

function droplets(el){
  if(document.body.classList.contains("calm")) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const rc = el.getBoundingClientRect();
  const cx = rc.left+rc.width/2, cy = rc.top+rc.height/2;
  for(let i=0;i<5;i++){
    const ang = (i/5)*Math.PI*2 + Math.random()*.4, dist = 18+Math.random()*12;
    const d = document.createElement("div");
    d.className = "drop";
    d.style.left = cx+"px"; d.style.top = cy+"px";
    d.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    d.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    document.body.appendChild(d);
    d.addEventListener("animationend", ()=>d.remove());
  }
}

/* --- футер с двухшаговой проверкой --- */
function footer(el, s){
  const k = s.k, ph = PH(k), foot = el.querySelector("#foot");
  const sc = scoreOf(s);
  let html = "";
  if(ph === 0){
    html = '<button class="btn main" type="button" id="chk">Проверить</button>';
  } else if(ph === 1){
    html = '<button class="btn main" type="button" id="again">Ещё попытка</button>' + scoreLine(sc) +
      '<div style="flex-basis:100%;color:var(--dim);font-size:.9rem;">Верные ответы закреплены, неверные и пропущенные откроются для правки. Правильные буквы пока не показываем — вспоминайте.</div>';
  } else if(ph === 15){
    html = '<button class="btn main" type="button" id="chk">Проверить</button>' +
      '<span class="score">Открыты только неверные и пропущенные позиции</span>';
  } else {
    html = scoreLine(sc) + '<button class="btn ghost" type="button" id="rst">Пройти заново</button>';
  }
  foot.innerHTML = html;
  const chk = foot.querySelector("#chk"), ag = foot.querySelector("#again"), rst = foot.querySelector("#rst");
  if(chk) chk.addEventListener("click", ()=>doCheck(s));
  if(ag) ag.addEventListener("click", ()=>{ ST.ph[k] = 15; save(); render(ST.cur); });
  if(rst) rst.addEventListener("click", ()=>{
    ST.ans[k] = {}; ST.ph[k] = 0; ST.fr[k] = [];
    delete ST.first[k]; if(ST.fl[k]) delete ST.fl[k];
    save(); render(ST.cur);
  });
}

function doCheck(s){
  const k = s.k, ph = PH(k);
  if(ph === 15){ ST.ph[k] = 2; save(); render(ST.cur); return; }

  const ans = A(k);
  const frozen = [];
  let pending = 0;

  if(s.type === "practice" || s.type === "choice"){
    s.items.forEach((it,i)=>{ (ans[i] === it.a) ? frozen.push(i) : pending++; });
  } else if(s.type === "sort"){
    s.data.items.forEach((it,i)=>{ (ans[i] === it.b) ? frozen.push(i) : pending++; });
  } else if(s.type === "find"){
    const sel = ans.sel || [];
    if(!sel.length) pending++;
    s.data.items.forEach((it,i)=>{
      const match = sel.includes(i) === it.ok;
      if(match && it.ok) frozen.push(i);
      if(!match) pending++;
    });
  } else if(s.type === "ege"){
    const sel = ans.sel || [];
    sel.forEach(r=>{ if(s.data.right.includes(r)) frozen.push(r); });
    const done = sel.length === s.data.right.length && s.data.right.every(r=>sel.includes(r));
    pending = done ? 0 : 1;
  }

  ST.fr[k] = frozen;
  ST.ph[k] = pending === 0 ? 2 : 1;
  if(!ST.first[k]){
    const sc = scoreOf(s);
    if(sc) ST.first[k] = {r:sc.r, w:sc.w, e:sc.e, t:sc.t};
  }
  save(); render(ST.cur);
}

/* --- сортировка --- */
let SEL = null;
function rSort(el, s){
  const k = s.k, ph = PH(k), ans = A(k), fr = FR(k), ord = ORD[k], D = s.data;
  const live = (ph === 0 || ph === 15);

  const tok = (i, inBucket)=>{
    const it = D.items[i];
    let cls = "tok";
    if(ph >= 1 && ans[i]) cls += (ans[i] === it.b) ? " ok" : " no";
    if(SEL === i) cls += " sel";
    const movable = live && !fr.includes(i);
    return '<button type="button" class="'+cls+'" data-t="'+i+'"'+(movable?"":" disabled")+'>'+esc(it.t)+'</button>';
  };

  const pool = ord.filter(i=>!ans[i]).map(i=>tok(i,false)).join("") ||
               '<span style="color:var(--dim);font-size:.9rem;">Все слова разложены</span>';

  const buckets = D.buckets.map(b=>{
    const inside = ord.filter(i=>ans[i] === b).map(i=>tok(i,true)).join("");
    return '<div class="bucket" data-b="'+esc(b)+'"><h4>'+esc(b)+'</h4><div class="row">'+inside+'</div></div>';
  }).join("");

  let fix = "";
  if(ph === 2){
    const wrong = D.items.map((it,i)=>({it,i})).filter(x=>ans[x.i] !== x.it.b);
    fix = wrong.length
      ? '<div class="fixlist"><b>Верное распределение:</b><br>' +
        wrong.map(x=>esc(x.it.t)+' → <span>'+esc(x.it.b)+'</span>').join("<br>") + '</div>'
      : '<div class="fixlist">Все слова разложены верно.</div>';
  }

  el.innerHTML = head(s) +
    '<p class="instr">'+s.instr+'</p>' +
    '<div class="pool">'+pool+'</div>' +
    '<div class="buckets">'+buckets+'</div>' +
    fix + '<div class="foot" id="foot"></div>';

  if(live){
    el.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{
      SEL = (SEL === +b.dataset.t) ? null : +b.dataset.t;
      render(ST.cur);
    }));
    el.querySelectorAll(".bucket").forEach(b=>b.addEventListener("click",(ev)=>{
      if(ev.target.closest("[data-t]")) return;
      if(SEL === null) return;
      ans[SEL] = b.dataset.b; SEL = null; save(); render(ST.cur);
    }));
  }
  footer(el, s);
  const foot = el.querySelector("#foot");
  const ag = foot.querySelector("#again");
  if(ag){
    ag.addEventListener("click", ()=>{
      D.items.forEach((it,i)=>{ if(!FR(k).includes(i)) delete ans[i]; });
      save();
    }, true);
  }
}

}

function rEge(el, s){
  const k = s.k, ph = PH(k), ans = A(k), fr = FR(k), D = s.data;
  const sel = ans.sel || (ans.sel = []);
  const live = (ph === 0 || ph === 15);

  const rows = D.rows.map((row, ri)=>{
    const on = sel.includes(ri);
    let cls = "erow" + (on ? " on" : "");
    if(ph === 1 && on) cls = "erow " + (D.right.includes(ri) ? "ok" : "no");
    if(ph === 2){
      if(D.right.includes(ri)) cls = "erow " + (on ? "ok" : "miss");
      else cls = "erow" + (on ? " no" : "");
    }
    const words = row.map(w=>{
      const rev = (ph === 2) ? w.a : undefined;
      return wordHTML(w.w, null, rev === undefined ? "…" : rev) +
             (w.cx ? ' <span class="cx">('+esc(w.cx)+')</span>' : '');
    }).join(", ");
    let key = "";
    if(ph === 2){
      const letters = row.map(w=>w.a);
      const same = letters.every(x=>x === letters[0]);
      key = '<div class="ekey">' + (same
        ? 'Во всех словах «'+esc(letters[0])+'» — ряд подходит.'
        : 'Буквы разные: ' + letters.map(x=>'«'+esc(x)+'»').join(", ") + ' — ряд не подходит.') + '</div>';
    }
    const movable = live && !fr.includes(ri);
    return '<button type="button" class="'+cls+'" data-r="'+ri+'"'+(movable?"":" disabled")+'>' +
      '<span class="enum">'+(ri+1)+'</span><span class="ewords">'+words+key+'</span></button>';
  }).join("");

  let verdict = "";
  if(ph === 2){
    const nums = D.right.map(r=>r+1).join("");
    verdict = '<div class="trap" style="margin-bottom:14px;"><b>Ответ: '+nums+'</b></div>';
  }

  el.innerHTML =

      save(); render(ST.cur);
    }));
  }
  footer(el, s);
  const ag = el.querySelector("#again");
  if(ag) ag.addEventListener("click", ()=>{
    ans.sel = sel.filter(r=>FR(k).includes(r));
    save();
  }, true);
}

}

function rFinal(el){
  const bySec = allScores();
  const keys = Object.keys(bySec);

  let R=0, W=0;
  keys.forEach(x=>{ if(!bySec[x].self){ R += bySec[x].r; W += bySec[x].w; } });
  const und = (R+W) ? Math.round(R/(R+W)*100) : null;
  const done = Math.round(((ST.max+1)/SLIDES.length)*100);

  const list = keys.map(x=>{
    const v = bySec[x];
    const pct = (v.r+v.w) ? Math.round(v.r/(v.r+v.w)*100) : null;
    return {name:x, v, pct};
  }).sort((a,b)=>{
    if(a.pct === null) return 1; if(b.pct === null) return -1;
    return a.pct - b.pct;
  });

  const topics = list.length ? list.map(o=>{
    const cls = o.pct === null ? "" : (o.pct < 60 ? " bad" : o.pct < 85 ? " mid" : " good");
    const val = (o.pct === null ? "нет ответов" : o.pct + "%") +
      (o.v.e ? " · пропущено " + o.v.e : "") + (o.v.self ? " · самооценка" : "");
    return '<div class="topic'+cls+'"><span class="tn">'+esc(o.name)+'</span>' +
      '<span class="tv">'+val+'</span>' +
      '<button type="button" data-b="'+esc(o.v.back)+'">К теории</button></div>';
  }).join("") : '<div class="topic"><span class="tn">Практика ещё не пройдена — вернитесь к упражнениям.</span></div>';

  el.innerHTML =
    '<div class="kicker">Итоги</div>' +
    '<h1>Что получилось с заданием 9</h1>' +
    '<p class="lead">Слева — сколько тренажёра пройдено. Справа — доля верных ответов <b class="hl">с первой попытки</b>: исправления после «Ещё попытки» в этот процент не идут, иначе слабые темы перестали бы быть видны. Флеш-карты в общий счёт не входят — там оценка ставится самостоятельно.</p>' +
    '<div class="gauges">' +
      gauge(done, "#5FDCD0", "Пройдено", done+"%") +
      (und === null ? gauge(0, "#3d5c6b", "Верных ответов", "—")
                    : gauge(und, und >= 70 ? "#4BE3A2" : "#FF7C6E", "Верных ответов", und+"%")) +
    '</div>' +
    '<h2>Темы на повторение</h2>' +
    '<p class="lead">Сверху — то, что проседает сильнее всего. Тот же список с процентами доступен в оглавлении: кнопка со счётчиком слайдов внизу экрана.</p>' +
    '<div class="topics">'+topics+'</div>' +
    '<div class="foot" style="margin-bottom:16px;">' +
      '<button class="btn main" type="button" id="cp">Скопировать итог</button>' +
      '<button class="btn ghost" type="button" id="clr">Очистить прогресс</button>' +
      '<span id="cpmsg"></span>' +
    '</div>' +
    '<div class="note"><b>Что делать дальше.</b> Пройдите ещё раз флеш-карты, начав с тех, что отмечены «Повторю»: порядок карточек меняется при каждом открытии страницы, так что запомнить расположение не выйдет. Проседающие темы удобно повторять по одному блоку в день, а не все сразу.</div>';

  el.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>go(IDX[b.dataset.b])));
  el.querySelector("#cp").addEventListener("click", ()=>copySummary(list, und, done));
  el.querySelector("#clr").addEventListener("click", ()=>{
    if(!confirm("Стереть все ответы и начать тренажёр заново?")) return;
    ST.ans = {}; ST.ph = {}; ST.fr = {}; ST.fl = {}; ST.first = {}; ST.max = 0;
    save(); render(ST.cur);
  });
}

function copySummary(list, und, done){
  const lines = ["Задание 9. Правописание корней — итог тренажёра",
    "Пройдено: "+done+"%   Верных с первой попытки: "+(und === null ? "—" : und+"%"), ""];
  if(!list.length) lines.push("Упражнения не пройдены.");
  list.forEach(o=>{
    const pct = o.pct === null ? "нет ответов" : o.pct+"%";
    lines.push("• "+o.name+" — "+pct+" (верно "+o.v.r+", неверно "+o.v.w+
      (o.v.e ? ", пропущено "+o.v.e : "")+")"+(o.v.self ? " [самооценка]" : ""));
  });
  const text = lines.join("\n");
  const done2 = ()=>{
    const m = document.getElementById("cpmsg");
    if(m){ m.className = "copied"; m.textContent = "Скопировано"; setTimeout(()=>{ m.textContent=""; }, 2500); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done2, ()=>fallbackCopy(text, done2));
  } else fallbackCopy(text, done2);
}

function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){}
  ta.remove();
}

/* ==================== НАВИГАЦИЯ ==================== */

function go(i){
  SEL = null;
  ST.cur = Math.max(0, Math.min(SLIDES.length-1, i));
  ST.max = Math.max(ST.max, ST.cur);
  save(); render(ST.cur); updateNav();
  stage.scrollTop = 0;
}

function updateNav(){
  prevBtn.disabled = ST.cur === 0;
  nextBtn.disabled = ST.cur === SLIDES.length-1;
  counter.textContent = "слайд " + (ST.cur+1) + " из " + SLIDES.length + "  \u25BE";
  barFill.style.width = Math.round(((ST.cur+1)/SLIDES.length)*100) + "%";
}

/* ---------- оглавление ---------- */
const tocOverlay = document.getElementById("tocOverlay");
const tocBody = document.getElementById("tocBody");
const TAGS = {title:"Начало", map:"Карта", rule:"Правило", practice:"Практика",
  choice:"Практика", sort:"Практика", find:"Практика", flash:"Карточки",
  egeIntro:"Формат ЕГЭ", ege:"Задание ЕГЭ", final:"Итог"};

function slideName(s, i){
  if(s.type === "title") return "Титульный слайд";
  if(s.type === "map") return "Карта задания 9";
  if(s.type === "egeIntro") return "Как устроены задания ЕГЭ";
  if(s.type === "final") return "Итог и темы на повторение";
  return s.title || TAGS[s.type] || ("Слайд " + (i+1));
}

function buildTOC(){
  let html = "", lastSec = null;
  SLIDES.forEach((s,i)=>{
    const sec = s.sec || null;
    if(sec && sec !== lastSec){ html += '<div class="toc-group">'+esc(sec)+'</div>'; lastSec = sec; }
    if(!sec) lastSec = null;

    const f = baseScore(s);
    let score;
    if(f){
      const a = f.r + f.w;
      const pct = a ? Math.round(f.r/a*100) : null;
      const col = pct === null ? "var(--dim)" : (pct >= 80 ? "var(--green)" : (pct >= 55 ? "var(--amber)" : "var(--red)"));
      score = '<span class="toc-score" style="color:'+col+'">'+(pct === null ? "—" : pct+"%")+'</span>';
    } else {
      score = '<span class="toc-score" style="color:var(--dim)">·</span>';
    }
    html += '<button type="button" class="toc-item'+(i === ST.cur ? " current" : "")+'" data-i="'+i+'">' +
      '<span class="toc-num">'+(i+1)+'</span>' +
      '<span class="toc-name">'+esc(slideName(s,i))+'</span>' +
      '<span class="toc-tag">'+esc(TAGS[s.type] || "")+'</span>' + score + '</button>';
  });
  tocBody.innerHTML = html;
  tocBody.querySelectorAll(".toc-item").forEach(b=>{
    b.addEventListener("click", ()=>{ closeTOC(); go(+b.dataset.i); });
  });
  const cur = tocBody.querySelector(".toc-item.current");
  if(cur && cur.scrollIntoView) setTimeout(()=>cur.scrollIntoView({block:"center"}), 0);
}

function openTOC(){ buildTOC(); tocOverlay.classList.add("open"); const c = tocBody.querySelector(".toc-item.current"); if(c && c.focus) c.focus({preventScroll:true}); }
function closeTOC(){ tocOverlay.classList.remove("open"); if(counter.focus) counter.focus({preventScroll:true}); }
counter.addEventListener("click", openTOC);
document.getElementById("tocClose").addEventListener("click", closeTOC);
tocOverlay.addEventListener("click", e=>{ if(e.target === tocOverlay) closeTOC(); });

prevBtn.addEventListener("click", ()=>go(ST.cur-1));
nextBtn.addEventListener("click", ()=>go(ST.cur+1));
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeTOC(); return; }
  if(tocOverlay.classList.contains("open")) return;
  if(e.target && e.target.closest && e.target.closest("button")) return;
  if(e.key === "ArrowRight") go(ST.cur+1);
  if(e.key === "ArrowLeft") go(ST.cur-1);
});

function setCalm(on){
  ST.calm = on;
  document.body.classList.toggle("calm", on);
  calmBtn.setAttribute("aria-pressed", on ? "true" : "false");
  calmBtn.textContent = on ? "Движение выключено" : "Спокойный режим";
  save();
}
calmBtn.addEventListener("click", ()=>setCalm(!ST.calm));
setCalm(!!ST.calm);

(function bubbles(){
  const wrap = document.getElementById("bubbles");
  for(let i=0;i<16;i++){
    const b = document.createElement("i");
    const sz = 4 + Math.random()*15;
    b.style.width = sz+"px"; b.style.height = sz+"px";
    b.style.left = (Math.random()*100)+"%";
    b.style.animationDuration = (9 + Math.random()*12)+"s";
    b.style.animationDelay = (Math.random()*11)+"s";
    wrap.appendChild(b);
  }
})();

go(ST.cur || 0);

</script>
</body>
</html>
