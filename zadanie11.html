<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Задание 11. Правописание суффиксов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0A0820; --bg2:#100D2C; --bg3:#161239;
    --panel:rgba(255,255,255,.055);
    --panel-2:rgba(255,255,255,.09);
    --panel-solid:#13102F;
    --line:rgba(200,205,255,.17);
    --text:#EEF0FB;
    --dim:#B3B7DA;
    --cyan:#6FDCE3;
    --pink:#F4A6D8;
    --neon-c:#00F0E6; --neon-m:#FF3FD2;
    --green:#5BE0A4; --green-bg:rgba(91,224,164,.15);
    --red:#FF8B8B;   --red-bg:rgba(255,139,139,.15);
    --amber:#FFD27A; --amber-bg:rgba(255,210,122,.13);
    --on-accent:#0A0820;

    --f-head:'PT Serif', Georgia, serif;
    --f-body:'PT Sans', 'Segoe UI', system-ui, sans-serif;
    --f-mono:'JetBrains Mono', 'Consolas', 'Courier New', monospace;

    --step: clamp(1rem, .96rem + .18vw, 1.08rem);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100dvh; height:100dvh;
    background:
      radial-gradient(ellipse 70% 45% at 12% 0%, rgba(111,220,227,.09) 0%, transparent 60%),
      radial-gradient(ellipse 60% 45% at 92% 8%, rgba(244,166,216,.08) 0%, transparent 60%),
      linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--f-body);
    font-size:var(--step);
    line-height:1.6;
    display:flex; flex-direction:column;
    overflow:hidden; position:relative;
  }

  /* ---------- каркас ---------- */
  .bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;position:relative;z-index:3;}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .35s ease;}

  .stage{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;align-items:flex-start;justify-content:center;
    padding:34px 22px 28px;position:relative;z-index:1;}
  .slide{width:100%;max-width:880px;animation:appear .35s ease-out;}
  @keyframes appear{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  .nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(10,8,32,.82);
    backdrop-filter:blur(10px);position:relative;z-index:3;}
  .nav button{
    font-family:var(--f-body);font-size:.95rem;color:var(--text);
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    min-height:44px;padding:0 16px;cursor:pointer;}
  .nav button:hover:not(:disabled){border-color:var(--cyan);}
  .nav button:disabled{opacity:.35;cursor:default;}
  .nav .calm-btn{font-size:.82rem;padding:0 12px;min-height:44px;}
  .calm-btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);}

  :where(button,input,[tabindex]):focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  /* спокойный режим и системная настройка «уменьшить движение» */
  body.calm .slide{animation:none !important;}
  body.calm .drop{display:none !important;}
  body.calm .boot .ln{animation:none !important;opacity:1 !important;}
  @media (prefers-reduced-motion: reduce){
    .slide,.boot .ln{animation:none !important;opacity:1 !important;}
    *{transition-duration:.01ms !important;}
  }

  /* ---------- типографика ---------- */
  h1{font-family:var(--f-head);font-weight:700;line-height:1.15;margin:0 0 14px;
    font-size:clamp(1.6rem, 1.25rem + 1.7vw, 2.4rem);}
  h2{font-family:var(--f-head);font-weight:700;line-height:1.2;margin:0 0 12px;
    font-size:clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem);}
  h3{font-family:var(--f-head);font-weight:700;font-size:1.12rem;color:var(--cyan);margin:0 0 8px;}
  p{margin:0 0 10px;}
  .kicker{font-family:var(--f-mono);font-size:.86rem;color:var(--cyan);margin-bottom:8px;}
  .lead{color:var(--dim);max-width:66ch;margin-bottom:18px;}
  b.hl{color:var(--pink);}

  /* ---------- титул: неоновая заставка ---------- */
  .hero{position:relative;overflow:hidden;border-radius:20px;
    min-height:min(76dvh,660px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px 18px;
    background:
      radial-gradient(ellipse 55% 40% at 50% 55%, rgba(0,240,230,.10) 0%, transparent 65%),
      radial-gradient(ellipse 70% 55% at 50% 55%, rgba(255,63,210,.08) 0%, transparent 70%),
      radial-gradient(ellipse at 50% 45%, #140733 0%, #06021A 80%);
    border:1px solid rgba(0,240,230,.22);
    box-shadow:0 0 0 1px rgba(255,63,210,.10) inset, 0 20px 60px rgba(0,0,0,.45);}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);}
  body.calm .hero::after{display:none;}
  .hero-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
  .boot{font-family:var(--f-mono);font-size:.84rem;line-height:1.7;color:#9FA6D8;
    text-align:left;margin-bottom:22px;min-height:5.1em;}
  .boot .ln{opacity:0;animation:lnIn .3s ease forwards;}
  .boot .ln.ok{color:var(--green);}
  .boot .ln:nth-child(1){animation-delay:.1s;}
  .boot .ln:nth-child(2){animation-delay:.45s;}
  .boot .ln:nth-child(3){animation-delay:.8s;}
  @keyframes lnIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  .hero-sup{font-family:var(--f-body);font-size:clamp(.95rem,2.6vw,1.12rem);letter-spacing:.08em;color:#CFE9F2;
    text-shadow:0 0 18px rgba(0,240,230,.55);}
  .hero-sup::after{content:"";display:block;width:4.5rem;height:2px;margin:12px auto 0;
    background:var(--neon-c);box-shadow:0 0 12px var(--neon-c);}
  .hero-title{font-family:var(--f-head);font-weight:700;color:#fff;
    font-size:clamp(2.8rem,11vw,5.4rem);line-height:1;margin:18px 0 10px;
    text-shadow:0 2px 10px rgba(0,0,0,.7), 0 0 26px rgba(255,63,210,.75), 0 0 54px rgba(0,240,230,.35);}
  .hero-sub{font-family:var(--f-head);color:#FFE3F6;font-size:clamp(1.15rem,3.6vw,1.5rem);margin-bottom:6px;}
  .hero-sub::after{content:"";display:block;width:4.5rem;height:2px;margin:14px auto 0;
    background:var(--neon-m);box-shadow:0 0 12px var(--neon-m);}
  .hero-note{color:#C3C8EA;max-width:36ch;font-size:.98rem;margin:16px 0 24px;}
  .start{font-family:var(--f-body);font-size:1.08rem;font-weight:700;
    background:var(--neon-c);color:#04141A;border:0;border-radius:13px;
    min-height:52px;padding:0 36px;cursor:pointer;
    box-shadow:0 0 22px rgba(0,240,230,.45);}
  .start:hover{filter:brightness(1.08);}

  /* ---------- карта ---------- */
  .map-group{font-family:var(--f-head);font-size:1.05rem;color:var(--pink);margin:18px 0 8px;}
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);
    border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;
    font-family:var(--f-body);color:var(--text);font-size:1rem;min-height:44px;
    transition:border-color .15s, background .15s;}
  .tile:hover{background:var(--panel-2);border-left-color:var(--pink);}
  .tile b{display:block;font-family:var(--f-mono);font-size:.95rem;margin-bottom:3px;}
  .tile span{color:var(--dim);font-size:.9rem;line-height:1.45;display:block;}

  /* ---------- блоки правил ---------- */
  .rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 17px;margin-bottom:12px;}
  .rule .ex{font-family:var(--f-mono);font-size:.95rem;color:var(--cyan);
    line-height:1.8;margin:8px 0 0;}
  u{text-decoration:none;color:var(--pink);font-weight:700;}
  .steps{margin:0;padding-left:1.25em;}
  .steps li{margin-bottom:9px;}
  .trap{background:var(--amber-bg);border:1px solid rgba(255,210,122,.32);
    border-left:3px solid var(--amber);border-radius:11px;padding:14px 16px;margin-top:12px;font-size:1rem;}
  .trap b{color:var(--amber);}
  .memo{background:rgba(111,220,227,.09);border:1px dashed rgba(111,220,227,.4);
    border-radius:10px;padding:11px 14px;margin-top:10px;
    font-family:var(--f-mono);font-size:.95rem;color:var(--text);line-height:1.7;}
  .src{color:var(--dim);font-size:.9rem;margin-top:8px;}

  /* ---------- упражнения ---------- */
  .instr{color:var(--dim);margin-bottom:12px;max-width:64ch;}
  .peek{font-family:var(--f-body);font-size:.95rem;color:var(--text);
    background:transparent;border:1px dashed var(--line);border-radius:10px;
    min-height:44px;padding:0 14px;cursor:pointer;margin-bottom:14px;}
  .peek:hover{border-color:var(--pink);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
  .card .ctx{font-size:.9rem;color:var(--dim);margin-bottom:3px;line-height:1.4;}
  .word{font-family:var(--f-mono);font-size:1.08rem;font-weight:700;margin-bottom:9px;overflow-wrap:anywhere;}
  .blank{display:inline-block;min-width:1.4em;text-align:center;
    border-bottom:2px solid var(--dim);color:var(--pink);font-size:1.22em;font-weight:700;line-height:1.1;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{font-family:var(--f-mono);font-size:1.02rem;font-weight:700;color:var(--text);
    background:transparent;border:1.5px solid var(--dim);border-radius:10px;
    min-height:44px;min-width:50px;padding:0 14px;cursor:pointer;}
  .chip:hover:not(:disabled){border-color:var(--cyan);}
  .chip.on{background:var(--cyan);color:var(--on-accent);border-color:var(--cyan);}
  .chip:disabled{cursor:default;opacity:.5;}
  .chip.on:disabled{opacity:1;}
  .card.ok{border-color:var(--green);background:var(--green-bg);}
  .card.no{border-color:var(--red);background:var(--red-bg);}
  .card.na{border-color:var(--amber);background:var(--amber-bg);}
  .why{font-size:1em;line-height:1.5;margin-top:9px;padding-top:9px;
    border-top:1px solid var(--line);color:var(--text);}
  .why .fix{font-family:var(--f-mono);color:var(--green);font-weight:700;}
  .flag{font-size:.9rem;margin-top:7px;}
  .flag.na{color:var(--amber);}

  /* выбор правила */
  .qtext{font-family:var(--f-mono);font-size:1.08rem;font-weight:700;margin-bottom:9px;}
  .pick{display:flex;flex-direction:column;gap:8px;}
  .pick button{font-family:var(--f-body);font-size:1rem;color:var(--text);text-align:left;line-height:1.35;
    background:transparent;border:1.5px solid var(--dim);border-radius:10px;
    min-height:44px;padding:8px 13px;cursor:pointer;}
  .pick button:hover:not(:disabled){border-color:var(--cyan);}
  .pick button.on{background:var(--cyan);color:var(--on-accent);border-color:var(--cyan);}
  .pick button:disabled{cursor:default;opacity:.55;}
  .pick button.on:disabled{opacity:1;}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}

  /* ---------- футер упражнения ---------- */
  .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .btn{font-family:var(--f-body);font-size:1rem;font-weight:700;border-radius:11px;
    min-height:46px;padding:0 20px;cursor:pointer;border:1px solid transparent;}
  .btn.main{background:var(--cyan);color:var(--on-accent);}
  .btn.main:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--cyan);}
  .score{font-family:var(--f-mono);font-size:.95rem;color:var(--dim);}
  .score b.g{color:var(--green);} .score b.r{color:var(--red);} .score b.a{color:var(--amber);}
  .hint2{flex-basis:100%;color:var(--dim);font-size:.95rem;}

  /* ---------- флеш-карты ---------- */
  .flash{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px 18px;text-align:center;cursor:pointer;margin-bottom:12px;width:100%;
    color:var(--text);font-family:var(--f-body);font-size:1rem;}
  .flash .fw{font-family:var(--f-mono);font-size:clamp(1.3rem,5vw,1.8rem);font-weight:700;}
  .flash .fc{color:var(--dim);font-size:.95rem;}
  .flash .fh{color:var(--cyan);font-size:1rem;max-width:44ch;}
  .flash .tap{color:var(--dim);font-size:.9rem;}
  .flash-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .flash-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  /* ---------- ЕГЭ ---------- */
  .ege-q{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px;font-size:1.02rem;}
  .rows{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .erow{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    padding:11px 14px;cursor:pointer;min-height:48px;color:var(--text);font-family:var(--f-body);font-size:1rem;}
  .erow:hover:not(:disabled){border-color:var(--cyan);}
  .erow.on{border-color:var(--cyan);background:rgba(111,220,227,.12);}
  .erow.ok{border-color:var(--green);background:var(--green-bg);}
  .erow.no{border-color:var(--red);background:var(--red-bg);}
  .erow.miss{border-color:var(--amber);background:var(--amber-bg);}
  .erow:disabled{cursor:default;}
  .enum{font-family:var(--f-mono);font-weight:700;color:var(--cyan);flex:0 0 auto;}
  .ewords{font-family:var(--f-mono);font-size:1rem;line-height:1.7;overflow-wrap:anywhere;}
  .ewords .cx{font-family:var(--f-body);color:var(--dim);}
  .ekey{font-family:var(--f-body);font-size:.98rem;color:var(--text);margin-top:6px;line-height:1.5;}
  .ekey i{font-style:normal;color:var(--dim);}
  .ans-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .ans-line label{font-family:var(--f-head);font-size:1.08rem;}
  .ans{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;letter-spacing:.18em;
    width:8.5ch;min-height:48px;padding:0 12px;border-radius:10px;
    background:rgba(255,255,255,.07);border:1.5px solid var(--dim);color:var(--text);}
  .ans:disabled{opacity:.8;}
  .ans.ok{border-color:var(--green);} .ans.no{border-color:var(--red);} .ans.na{border-color:var(--amber);}

  /* ---------- финал ---------- */
  .gauges{display:flex;gap:26px;flex-wrap:wrap;justify-content:flex-start;margin:6px 0 20px;}
  .gauge{text-align:center;}
  .gauge svg{width:clamp(122px,32vw,152px);height:auto;}
  .gauge .lab{font-size:.92rem;color:var(--dim);margin-top:5px;}
  .topics{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .topic{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px;
    border-left:3px solid var(--dim);}
  .topic.bad{border-left-color:var(--red);}
  .topic.mid{border-left-color:var(--amber);}
  .topic.good{border-left-color:var(--green);}
  .topic .tn{flex:1 1 auto;min-width:150px;}
  .topic .tv{font-family:var(--f-mono);font-size:.95rem;color:var(--dim);}
  .topic button{font-family:var(--f-body);font-size:.95rem;color:var(--text);
    background:transparent;border:1px solid var(--line);border-radius:9px;
    min-height:44px;padding:0 13px;cursor:pointer;}
  .topic button:hover{border-color:var(--cyan);}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pink);
    border-radius:11px;padding:15px 17px;font-size:1rem;}
  .copied{color:var(--green);font-size:.95rem;font-family:var(--f-mono);}
  .copybox{width:100%;min-height:11rem;margin:0 0 16px;padding:12px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);
    font-family:var(--f-mono);font-size:.9rem;line-height:1.5;}

  /* ---------- оглавление ---------- */
  .nav-mid{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-width:0;}
  .toc-btn{background:transparent;border:1px solid var(--line);border-radius:9px;
    color:var(--dim);font-family:var(--f-mono);font-size:.86rem;
    padding:0 14px;min-height:44px;cursor:pointer;white-space:nowrap;}
  .toc-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .toc-overlay{position:fixed;inset:0;z-index:40;background:rgba(6,4,20,.9);display:none;
    align-items:center;justify-content:center;padding:20px;}
  .toc-overlay.open{display:flex;}
  .toc-panel{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;
    width:min(760px,100%);max-height:86dvh;display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.6);}
  .toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);}
  .toc-head h2{margin:0;font-size:1.2rem;color:var(--cyan);}
  .toc-close{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;
    min-height:44px;padding:0 15px;cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:.95rem;}
  .toc-close:hover{border-color:var(--cyan);color:var(--cyan);}
  .toc-body{overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch;}
  .toc-group{font-family:var(--f-head);font-size:.98rem;color:var(--pink);font-weight:700;margin:14px 6px 6px;}
  .toc-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
    border:1px solid transparent;border-radius:10px;color:var(--text);font-family:var(--f-body);
    font-size:.98rem;padding:9px 10px;min-height:44px;cursor:pointer;}
  .toc-item:hover{border-color:var(--line);background:var(--panel);}
  .toc-item.current{border-color:var(--cyan);background:rgba(111,220,227,.12);}
  .toc-num{font-family:var(--f-mono);font-size:.85rem;color:var(--dim);min-width:26px;}
  .toc-name{flex:1;line-height:1.4;}
  .toc-tag{font-family:var(--f-mono);font-size:.78rem;color:var(--dim);
    border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .toc-score{font-family:var(--f-mono);font-size:.88rem;min-width:48px;text-align:right;}

  .drop{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--pink);
    transform:translate(-50%,-50%);pointer-events:none;z-index:60;
    animation:dropFly .45s ease-out forwards;}
  @keyframes dropFly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .drop{display:none;} }

  /* ---------- телефон ---------- */
  @media (max-width:620px){
    .stage{padding:20px 14px 20px;}
    .grid,.grid.wide{grid-template-columns:1fr;}
    .map{grid-template-columns:1fr;}
    .gauges{gap:16px;justify-content:center;}
    .toc-tag{display:none;}
    .toc-panel{max-height:90dvh;}
    .hero{min-height:min(80dvh,620px);border-radius:16px;}
    .nav .calm-btn{font-size:.78rem;}
  }
  @media (max-width:400px){
    .stage{padding:16px 10px 18px;}
    .nav{padding-left:8px;padding-right:8px;gap:6px;}
    .nav button{padding:0 11px;font-size:.9rem;}
    .toc-btn{padding:0 10px;}
    .rule,.card,.erow{padding-left:11px;padding-right:11px;}
    .boot{font-size:.76rem;}
  }
</style>

/* порядок карточек перемешивается при каждой загрузке страницы,
   ответы привязаны к номеру позиции в банке, а не к месту на экране */
const ORD = {};
function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
SLIDES.forEach(s=>{ if(s.items) ORD[s.k] = shuffled(s.items.length); });

/* варианты букв всегда в одном порядке (по алфавиту, «—» в конце),
   чтобы положение кнопки не подсказывало ответ */
const OPT_ORDER = "аеёиоыясчщ—";
SLIDES.forEach(s=>{
  if(s.type === "practice") s.items.forEach(it=>it.o.sort((x,y)=>OPT_ORDER.indexOf(x)-OPT_ORDER.indexOf(y)));
});

const A = k => (ST.ans[k] || (ST.ans[k] = {}));
const PH = k => ST.ph[k] || 0;
const FR = k => ST.fr[k] || [];
const L = x => x === "—" ? "" : x;

/* ==================== ПОДСЧЁТ ==================== */

function egeNorm(v){ return String(v || "").replace(/[^1-5]/g,"").split("").sort().join(""); }
function egeRight(D){ return D.right.map(r=>r+1).sort().join(""); }

function scoreOf(s){
  const k = s.k, ph = PH(k);
  if(ph === 0) return null;
  const ans = A(k);

  if(s.type === "practice" || s.type === "choice"){
    let r=0,w=0,e=0;
    s.items.forEach((it,i)=>{
      const v = ans[i];
      if(v === undefined || v === null) e++;
      else if(v === it.a) r++;
      else w++;
    });
    return {r,w,e,t:s.items.length};
  }
  if(s.type === "ege"){
    const v = egeNorm(ans.v);
    if(!v) return {r:0,w:0,e:1,t:1};
    const hit = v === egeRight(s.data);
    return {r:hit?1:0, w:hit?0:1, e:0, t:1};
  }
  if(s.type === "flash"){
    const st = ST.fl[k] || {rat:{}};
    const known = Object.values(st.rat).filter(v=>v==="know").length;
    const rated = Object.keys(st.rat).length;
    if(!rated) return null;
    return {r:known, w:rated-known, e:s.items.length-rated, t:s.items.length, self:true};
  }
  return null;
}

/* для диагностики берём результат ПЕРВОЙ проверки: после исправлений
   счёт всегда близок к 100% и слабые темы перестают быть видны */
function baseScore(s){
  if(s.type === "flash") return scoreOf(s);
  return ST.first[s.k] || null;
}

function allScores(){
  const bySec = {};
  SLIDES.forEach(s=>{
    if(!s.sec) return;
    const sc = baseScore(s);
    if(!sc) return;
    const b = bySec[s.sec] || (bySec[s.sec] = {r:0,w:0,e:0,t:0,self:false,back:s.back||s.k});
    b.r+=sc.r; b.w+=sc.w; b.e+=sc.e; b.t+=sc.t;
    if(sc.self) b.self = true;
  });
  return bySec;
}

/* ==================== УТИЛИТЫ ==================== */

const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function wordHTML(pair, val, reveal){
  const shown = reveal !== undefined ? reveal : (val || "·");
  return esc(pair[0]) + '<span class="blank">' + esc(shown) + '</span>' + esc(pair[1]);
}

function scoreLine(sc){
  if(!sc) return "";
  let out = '<span class="score">Верно <b class="g">'+sc.r+'</b>';
  if(sc.w) out += ' · неверно <b class="r">'+sc.w+'</b>';
  if(sc.e) out += ' · не отвечено <b class="a">'+sc.e+'</b>';
  out += ' из '+sc.t+'</span>';
  return out;
}

function reducedMotion(){
  try{ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){ return false; }
}
function stillMode(){ return document.body.classList.contains("calm") || reducedMotion(); }

function sparks(el){
  if(stillMode()) return;
  const rc = el.getBoundingClientRect();
  const cx = rc.left+rc.width/2, cy = rc.top+rc.height/2;
  for(let i=0;i<5;i++){
    const ang = (i/5)*Math.PI*2 + Math.random()*.4, dist = 16+Math.random()*10;
    const d = document.createElement("div");
    d.className = "drop";
    d.style.left = cx+"px"; d.style.top = cy+"px";
    d.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    d.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    document.body.appendChild(d);
    d.addEventListener("animationend", ()=>d.remove());
  }
}

  stopWarp();
  const s = SLIDES[i];
  const keepScroll = stage.scrollTop;
  const el = document.createElement("div");
  el.className = "slide";
  stage.innerHTML = ""; stage.appendChild(el);
  ({title:rTitle, map:rMap, rule:rRule, practice:rPractice, choice:rPractice,
    flash:rFlash, egeIntro:rEgeIntro, ege:rEge, final:rFinal})[s.type](el, s);
  stage.scrollTop = keepScroll;
  if(RESTORE){
    const t = stage.querySelector(RESTORE);

/* --- титул: неоновая заставка --- */
let WARP = null;
function stopWarp(){
  if(!WARP) return;
  if(WARP.raf) cancelAnimationFrame(WARP.raf);
  window.removeEventListener("resize", WARP.onResize);
  WARP = null;
}
function startWarp(canvas){
  const ctx = canvas.getContext && canvas.getContext("2d");
  if(!ctx) return;
  const still = stillMode();
  const colors = ["0,240,230", "255,63,210"];
  const P = [];
  let W=0, H=0, cx=0, cy=0, maxR=1;

  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rc = canvas.getBoundingClientRect();
    W = rc.width || 600; H = rc.height || 400;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W*.5; cy = H*.55;
    maxR = Math.hypot(Math.max(cx, W-cx), Math.max(cy, H-cy)) * 1.05;
  }
  function spawn(p){
    p.a = Math.random()*Math.PI*2;
    p.r = Math.random()*(maxR*.14) + 4;
    p.sp = .6 + Math.random()*1.3;
    p.len = 8 + Math.random()*22;
    p.c = colors[Math.random() < .5 ? 0 : 1];
    p.w = Math.random() < .25 ? 2 : 1;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      const nx = Math.cos(p.a), ny = Math.sin(p.a);
      const alpha = Math.sin(Math.min(1, p.r/maxR)*Math.PI) * (still ? .55 : .8);
      ctx.strokeStyle = "rgba("+p.c+","+alpha.toFixed(3)+")";
      ctx.lineWidth = p.w;
      ctx.beginPath();
      ctx.moveTo(cx+nx*p.r, cy+ny*p.r);
      ctx.lineTo(cx+nx*(p.r+p.len), cy+ny*(p.r+p.len));
      ctx.stroke();
    }
  }
  size();
  const N = Math.round(Math.min(110, Math.max(50, W/12)));
  for(let i=0;i<N;i++){ const p = {}; spawn(p); p.r = Math.random()*maxR; P.push(p); }

  WARP = {raf:0, onResize:()=>{ size(); if(still) draw(); }};
  window.addEventListener("resize", WARP.onResize);

  if(still){ draw(); return; }
  function frame(){
    for(const p of P){ p.r += p.sp*(1 + p.r/maxR*3); if(p.r > maxR) spawn(p); }
    draw();
    if(WARP) WARP.raf = requestAnimationFrame(frame);
  }
  WARP.raf = requestAnimationFrame(frame);
}

  } else {

  }
  foot.innerHTML = html;
  const chk = foot.querySelector("#chk"), ag = foot.querySelector("#again"), rst = foot.querySelector("#rst");
  if(chk) chk.addEventListener("click", ()=>doCheck(s));
  if(ag) ag.addEventListener("click", ()=>{ ST.ph[k] = 15; save(); render(ST.cur); });
  if(rst) rst.addEventListener("click", ()=>{

    delete ST.first[k];

  });

function doCheck(s){
  const k = s.k, ph = PH(k);
  if(ph === 15){ ST.ph[k] = 2; save(); render(ST.cur); return; }

  const ans = A(k);
  const frozen = [];
  let pending = 0;

  if(s.type === "practice" || s.type === "choice"){
    s.items.forEach((it,i)=>{ (ans[i] === it.a) ? frozen.push(i) : pending++; });
  } else if(s.type === "ege"){
    pending = egeNorm(ans.v) === egeRight(s.data) ? 0 : 1;
  }

  ST.fr[k] = frozen;
  ST.ph[k] = pending === 0 ? 2 : 1;
  if(!ST.first[k]){
    const sc = scoreOf(s);
    if(sc) ST.first[k] = {r:sc.r, w:sc.w, e:sc.e, t:sc.t};
  }
  save(); render(ST.cur);
}

  el.querySelector("#know").addEventListener("click", ()=>rate("know"));
  el.querySelector("#rev").addEventListener("click", ()=>rate("review"));
  el.querySelector("#fp").addEventListener("click", ()=>{ st.pos = Math.max(0, st.pos-1); st.flip=false; save(); render(ST.cur); });
  el.querySelector("#fn").addEventListener("click", ()=>{ st.pos = Math.min(s.items.length-1, st.pos+1); st.flip=false; save(); render(ST.cur); });
  const fr2 = el.querySelector("#frst");
  if(fr2) fr2.addEventListener("click", ()=>{ delete ST.fl[k]; save(); render(ST.cur); });
  bindPeek(el);
}

function rEge(el, s){
  const k = s.k, ph = PH(k), ans = A(k), D = s.data;
  const live = (ph === 0 || ph === 15);
  const cur = egeNorm(ans.v);
  const right = egeRight(D);

  const rows = D.rows.map((row, ri)=>{
    const d = String(ri+1);
    const on = cur.includes(d);
    let cls = "erow" + (live && on ? " on" : "");
    if(ph === 2){
      if(D.right.includes(ri)) cls = "erow " + (on ? "ok" : "miss");
      else cls = "erow" + (on ? " no" : "");
    }
    const words = row.map(w=>{
      const shown = (ph === 2) ? L(w.a) : "..";
      const blank = (ph === 2) ? '<span class="blank">'+esc(shown)+'</span>' : esc("..");
      return esc(w.w[0]) + blank + esc(w.w[1]) + (w.cx ? ' <span class="cx">('+esc(w.cx)+')</span>' : '');
    }).join(", ");
    let key = "";
    if(ph === 2){
      const letters = row.map(w=>w.a);
      const same = letters.every(x=>x === letters[0]);
      const nm = x => x === "—" ? "без буквы" : "«"+x+"»";
      key = '<div class="ekey">' + (same ? 'В обоих словах '+nm(letters[0])+' — ряд подходит.' : 'Буквы разные: '+letters.map(nm).join(" и ")+' — ряд не подходит.') +
        '<br><i>' + row.map(w=>esc(w.w[0]+L(w.a)+w.w[1])+' — '+w.why).join("; ") + '.</i></div>';
    }
    return '<button type="button" class="'+cls+'" data-r="'+d+'"'+(live?"":" disabled")+'>' +
      '<span class="enum">'+d+')</span><span class="ewords">'+words+key+'</span></button>';
  }).join("");

  let ansCls = "ans";
  if(ph === 1){ ansCls += cur ? " no" : " na"; }
  if(ph === 2){ ansCls += cur === right ? " ok" : " no"; }

  let verdict = "";
  if(ph === 1){
    verdict = '<div class="trap" style="margin-bottom:14px;"><b>' + (cur ? 'Неверно.' : 'Ответ не записан.') + '</b> ' +
      (cur ? 'Где-то есть лишний или пропущенный ряд.' : 'Пустой ответ не считается ошибкой, но и балла не приносит.') + '</div>';
  }
  if(ph === 2){
    verdict = '<div class="trap" style="margin-bottom:14px;"><b>Правильный ответ: '+right+'.</b> ' +
      (cur === right ? 'Ваш ответ совпал.' : (cur ? 'Ваш ответ: '+cur+'.' : 'Ответ не был записан.')) + '</div>';
  }

  el.innerHTML =
    '<div class="kicker">Формат ЕГЭ · '+s.title+'</div>' +
    '<h1>Задание 11</h1>' +
    '<div class="ege-q">'+EGE_Q+(D.src ? '<div class="src">Источник: '+D.src+'.</div>' : '')+'</div>' +
    '<div class="rows">'+rows+'</div>' +
    '<div class="ans-line"><label for="egeAns">Ответ:</label>' +
      '<input class="'+ansCls+'" id="egeAns" type="text" inputmode="numeric" autocomplete="off" maxlength="5" value="'+esc(ans.v || "")+'"'+(live?"":" disabled")+'>' +
    '</div>' + verdict +
    '<div class="foot" id="foot"></div>';

  if(live){
    const inp = el.querySelector("#egeAns");
    inp.addEventListener("input", ()=>{
      const clean = inp.value.replace(/[^1-5]/g,"").slice(0,5);
      if(clean !== inp.value) inp.value = clean;
      ans.v = clean;
      if(!clean) delete ans.v;
      save();
      const set = egeNorm(clean);
      el.querySelectorAll("[data-r]").forEach(b=>b.classList.toggle("on", set.includes(b.dataset.r)));
    });
    el.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
      const d = b.dataset.r;
      let v = egeNorm(ans.v);
      v = v.includes(d) ? v.replace(d,"") : egeNorm(v + d);
      if(v) ans.v = v; else delete ans.v;
      RESTORE = '[data-r="'+d+'"]';
      save(); render(ST.cur);
    }));
  }
  footer(el, s);
}

/* --- итоги --- */
function gauge(pct, color, label, text){
  const id = "g"+Math.random().toString(36).slice(2,8);
  const r = 62, c = 72, dash = 2*Math.PI*r, off = dash*(1-pct/100);
  return '<div class="gauge"><svg viewBox="0 0 144 144" role="img" aria-label="'+label+': '+text+'">' +
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.14)" stroke-width="9"/>' +
    '<circle id="'+id+'" cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="'+dash.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 72 72)"/>' +
    '<text x="72" y="81" text-anchor="middle" font-family="PT Serif, serif" font-size="26" fill="#EEF0FB">'+text+'</text>' +
    '</svg><div class="lab">'+label+'</div></div>';
}

function rFinal(el){
  const bySec = allScores();
  const keys = Object.keys(bySec);

  let R=0, W=0;
  keys.forEach(x=>{ if(!bySec[x].self){ R += bySec[x].r; W += bySec[x].w; } });
  const und = (R+W) ? Math.round(R/(R+W)*100) : null;
  const done = Math.round(((ST.max+1)/SLIDES.length)*100);

  const list = keys.map(x=>{
    const v = bySec[x];
    const pct = (v.r+v.w) ? Math.round(v.r/(v.r+v.w)*100) : null;
    return {name:x, v, pct};
  }).sort((a,b)=>{
    if(a.pct === null) return 1; if(b.pct === null) return -1;
    return a.pct - b.pct;
  });

  const topics = list.length ? list.map(o=>{
    const cls = o.pct === null ? "" : (o.pct < 55 ? " bad" : o.pct < 80 ? " mid" : " good");
    const val = (o.pct === null ? "нет ответов" : o.pct + "%") +
      (o.v.e ? " · пропущено " + o.v.e : "") + (o.v.self ? " · самооценка" : "");
    return '<div class="topic'+cls+'"><span class="tn">'+esc(o.name)+'</span>' +
      '<span class="tv">'+val+'</span>' +
      '<button type="button" data-b="'+esc(o.v.back)+'">К теории</button></div>';
  }).join("") : '<div class="topic"><span class="tn">Практика ещё не пройдена — вернитесь к упражнениям.</span></div>';

  el.innerHTML =
    '<div class="kicker">Рефлексируем</div>' +
    '<h1>Итог: успехи и точки роста</h1>' +
    '<p class="lead">Слева — сколько тренажёра пройдено. Справа — доля верных ответов <b class="hl">с первой попытки</b>: исправления после «Ещё попытки» в этот процент не идут, иначе слабые темы перестали бы быть видны. Флеш-карты в общий счёт не входят — там оценка ставится самостоятельно.</p>' +
    '<div class="gauges">' +
      gauge(done, "#6FDCE3", "Пройдено", done+"%") +
      (und === null ? gauge(0, "#3A3E66", "Верных с первой попытки", "—")
                    : gauge(und, und >= 80 ? "#5BE0A4" : (und >= 55 ? "#FFD27A" : "#FF8B8B"), "Верных с первой попытки", und+"%")) +
    '</div>' +
    '<h2>Темы на повторение</h2>' +
    '<p class="lead">Сверху — то, что проседает сильнее всего. Кнопка «К теории» возвращает к правилу этой темы.</p>' +
    '<div class="topics">'+topics+'</div>' +
    '<div class="foot" style="margin-bottom:16px;">' +
      '<button class="btn main" type="button" id="cp">Скопировать итог</button>' +
      '<button class="btn ghost" type="button" id="clr">Очистить прогресс</button>' +
      '<span id="cpmsg"></span>' +
    '</div>' +
    '<div id="cpbox"></div>' +
    '<div class="note"><b>Что делать дальше.</b> Скопируйте итог и пришлите преподавателю. Начинайте повторение с верхних тем списка — по одному блоку в день, а не все сразу. Флеш-карты с исключениями пройдите ещё раз, начиная с тех, что отмечены «Повторю».</div>';

  el.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>go(IDX[b.dataset.b])));
  el.querySelector("#cp").addEventListener("click", ()=>copySummary(list, und, done));
  el.querySelector("#clr").addEventListener("click", ()=>{
    let ok = true;
    try{ ok = window.confirm("Стереть все ответы и начать тренажёр заново?"); }catch(e){ ok = true; }
    if(!ok) return;
    ST.ans = {}; ST.ph = {}; ST.fr = {}; ST.fl = {}; ST.first = {}; ST.max = ST.cur;
    save(); render(ST.cur);
  });
}

function copySummary(list, und, done){
  const lines = ["Задание 11. Правописание суффиксов — итог тренажёра",
    "Пройдено: "+done+"%   Верных с первой попытки: "+(und === null ? "—" : und+"%"), ""];
  if(!list.length) lines.push("Упражнения не пройдены.");
  list.forEach(o=>{
    const pct = o.pct === null ? "нет ответов" : o.pct+"%";
    lines.push("• "+o.name+" — "+pct+" (верно "+o.v.r+", неверно "+o.v.w+
      (o.v.e ? ", пропущено "+o.v.e : "")+")"+(o.v.self ? " [самооценка]" : ""));
  });
  const text = lines.join("\n");
  const ok = ()=>{
    const m = document.getElementById("cpmsg");
    if(m){ m.className = "copied"; m.textContent = "Скопировано"; setTimeout(()=>{ m.textContent=""; }, 2500); }
  };
  const manual = ()=>{
    const box = document.getElementById("cpbox");
    if(!box) return;
    box.innerHTML = '<p class="instr">Скопировать автоматически не получилось. Выделите текст ниже и скопируйте его вручную.</p><textarea class="copybox" readonly></textarea>';
    const ta = box.querySelector("textarea");
    ta.value = text;
    try{ ta.focus(); ta.select(); }catch(e){}
  };
  const fallback = ()=>{ if(!legacyCopy(text)) manual(); else ok(); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fallback);
      return;
    }
  }catch(e){}
  fallback();
}

function legacyCopy(text){
  let done = false;
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
  document.body.appendChild(ta);
  try{ ta.select(); done = document.execCommand("copy"); }catch(e){ done = false; }
  ta.remove();
  return done;
}

/* ==================== НАВИГАЦИЯ ==================== */

function go(i){
  ST.cur = Math.max(0, Math.min(SLIDES.length-1, i));
  ST.max = Math.max(ST.max, ST.cur);
  save(); stage.scrollTop = 0; render(ST.cur); updateNav();
  stage.scrollTop = 0;
}

function updateNav(){
  prevBtn.disabled = ST.cur === 0;
  nextBtn.disabled = ST.cur === SLIDES.length-1;
  counter.textContent = "слайд " + (ST.cur+1) + " из " + SLIDES.length + " \u25BE";
  counter.setAttribute("aria-label", "Оглавление. Слайд " + (ST.cur+1) + " из " + SLIDES.length);
  barFill.style.width = Math.round(((ST.cur+1)/SLIDES.length)*100) + "%";
}

/* ---------- оглавление ---------- */
const tocOverlay = document.getElementById("tocOverlay");
const tocBody = document.getElementById("tocBody");
const TAGS = {title:"Начало", map:"Карта", rule:"Теория", practice:"Практика",
  choice:"Практика", flash:"Карточки", egeIntro:"ЕГЭ", ege:"ЕГЭ", final:"Итог"};

function slideName(s, i){
  if(s.type === "title") return "Титульный слайд";
  if(s.type === "map") return "Карта задания 11";
  if(s.type === "egeIntro") return "Как устроено задание ЕГЭ";
  if(s.type === "final") return "Итог и темы на повторение";
  if(s.type === "ege") return "Задание ЕГЭ: " + s.title.toLowerCase();
  if(s.type === "rule") return "Теория: " + s.title;
  return s.title || ("Слайд " + (i+1));
}

function buildTOC(){
  let html = "", lastSec = null;
  SLIDES.forEach((s,i)=>{
    const sec = s.sec || null;
    if(sec && sec !== lastSec){ html += '<div class="toc-group">'+esc(sec)+'</div>'; }
    lastSec = sec;

    const f = baseScore(s);
    let score;
    if(f){
      const a = f.r + f.w;
      const pct = a ? Math.round(f.r/a*100) : null;
      const col = pct === null ? "var(--dim)" : (pct >= 80 ? "var(--green)" : (pct >= 55 ? "var(--amber)" : "var(--red)"));
      score = '<span class="toc-score" style="color:'+col+'">'+(pct === null ? "—" : pct+"%")+'</span>';
    } else {
      score = '<span class="toc-score" style="color:var(--dim)">·</span>';
    }
    html += '<button type="button" class="toc-item'+(i === ST.cur ? " current" : "")+'" data-i="'+i+'">' +
      '<span class="toc-num">'+(i+1)+'</span>' +
      '<span class="toc-name">'+esc(slideName(s,i))+'</span>' +
      '<span class="toc-tag">'+esc(TAGS[s.type] || "")+'</span>' + score + '</button>';
  });
  tocBody.innerHTML = html;
  tocBody.querySelectorAll(".toc-item").forEach(b=>{
    b.addEventListener("click", ()=>{ closeTOC(true); go(+b.dataset.i); });
  });
}

function openTOC(){
  buildTOC();
  tocOverlay.classList.add("open");
  const c = tocBody.querySelector(".toc-item.current");
  if(c){
    try{ c.scrollIntoView({block:"center"}); }catch(e){}
    try{ c.focus({preventScroll:true}); }catch(e){}
  }
}
function closeTOC(silent){
  if(!tocOverlay.classList.contains("open")) return;
  tocOverlay.classList.remove("open");
  if(!silent){ try{ counter.focus({preventScroll:true}); }catch(e){} }
}
counter.addEventListener("click", openTOC);
document.getElementById("tocClose").addEventListener("click", ()=>closeTOC());
tocOverlay.addEventListener("click", e=>{ if(e.target === tocOverlay) closeTOC(); });

prevBtn.addEventListener("click", ()=>go(ST.cur-1));
nextBtn.addEventListener("click", ()=>go(ST.cur+1));
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeTOC(); return; }
  if(tocOverlay.classList.contains("open")) return;
  const t = e.target;
  if(t && t.closest && t.closest("input, textarea")) return;
  if(e.key === "ArrowRight") go(ST.cur+1);
  if(e.key === "ArrowLeft") go(ST.cur-1);
});

function setCalm(on, rerender){
  ST.calm = on;
  document.body.classList.toggle("calm", on);
  calmBtn.setAttribute("aria-pressed", on ? "true" : "false");
  calmBtn.textContent = on ? "Движение выключено" : "Спокойный режим";
  save();
  if(rerender && ST.cur === 0) render(0);
}
calmBtn.addEventListener("click", ()=>setCalm(!ST.calm, true));
setCalm(!!ST.calm, false);

go(ST.cur || 0);
</script>
