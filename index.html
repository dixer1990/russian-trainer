<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Тренажёры по русскому языку. Подготовка к ЕГЭ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1219;
    --panel:rgba(255,255,255,.05);
    --panel-hi:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.14);
    --text:#ECF1F5;
    --dim:#93A6B4;
    --gold:#E0B060;
    --f-head:'PT Serif', Georgia, serif;
    --f-body:'PT Sans', 'Segoe UI', system-ui, sans-serif;
    --f-mono:'JetBrains Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100dvh;
    background:
      radial-gradient(ellipse 80% 55% at 15% -5%, rgba(224,176,96,.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 5%, rgba(95,160,200,.09), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--f-body);
    font-size:clamp(1rem,.96rem + .18vw,1.06rem); line-height:1.6;
  }
  .wrap{max-width:820px; margin:0 auto; padding:clamp(34px,7vw,72px) clamp(16px,4vw,28px) 60px;}

  header{margin-bottom:clamp(28px,5vw,44px);}
  .sup{font-family:var(--f-mono); font-size:.82rem; letter-spacing:.24em;
    color:var(--gold); margin-bottom:12px;}
  h1{font-family:var(--f-head); font-weight:700; line-height:1.12; margin:0 0 12px;
    font-size:clamp(1.9rem,1.3rem + 2.6vw,3rem);}
  .sub{color:var(--dim); max-width:52ch; margin:0;}

  .list{display:flex; flex-direction:column; gap:11px;}
  a.card, div.card{
    display:flex; align-items:center; gap:clamp(13px,3vw,20px);
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:clamp(14px,3vw,18px) clamp(15px,3vw,20px);
    color:var(--text); text-decoration:none; min-height:44px;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  a.card:hover{background:var(--panel-hi); border-color:var(--gold); transform:translateY(-1px);}
  a.card:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  div.card{opacity:.42;}

  .num{font-family:var(--f-mono); font-weight:700;
    font-size:clamp(1.5rem,4.5vw,2rem); line-height:1;
    color:var(--gold); min-width:2.2ch; text-align:right;}
  div.card .num{color:var(--dim);}
  .body{flex:1; min-width:0;}
  .name{font-family:var(--f-head); font-weight:700;
    font-size:clamp(1.05rem,2.6vw,1.2rem); line-height:1.3; margin-bottom:3px;}
  .desc{color:var(--dim); font-size:.92rem; line-height:1.45;}
  .go{font-family:var(--f-mono); font-size:1.15rem; color:var(--dim); flex:0 0 auto;}
  a.card:hover .go{color:var(--gold);}
  .soon{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.08em;
    color:var(--dim); border:1px solid var(--line); border-radius:7px;
    padding:3px 9px; flex:0 0 auto; white-space:nowrap;}

  footer{margin-top:clamp(30px,6vw,48px); padding-top:20px;
    border-top:1px solid var(--line); color:var(--dim); font-size:.9rem;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:420px){
    .go{display:none;}
    .num{font-size:1.45rem; min-width:2ch;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sup">ЕГЭ по русскому языку</div>
    <h1>Тренажёры по заданиям</h1>
    <p class="sub">Каждый тренажёр — теория, практика и задания в формате экзамена. Прогресс сохраняется в браузере: можно закрыть вкладку и вернуться позже.</p>
  </header>

  <div class="list" id="list"></div>

  <footer>Открывается на компьютере и на телефоне. Ничего устанавливать не нужно.</footer>
</div>

<script>
/* ------------------------------------------------------------------
   ЧТОБЫ ДОБАВИТЬ НОВЫЙ ТРЕНАЖЁР — допишите строку в список ниже.

   num   — номер задания ЕГЭ (в кавычках, с нулём впереди для 09)
   name  — название темы
   desc  — короткое пояснение, одна строка
   file  — имя файла в репозитории; поставьте null, если ещё не залит
   ------------------------------------------------------------------ */
var TRAINERS = [
  {num:"09", name:"Правописание корней",
   desc:"Проверяемые, словарные и чередующиеся гласные. Шипящие и Ц.",
   file:"zadanie09.html"},

  {num:"10", name:"Правописание приставок",
   desc:"Неизменяемые, на З и С, ПРЕ- и ПРИ-, Ы и И после приставок.",
   file:null},

  {num:"12", name:"Личные окончания и суффиксы",
   desc:"Спряжение глаголов, суффиксы причастий, слова-исключения.",
   file:null},

  {num:"14", name:"Слитное, раздельное и дефисное написание",
   desc:"Предлоги, союзы, наречия, частицы. Разбор омонимичных пар.",
   file:"zadanie14.html"},

  {num:"15", name:"Н и НН в разных частях речи",
   desc:"Прилагательные, причастия, наречия, существительные.",
   file:null}
];

var html = "";
TRAINERS.forEach(function(t){
  var head = '<span class="num">' + t.num + '</span>' +
    '<span class="body"><span class="name">' + t.name + '</span>' +
    '<span class="desc">' + t.desc + '</span></span>';
  if(t.file){
    html += '<a class="card" href="' + t.file + '">' + head + '<span class="go">&rarr;</span></a>';
  } else {
    html += '<div class="card">' + head + '<span class="soon">скоро</span></div>';
  }
});
document.getElementById("list").innerHTML = html;
</script>
</body>
</html>
