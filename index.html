<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPERATION: РУССКИЙ — тренажёр по орфографии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161a;
  --bg2:#1b2127;
  --panel:#232b33;
  --line:#3a464f;
  --gold:#d9a441;
  --gold-dim:#8a6a2c;
  --ct:#5b8fc9;
  --t:#e2e6e8;
  --dim:#8d9aa3;
  --hit:#8bc34a;
  --miss:#c0392b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{-webkit-tap-highlight-color:rgba(217,164,65,.25)}
body{
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),
    radial-gradient(1200px 600px at 50% -10%,#1e262d 0%,var(--bg) 70%);
  color:var(--t);
  font-family:'Rajdhani','Arial Narrow',sans-serif;
  font-size:17px;
  min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 60px}

/* ---------- HUD ---------- */
.hud{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#20272e,#171c21);
  padding:12px 16px;
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
.logo{font-weight:700;font-size:24px;letter-spacing:2px;line-height:1}
.logo b{color:var(--gold)}
.logo small{display:block;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--dim);margin-top:3px}
.hud-stat{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);line-height:1.5}
.hud-stat b{display:block;font-size:22px;color:var(--t);font-family:'Rajdhani',sans-serif}
.hud-stat.money b{color:var(--hit)}
.hp{flex:1 1 260px;min-width:220px}
.bar{height:14px;background:#0d1115;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar span{position:absolute;inset:0;font-family:'Share Tech Mono',monospace;font-size:10px;line-height:12px;text-align:center;color:#0d1115;mix-blend-mode:hard-light}
.hud-btns{display:flex;gap:8px;margin-left:auto}
button{font-family:'Rajdhani',sans-serif;cursor:pointer}
.btn{
  background:#2b343d;color:var(--t);border:1px solid var(--line);
  padding:7px 14px;font-size:14px;font-weight:600;letter-spacing:.5px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.mute.off{color:#65707a}

/* ---------- LAYOUT ---------- */
.grid{display:grid;grid-template-columns:290px 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.side{border:1px solid var(--line);background:#181e23;padding:10px}
.side h2{
  margin:0 0 8px;font-size:13px;letter-spacing:3px;color:var(--gold);
  font-family:'Share Tech Mono',monospace;font-weight:400;
  border-bottom:1px solid var(--line);padding-bottom:7px;
}
.mission{
  display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-left:3px solid var(--line);color:var(--t);padding:7px 9px;margin-bottom:3px;font-size:15px;
  position:relative;
}
.mission:hover{background:#212931;border-left-color:var(--gold-dim)}
.mission.active{background:#262f38;border-left-color:var(--gold);color:var(--gold)}
.mission .m-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mission .pct{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim)}
.mission.active .pct{color:var(--gold)}
.mission .mini{height:3px;background:#0d1115;margin-top:5px}
.mission .mini i{display:block;height:100%;background:var(--ct);width:0;transition:width .3s}
.mission.cleared .mini i{background:var(--hit)}
.mission .tag{font-family:'Share Tech Mono',monospace;font-size:10px;color:#6d7982;letter-spacing:1px}

.arena{border:1px solid var(--line);background:linear-gradient(180deg,#1c2329,#161b20);padding:0;min-height:520px;display:flex;flex-direction:column}
.brief{padding:14px 18px;border-bottom:1px solid var(--line);background:#1a2026}
.brief h1{margin:0;font-size:24px;letter-spacing:1px}
.brief p{margin:6px 0 0;color:var(--dim);font-size:15px;line-height:1.45;max-width:72ch}
.brief .meta{display:flex;gap:16px;margin-top:9px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#6d7982;flex-wrap:wrap}
.brief .meta b{color:var(--gold)}

.stage{padding:26px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.crosshair{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:26px;height:26px;opacity:.35}
.crosshair:before,.crosshair:after{content:'';position:absolute;background:var(--hit)}
.crosshair:before{left:12px;top:0;width:2px;height:26px}
.crosshair:after{top:12px;left:0;height:2px;width:26px}

.target{font-size:44px;font-weight:700;letter-spacing:1px;line-height:1.25;margin:6px 0 4px;max-width:22ch;overflow-wrap:break-word;hyphens:auto}
.target.small{font-size:27px;max-width:36ch;font-weight:600;line-height:1.4}
.blank{display:inline-block;min-width:1.4ch;padding:0 6px;border-bottom:3px solid var(--gold);color:var(--gold)}
.blank.filled{border-bottom-color:var(--hit);color:var(--hit)}
.blank.bad{border-bottom-color:var(--miss);color:var(--miss)}
.hintq{color:var(--dim);font-size:17px;margin-bottom:14px;font-family:'Share Tech Mono',monospace}

.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;width:100%;max-width:640px}
.opt{
  background:#2b343d;border:1px solid var(--line);color:var(--t);
  font-size:22px;font-weight:600;padding:12px 26px;min-width:74px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:transform .08s;
}
.opt.wide{flex:1 1 260px;font-size:18px;padding:13px 16px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{background:#2c3b23;border-color:var(--hit);color:#c8e6a0;opacity:1}
.opt.wrong{background:#3b2422;border-color:var(--miss);color:#e8a49e;opacity:1}

.verdict{margin-top:20px;width:100%;max-width:720px;text-align:left;border-left:3px solid var(--line);background:#1a2026;padding:12px 15px;display:none}
.verdict.show{display:block}
.verdict .head{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:2px;margin-bottom:6px}
.verdict.ok{border-left-color:var(--hit)} .verdict.ok .head{color:var(--hit)}
.verdict.no{border-left-color:var(--miss)} .verdict.no .head{color:var(--miss)}
.verdict p{margin:0;font-size:16px;line-height:1.5;color:#cdd5da}
.verdict .fix{color:var(--gold);font-weight:600}

.foot{border-top:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#161b20}
.ammo{font-family:'Share Tech Mono',monospace;color:var(--dim);font-size:13px}
.ammo b{color:var(--t);font-size:20px;font-family:'Rajdhani',sans-serif}
.streak{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:1px;min-height:16px}
.foot .btn{margin-left:auto}

.result{text-align:center;padding:34px 18px}
.result .rank{font-size:52px;font-weight:700;letter-spacing:2px;color:var(--gold);line-height:1}
.result .score{font-family:'Share Tech Mono',monospace;color:var(--dim);margin:10px 0 20px;font-size:15px}
.result table{margin:0 auto 18px;border-collapse:collapse;font-size:15px;max-width:520px;width:100%}
.result td{border-top:1px solid var(--line);padding:6px 8px;text-align:left;color:#cdd5da}
.result td:last-child{text-align:right;font-family:'Share Tech Mono',monospace}

.feed{position:fixed;top:12px;right:12px;width:230px;pointer-events:none;z-index:50}
.feed div{
  background:rgba(13,17,21,.85);border-right:3px solid var(--hit);
  font-family:'Share Tech Mono',monospace;font-size:11px;color:#cdd5da;
  padding:5px 8px;margin-bottom:4px;animation:fadeout 3.4s forwards;
}
.feed div.no{border-right-color:var(--miss)}
@keyframes fadeout{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.feed div{animation:none}.bar i,.mission .mini i{transition:none}}

/* ---- планшет: одна колонка, список миссий остаётся вертикальным ---- */
@media(max-width:900px){
  .wrap{padding:12px 12px 40px}
  .arena{min-height:0}
  .feed{top:auto;bottom:8px;right:8px;left:8px;width:auto;display:flex;flex-direction:column;align-items:flex-end}
  .feed div{max-width:230px}
}
@media(max-width:600px){
  body{font-size:16px}
  .target{font-size:31px;max-width:100%}
  .target.small{font-size:20px;max-width:100%}
  .hud{gap:10px 14px;padding:10px 12px}
  .logo{font-size:19px;flex:1 1 100%}
  .hud-stat b{font-size:18px}
  .hp{flex:1 1 100%;min-width:0}
  .hud-btns{margin-left:0;flex:1 1 100%}
  .hud-btns .btn{flex:1}
  .stage{padding:18px 12px}
  .brief{padding:12px 13px}
  .brief h1{font-size:20px}
  .brief p{font-size:14px}
  .opt{font-size:20px;padding:14px 22px;min-width:66px}
  .opt.wide{flex:1 1 100%;font-size:16px}
  .verdict p{font-size:15px}
  .foot{padding:10px 12px;gap:10px}
  .foot .btn{margin-left:0;flex:1 1 100%;text-align:center}
  .result .rank{font-size:34px}
}
@supports(padding:max(0px)){
  .wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
}
kbd{font-family:'Share Tech Mono',monospace;background:#2b343d;border:1px solid var(--line);padding:0 5px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="feed" id="feed"></div>
<div class="wrap">

  <div class="hud">
    <div class="logo">OPERATION: <b>РУССКИЙ</b><small>ORTHOGRAPHY RANGE // 15 MISSIONS</small></div>
    <div class="hud-stat money">$<b id="money">0</b></div>
    <div class="hud-stat">ЗАДАНИЙ ВЗЯТО<b id="totalHit">0</b></div>
    <div class="hp hud-stat">ОБЩИЙ ПРОГРЕСС
      <div class="bar"><i id="hpBar"></i><span id="hpTxt">0%</span></div>
    </div>
    <div class="hud-btns">
      <button class="btn mute" id="muteBtn">ЗВУК: ON</button>
      <button class="btn" id="wipeBtn">СБРОС</button>
    </div>
  </div>

  <div class="grid">
    <div class="side">
      <h2>MISSIONS</h2>
      <div id="missions"></div>
    </div>
    <div class="arena">
      <div class="brief">
        <h1 id="mTitle"></h1>
        <p id="mDesc"></p>
        <div class="meta">
          <span>ТОЧНОСТЬ: <b id="mAcc">0%</b></span>
          <span>ПРОГРЕСС: <b id="mProg">0%</b></span>
          <span>ЦЕЛЕЙ: <b id="mTot">0</b></span>
        </div>
      </div>
      <div class="stage" id="stage"></div>
      <div class="foot">
        <div class="ammo">ПАТРОНЫ <b id="ammo">0/0</b></div>
        <div class="streak" id="streak"></div>
        <button class="btn" id="retryBtn">НОВАЯ ПОПЫТКА (перемешать)</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= ДАННЫЕ ================= */
/* t — задание (… = пропуск), o — варианты, a — индекс верного, e — объяснение */

const DATA = [
{id:"th-noun",name:"Теория: существительное",tag:"THEORY",
 desc:"Постоянные и непостоянные признаки, склонение, синтаксическая роль. Отвечай по памяти — подсказок нет.",
 q:[
 {t:"Какой признак имени существительного НЕ относится к постоянным?",o:["склонение","падеж","одушевлённость","собственное/нарицательное"],a:1,e:"Падеж — непостоянный признак: у существительного всего два непостоянных признака — число и падеж."},
 {t:"Выбери полный набор постоянных признаков существительного.",o:["род, число, падеж","род, склонение, одуш./неодуш., собств./нариц.","склонение, падеж, роль в предложении","вид, возвратность, род"],a:1,e:"Постоянные: род, склонение, одушевлённое/неодушевлённое, собственное/нарицательное."},
 {t:"Непостоянные признаки существительного — это…",o:["число и падеж","род и число","падеж и склонение","число и род"],a:0,e:"Только число и падеж; род и склонение у существительного менять нельзя."},
 {t:"Склонение — это…",o:["изменение по родам","изменение по падежам и числам","изменение по лицам","изменение по временам"],a:1,e:"Склонение — изменение существительного по падежам и числам."},
 {t:"К 1 склонению относятся…",o:["м.р. и ж.р. с окончаниями -а/-я","м.р. с нулевым окончанием и ср.р.","ж.р. с ь на конце","только слова на -ия"],a:0,e:"1 склонение: м.р. и ж.р. на -а/-я (папа, земля). Слово-подсказка — стена (рука)."},
 {t:"Ко 2 склонению относятся…",o:["ж.р. на ь","м.р. с нулевым окончанием и ср.р. на -о/-е","м.р. и ж.р. на -а/-я","разносклоняемые на -мя"],a:1,e:"2 склонение: м.р. с нулевым окончанием и ср.р. на -о/-е. Слова-подсказки — конь, окно."},
 {t:"К 3 склонению относятся…",o:["ж.р. с ь на конце","ср.р. на -е","м.р. на -й","слова на -ий"],a:0,e:"3 склонение: ж.р. с мягким знаком (степь, любовь). Слово-подсказка — степь."},
 {t:"Какое слово-подсказку берут для проверки окончаний 3 склонения?",o:["стена","окно","степь","земля"],a:2,e:"Для 3 склонения — степь (любовь): в степи → в тетради."},
 {t:"Сколько разносклоняемых существительных на -МЯ?",o:["7","10","12","5"],a:1,e:"Их десять: бремя, стремя, время, племя, пламя, семя, темя, вымя, знамя, имя. К ним примыкают путь и дитя."},
 {t:"Какое слово НЕ входит в группу разносклоняемых?",o:["стремя","племя","солома","темя"],a:2,e:"Солома — обычное слово 1 склонения, а не разносклоняемое на -мя."},
 {t:"В предложении «Серафим вышел погулять» существительное Серафим — это…",o:["подлежащее","сказуемое","дополнение","обстоятельство"],a:0,e:"Серафим отвечает на вопрос кто? и называет того, кто действует, — подлежащее."},
 {t:"В предложении «Лучший ученик — это Серафим» слово Серафим — это…",o:["подлежащее","сказуемое","определение","дополнение"],a:1,e:"Здесь существительное входит в состав сказуемого: ученик (какой он?) — это Серафим."},
 {t:"В предложении «Друг Серафима пришёл на урок» слово Серафима — это…",o:["определение","дополнение","обстоятельство","подлежащее"],a:1,e:"Друг (кого?) Серафима — вопрос косвенного падежа, значит дополнение."},
 {t:"В предложении «Мы отправились в Космолэнд» слово Космолэнд — это…",o:["дополнение","обстоятельство","определение","сказуемое"],a:1,e:"Отправились (куда?) в Космолэнд — обстоятельство места."},
 {t:"Какую синтаксическую роль существительное выполнять НЕ может?",o:["подлежащее","определение","сказуемое","ни одну из перечисленных ролей исключить нельзя"],a:3,e:"Существительное способно быть любым членом предложения: подлежащим, сказуемым, определением, дополнением и обстоятельством."},
 {t:"Что ставят первым пунктом морфологического разбора существительного?",o:["падеж","начальную форму","склонение","синтаксическую роль"],a:1,e:"Сначала начальная форма (И.п., ед.ч.), затем постоянные и непостоянные признаки, потом роль в предложении."},
 {t:"Начальная форма существительного — это…",o:["И.п. ед.ч.","Р.п. ед.ч.","И.п. мн.ч.","В.п. ед.ч."],a:0,e:"Начальная форма — именительный падеж единственного числа: видел Соню → Соня."},
 {t:"Разбор «Сегодня я видел Соню в кино»: Соню — какие непостоянные признаки?",o:["И.п., ед.ч.","В.п., ед.ч.","Р.п., мн.ч.","Т.п., ед.ч."],a:1,e:"Видел (кого?) Соню — винительный падеж, единственное число."},
 {t:"Разбор «Сегодня мне подарили красивый обруч»: обруч — постоянные признаки?",o:["ж.р., 1 скл., одуш., собств.","м.р., 2 скл., неодуш., нариц.","м.р., 3 скл., неодуш., нариц.","ср.р., 2 скл., неодуш., нариц."],a:1,e:"Обруч — мужской род, 2 склонение, неодушевлённое, нарицательное."},
 {t:"Как проверить одушевлённость существительного?",o:["по вопросу кто? / что?","по роду","по числу","по ударению"],a:0,e:"Одушевлённые отвечают на вопрос кто?, неодушевлённые — что?."}
]},

{id:"th-verb",name:"Теория: глагол",tag:"THEORY",
 desc:"Постоянные и непостоянные признаки глагола: вид, возвратность, переходность, спряжение, наклонение, время.",
 q:[
 {t:"Выбери полный набор постоянных признаков глагола.",o:["время, лицо, число, род","вид, возвратность, переходность, спряжение","наклонение, вид, время, число","спряжение, падеж, род"],a:1,e:"Постоянные признаки глагола: вид, возвратность, переходность, спряжение."},
 {t:"Какой признак глагола является непостоянным?",o:["вид","переходность","наклонение","спряжение"],a:2,e:"Наклонение непостоянно; вид, переходность и спряжение у глагола не меняются."},
 {t:"Глагол отвечает на вопрос «что сделать?». Какой у него вид?",o:["совершенный","несовершенный","вид определить нельзя","двувидовой"],a:0,e:"Вопрос с приставкой С- (что Сделать?) — совершенный вид."},
 {t:"Глагол «рисовать» отвечает на вопрос «что делать?». Вид…",o:["совершенный","несовершенный","переходный","возвратный"],a:1,e:"Что делать? — несовершенный вид (действие без указания на завершённость)."},
 {t:"Как определить возвратность глагола?",o:["по наличию -СЯ/-СЬ","по вопросу В.п.","по окончанию -ить","по наличию приставки"],a:0,e:"Возвратный глагол имеет постфикс -СЯ/-СЬ: умываться, вернулся."},
 {t:"Переходный глагол — это глагол, от которого можно задать вопрос…",o:["Р.п. без предлога","В.п. без предлога (кого? что?)","Т.п. с предлогом","Д.п. без предлога"],a:1,e:"Переходность проверяется вопросом винительного падежа БЕЗ предлога: читать (что?) книгу."},
 {t:"Какой глагол переходный?",o:["идти по дороге","встретить друга","думать о лете","гулять в парке"],a:1,e:"Встретить (кого?) друга — В.п. без предлога, значит глагол переходный."},
 {t:"Возвратные глаголы (с -СЯ)…",o:["всегда переходные","всегда непереходные","бывают и такими, и такими","переходность у них не определяется"],a:1,e:"Постфикс -СЯ «забирает» дополнение, поэтому возвратные глаголы непереходны: умываться нельзя «кого-что»."},
 {t:"Сколько наклонений у глагола?",o:["два","три","четыре","одно"],a:1,e:"Три: изъявительное, условное (сослагательное) и повелительное."},
 {t:"«Пришёл бы ты пораньше» — наклонение…",o:["изъявительное","условное","повелительное","неопределённое"],a:1,e:"Частица БЫ — признак условного наклонения."},
 {t:"«Открой окно» — наклонение…",o:["повелительное","изъявительное","условное","начальная форма"],a:0,e:"Побуждение к действию — повелительное наклонение."},
 {t:"В каком времени у глагола определяется РОД?",o:["в настоящем","в будущем","в прошедшем","род не определяется никогда"],a:2,e:"Род есть только у глаголов прошедшего времени: он пришёл — она пришла."},

 {t:"Сколько времён у глагола?",o:["два","три","четыре","время зависит от вида"],a:1,e:"Прошедшее, настоящее и будущее. У глаголов совершенного вида настоящего времени нет."},
 {t:"К какому спряжению относятся глаголы на -ИТЬ (кроме исключений)?",o:["к 1","ко 2","к разноспрягаемым","спряжение по ударению"],a:1,e:"Все глаголы на -ИТЬ — 2 спряжение, кроме брить, стелить, зиждиться, зыбиться."},

]},

{id:"th-adj",name:"Теория: прилагательное",tag:"THEORY",
 desc:"Признаки прилагательного, разряды и способ проверки окончаний вопросом от главного слова.",
 q:[
 {t:"Как проверяется безударное окончание прилагательного?",o:["вопросом от главного слова","по словарю","по ударению в корне","по числу слогов"],a:0,e:"Окончания прилагательных, причастий, числительных и некоторых местоимений проверяются вопросом от главного слова: озера (какого?) красного."},
 {t:"Окончания каких ещё частей речи проверяются вопросом от главного слова?",o:["только прилагательных","причастий, числительных и некоторых местоимений","глаголов и наречий","существительных"],a:1,e:"Тот же способ работает для причастий (белеющего), числительных (первого) и местоимений (моего)."},
 {t:"Какая пара букв «дружит между собой» в окончаниях?",o:["О и Е","О и А","Е и И","А и У"],a:0,e:"Дружат пары О–Е, А–Я, У–Ю, Ы–И: вопрос какОй? → окончание -ый/-ой, какЕй нет, но синЕе ↔ какОе."},
 {t:"«Рубашка (какая?) син…я» — какое окончание?",o:["-яя","-ая","-ея","-ия"],a:0,e:"Вопрос какАя? даёт мягкую пару -ЯЯ: синяя рубашка."},
 {t:"«Небо (какое?) син…е» — какое окончание?",o:["-ое","-ее","-ие","-ые"],a:1,e:"Пара О–Е: вопрос какОе? → окончание -ЕЕ у мягкого прилагательного: синее."},
 {t:"«Фигурой (какой?) син…» — ж.р., Т.п.",o:["-ей","-ий","-ой","-ею"],a:0,e:"Вопрос какОй? → пара О–Е даёт -ЕЙ: синей фигурой."},
 {t:"Какие признаки у прилагательного непостоянные?",o:["род, число, падеж","разряд","степень сравнения только","вид и время"],a:0,e:"Прилагательное изменяется по родам, числам и падежам, согласуясь с существительным."},
 {t:"Какой разряд прилагательных обозначает признак по принадлежности?",o:["качественные","относительные","притяжательные","все три"],a:2,e:"Притяжательные отвечают на вопрос чей? — мамин, лисий, отцов."},
 {t:"К какому разряду относится прилагательное «серебряный» (ложка)?",o:["качественное","относительное","притяжательное","краткое"],a:1,e:"Признак по материалу — относительное прилагательное, у него нет степеней сравнения."},
 {t:"Какое прилагательное качественное?",o:["зимний","мамин","умный","деревянный"],a:2,e:"Качественное обозначает признак, который может проявляться в большей или меньшей степени: умный — умнее."},
 {t:"Краткие прилагательные с НЕ пишутся…",o:["всегда раздельно","как полные","всегда слитно","через дефис"],a:1,e:"Краткое пишется по правилу полного: невысокий → невысок."},
 {t:"«Красного (какого?) озера» — что здесь главное слово?",o:["красного","озера","какого","главного слова нет"],a:1,e:"Главное слово — существительное озера, от него и задаётся вопрос к прилагательному."},
 {t:"Прилагательное «моего кабинета» проверяется вопросом…",o:["какого?","чьего?","чей?","которого?"],a:1,e:"Моего — притяжательное местоимение, вопрос чьего?, окончание совпадает с окончанием вопроса."},
 {t:"Причастие «белеющего рассвета» проверяется…",o:["по спряжению глагола","вопросом какого? от слова рассвета","по суффиксу","по ударению"],a:1,e:"Окончание причастия проверяется так же, как у прилагательного: рассвета (какого?) белеющего."},
 {t:"«Первого класса» — какая это часть речи и как проверяем?",o:["числительное, вопросом какого?","прилагательное, по словарю","существительное, по склонению","наречие, не изменяется"],a:0,e:"Порядковое числительное склоняется как прилагательное и проверяется вопросом какого?."}
]},

DATA.forEach(s=>S[s.id]={order:null,pos:0,ok:0,ans:0,locked:false});

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function initSec(id){
  const n=DATA.find(s=>s.id===id).q.length;
  S[id]={order:shuffle([...Array(n).keys()]),pos:0,ok:0,ans:0,locked:false};
}

/* --- звук --- */
let ac=null;
function beep(type){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    if(type==='ok'){o.type='square';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1450,t+.09)}
    else if(type==='no'){o.type='sawtooth';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.22)}
    else{o.type='triangle';o.frequency.setValueAtTime(320,t)}
    g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0008,t+.26);
    o.start(t);o.stop(t+.28);
  }catch(e){}
}
function feed(txt,bad){
  const d=document.createElement('div');
  if(bad)d.className='no';
  d.textContent=txt;
  $('feed').appendChild(d);
  setTimeout(()=>d.remove(),3500);
}

/* --- отрисовка --- */
function renderMissions(){
  const box=$('missions');box.innerHTML='';
  DATA.forEach(s=>{
    const st=S[s.id],tot=s.q.length,p=Math.round(st.ok/tot*100);
    const b=document.createElement('button');
    b.className='mission'+(s.id===cur?' active':'')+(p===100?' cleared':'');
    b.innerHTML=`<div class="m-top"><span>${s.name}</span><span class="pct">${p}%</span></div>
      <div class="tag">${s.tag} · ${tot} целей</div>
      <div class="mini"><i style="width:${p}%"></i></div>`;
    b.onclick=()=>{
      if(cur===s.id)return;
      cur=s.id;if(!S[s.id].order)initSec(s.id);beep('c');render();
      if(window.innerWidth<=900)document.querySelector('.arena').scrollIntoView({block:'start',behavior:'smooth'});
    };
    box.appendChild(b);
  });
}

function renderHud(){
  let tot=0,ok=0,ans=0;
  DATA.forEach(s=>{tot+=s.q.length;ok+=S[s.id].ok;ans+=S[s.id].ans});
  const p=Math.round(ok/tot*100);
  $('hpBar').style.width=p+'%';
  $('hpTxt').textContent=p+'% ('+ok+'/'+tot+')';
  $('totalHit').textContent=ans;
  $('money').textContent=money;
}

function render(){
  const sec=DATA.find(s=>s.id===cur),st=S[cur];
  if(!st.order)initSec(cur);
  $('mTitle').textContent=sec.name;
  $('mDesc').textContent=sec.desc;
  const tot=sec.q.length;
  $('mAcc').textContent=(st.ans?Math.round(st.ok/st.ans*100):0)+'%';
  $('mProg').textContent=Math.round(st.ok/tot*100)+'%';
  $('mTot').textContent=tot;
  $('ammo').textContent=Math.min(st.pos+1,tot)+'/'+tot;
  $('streak').textContent=streak>=3?('СЕРИЯ ×'+streak+(streak>=5?' — ЧИСТАЯ ЗАЧИСТКА':'')):'';
  renderMissions();renderHud();

  const stage=$('stage');stage.innerHTML='';
  if(st.pos>=tot){renderResult(sec,st);return;}

  const q=sec.q[st.order[st.pos]];
  const isWord=q.o.every(o=>o.length<=4);

  const ch=document.createElement('div');ch.className='crosshair';stage.appendChild(ch);

  const hint=document.createElement('div');
  hint.className='hintq';
  hint.textContent=isWord?'вставь пропущенную букву':'выбери верный вариант';
  stage.appendChild(hint);

  const target=document.createElement('div');
  target.className='target'+(q.t.length>26?' small':'');
  if(q.t.includes('…')){
    const [a,b]=q.t.split('…');
    target.innerHTML=esc(a)+'<span class="blank" id="blank">?</span>'+esc(b);
  }else target.textContent=q.t;
  stage.appendChild(target);

  const opts=document.createElement('div');opts.className='opts';
  q.o.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(isWord?'':' wide');
    b.textContent=o;
    b.onclick=()=>answer(i,q,opts,isWord);
    opts.appendChild(b);
  });
  stage.appendChild(opts);

  const v=document.createElement('div');v.className='verdict';v.id='verdict';stage.appendChild(v);

  const next=document.createElement('button');
  next.className='btn';next.id='nextBtn';next.textContent='СЛЕДУЮЩАЯ ЦЕЛЬ';
  next.style.display='none';next.style.marginTop='18px';
  next.onclick=()=>{st.pos++;st.locked=false;render()};
  stage.appendChild(next);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function answer(i,q,optsBox,isWord){
  const st=S[cur];
  if(st.locked)return;
  st.locked=true;st.ans++;
  const right=i===q.a;
  if(right){st.ok++;streak++;money+=streak>=3?150:100;beep('ok');feed((streak>=3?'MULTI-KILL ×'+streak:'HEADSHOT')+' +$'+(streak>=3?150:100));}
  else{streak=0;beep('no');feed('MISSED — цель ушла',true);}

  [...optsBox.children].forEach((b,k)=>{
    b.disabled=true;
    if(k===q.a)b.classList.add('right');
    else if(k===i)b.classList.add('wrong');
  });
  const bl=$('blank');
  if(bl){bl.textContent=q.o[q.a];bl.className='blank '+(right?'filled':'bad')}

  const v=$('verdict');
  v.className='verdict show '+(right?'ok':'no');
  v.innerHTML=`<div class="head">${right?'ЦЕЛЬ ПОРАЖЕНА':'ПРОМАХ'}</div>
    <p>${right?'':'<span class="fix">Верно: '+esc(q.o[q.a])+'.</span> '}${esc(q.e)}</p>`;
  $('nextBtn').style.display='inline-block';
  if(matchMedia('(hover:hover)').matches)$('nextBtn').focus();
  else v.scrollIntoView({block:'nearest',behavior:'smooth'});
  renderMissions();renderHud();
  $('mAcc').textContent=Math.round(st.ok/st.ans*100)+'%';
  $('mProg').textContent=Math.round(st.ok/DATA.find(s=>s.id===cur).q.length*100)+'%';
  $('streak').textContent=streak>=3?('СЕРИЯ ×'+streak+(streak>=5?' — ЧИСТАЯ ЗАЧИСТКА':'')):'';
}

function renderResult(sec,st){
  const tot=sec.q.length,acc=Math.round(st.ok/tot*100);
  const rank=acc>=95?'GLOBAL ELITE':acc>=85?'SUPREME':acc>=70?'LEGENDARY EAGLE':acc>=55?'GOLD NOVA':acc>=35?'SILVER ELITE':'SILVER I';
  const d=document.createElement('div');d.className='result';
  d.innerHTML=`<div class="rank">${rank}</div>
    <div class="score">РАУНД ЗАВЕРШЁН · ${st.ok} из ${tot} · точность ${acc}%</div>`;
  const t=document.createElement('table');
  DATA.forEach(s=>{
    const p=Math.round(S[s.id].ok/s.q.length*100);
    t.innerHTML+=`<tr><td>${s.name}</td><td>${p}%</td></tr>`;
  });
  d.appendChild(t);
  const b=document.createElement('button');
  b.className='btn';b.textContent='ПЕРЕИГРАТЬ РАЗДЕЛ (новые слова)';
  b.onclick=()=>{initSec(cur);streak=0;render()};
  d.appendChild(b);
  $('stage').appendChild(d);
}

/* --- кнопки --- */
$('retryBtn').onclick=()=>{initSec(cur);streak=0;beep('c');render()};
$('wipeBtn').onclick=()=>{
  if(!confirm('Сбросить всю статистику и перемешать все разделы?'))return;
  DATA.forEach(s=>S[s.id]={order:null,pos:0,ok:0,ans:0,locked:false});
  money=0;streak=0;initSec(cur);render();
};
$('muteBtn').onclick=()=>{sound=!sound;$('muteBtn').textContent='ЗВУК: '+(sound?'ON':'OFF');$('muteBtn').classList.toggle('off',!sound)};
document.addEventListener('keydown',e=>{
  const st=S[cur];
  if(e.key==='Enter'||e.key===' '){const n=$('nextBtn');if(n&&n.style.display!=='none'){e.preventDefault();n.click()}return}
  if(/^[1-4]$/.test(e.key)&&!st.locked){const o=document.querySelectorAll('.opt')[+e.key-1];if(o)o.click()}
});

initSec(cur);render();
</script>
</body>
</html>
