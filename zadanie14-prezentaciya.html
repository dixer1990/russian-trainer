<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задание 14. Слитное, раздельное и дефисное написание слов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0c0906; --bg2:#150f08; --bg3:#1e150b;
    --panel:rgba(216,164,74,.055);
    --panel-solid:#150f09;
    --line:rgba(216,164,74,.24);
    --text:#F3E7D3;
    --text-dim:#C3AC8B;
    --brass:#D8A44A;
    --brass-soft:#E7C176;
    --copper:#C07A3E;
    --patina:#5FBFA8;
    --green:#5FBFA8; --green-soft:rgba(95,191,168,.13);
    --red:#E5715C; --red-soft:rgba(217,99,79,.13);
    --yellow:#E8C55F;
    --ink:#0c0906;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(ellipse 65% 45% at 15% 0%, rgba(216,164,74,.10) 0%, transparent 58%),
      radial-gradient(ellipse 55% 45% at 88% 6%, rgba(192,122,62,.10) 0%, transparent 60%),
      radial-gradient(ellipse 90% 55% at 50% 108%, rgba(60,38,14,.45) 0%, transparent 68%),
      linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    color:var(--text);
    font-family:'PT Sans',sans-serif;
    display:flex;flex-direction:column;
    height:100dvh;
    overflow:hidden;
    position:relative;
  }

  /* ===== ФОН МАСТЕРСКОЙ ===== */
  .gears{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.5;}
  .gears svg{position:absolute;}
  .gear-spin{transform-origin:50% 50%;animation:spin 46s linear infinite;}
  .gear-spin.rev{animation-direction:reverse;animation-duration:32s;}
  .gear-spin.slow{animation-duration:78s;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .g1{top:-70px;left:-70px;width:260px;height:260px;}
  .g2{top:34%;right:-90px;width:230px;height:230px;}
  .g3{bottom:-90px;left:12%;width:280px;height:280px;}

  .dust{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .dust i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--brass-soft);
    box-shadow:0 0 7px rgba(231,193,118,.7);opacity:0;animation:rise linear infinite;}
  @keyframes rise{
    0%{transform:translate(0,0);opacity:0;}
    10%{opacity:.7;}
    55%{transform:translate(12px,-50vh);opacity:.35;}
    100%{transform:translate(-10px,-102vh);opacity:0;}
  }
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);}

  /* ===== ШАПКА / ПРОГРЕСС ===== */
  .progressbar{height:7px;background:rgba(255,255,255,.05);flex-shrink:0;position:relative;z-index:2;
    border-bottom:1px solid rgba(216,164,74,.18);}
  .progressbar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--copper),var(--brass),var(--brass-soft));
    transition:width .4s ease;box-shadow:0 1px 8px rgba(216,164,74,.45);}

  .slide-viewport{flex:1;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;
    padding:34px 22px 26px;position:relative;z-index:1;-webkit-overflow-scrolling:touch;}
  .slide{width:100%;max-width:900px;padding-bottom:8px;animation:slideIn .4s cubic-bezier(.22,1,.36,1);}
  @keyframes slideIn{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:translateY(0);}}

  .eyebrow{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);
    margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"⚙";font-size:14px;color:var(--copper);}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:31px;margin:0 0 10px;line-height:1.22;}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:21px;margin:0 0 6px;}
  .subtitle{color:var(--text-dim);font-size:15px;max-width:700px;line-height:1.62;}

  /* ===== ТИТУЛ ===== */
  .title-slide{min-height:60dvh;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center;}
  .title-slide h1{font-size:38px;}
  .title-slide h1 .accent{color:var(--brass);}
  .pendulum{width:150px;height:170px;margin-bottom:6px;}
  .pend-arm{transform-origin:75px 12px;animation:tick 2.4s cubic-bezier(.45,.05,.55,.95) infinite alternate;}
  @keyframes tick{from{transform:rotate(-15deg);}to{transform:rotate(15deg);}}
  .plate{border:1px solid var(--line);border-radius:3px;padding:16px 22px;margin-top:20px;
    background:linear-gradient(160deg, rgba(216,164,74,.09), rgba(216,164,74,.02));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 26px rgba(0,0,0,.5);max-width:620px;}
  .plate .rivets{display:flex;justify-content:space-between;margin-bottom:10px;}
  .plate .rivets span{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #E7C176, #7a5a22);}

  /* ===== КАРТА ЗАДАНИЯ ===== */
  .map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:18px;}
  .map-card{border:1px solid var(--line);border-radius:3px;padding:12px 14px;background:var(--panel);
    display:flex;gap:11px;align-items:flex-start;}
  .map-card b{font-family:'Playfair Display',serif;color:var(--brass);font-size:17px;min-width:24px;}
  .map-card span{font-size:14.2px;line-height:1.5;color:var(--text-dim);}
  .map-card span i{color:var(--text);font-style:normal;font-weight:700;}

  /* ===== ПРАВИЛА ===== */
  .rule-block{background:linear-gradient(160deg, rgba(216,164,74,.075), rgba(216,164,74,.015));
    border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:3px;
    padding:15px 19px;margin-bottom:13px;box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);}
  .rule-block h3{font-family:'Playfair Display',serif;font-weight:600;font-size:16.5px;margin:0 0 6px;color:var(--brass-soft);}
  .rule-block p{margin:6px 0;line-height:1.62;font-size:14.5px;}
  .rule-block b{color:#fff;}
  .rule-block .ex{color:var(--brass-soft);font-family:'PT Mono',monospace;font-size:13.8px;line-height:1.8;display:block;margin-top:7px;}
  .algo-steps{list-style:none;counter-reset:algo;margin:2px 0 0;padding:0;}
  .algo-steps li{counter-increment:algo;position:relative;padding:10px 4px 10px 44px;line-height:1.55;font-size:14.4px;
    border-bottom:1px solid rgba(255,255,255,.06);}
  .algo-steps li:last-child{border-bottom:none;}
  .algo-steps li::before{content:counter(algo);position:absolute;left:4px;top:8px;width:27px;height:27px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(216,164,74,.15);border:1.5px solid var(--brass);color:var(--brass-soft);
    font-family:'Playfair Display',serif;font-weight:700;font-size:14px;}
  .trap-box{background:rgba(217,99,79,.07);border:1px dashed rgba(217,99,79,.5);border-radius:3px;
    padding:13px 17px;margin-top:14px;font-size:13.8px;color:var(--text-dim);line-height:1.62;}
  .trap-box b{color:var(--red);}
  .trap-box::before{content:"⚠ ЛОВУШКА";display:block;font-size:10.5px;letter-spacing:.16em;color:var(--red);
    font-weight:700;margin-bottom:6px;}
  .memo-box{background:rgba(216,164,74,.09);border:1px solid rgba(216,164,74,.5);border-radius:3px;
    padding:14px 18px;margin-top:14px;font-size:14.4px;line-height:1.65;}
  .memo-box b{color:var(--brass-soft);}
  .memo-box::before{content:"⚙ ЗАПОМНИТЬ";display:block;font-size:10.5px;letter-spacing:.16em;color:var(--brass);
    font-weight:700;margin-bottom:6px;}
  .note-box{background:rgba(95,191,168,.07);border:1px solid rgba(95,191,168,.4);border-radius:3px;
    padding:13px 17px;margin-top:14px;font-size:13.6px;color:var(--text-dim);line-height:1.62;}
  .note-box b{color:var(--patina);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .col-list{font-family:'PT Mono',monospace;font-size:12.8px;line-height:1.85;color:var(--text);}
  .col-list .h{display:block;font-family:'PT Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brass);margin-bottom:5px;}

  /* ===== СЛОВА ===== */
  .mono{font-family:'PT Mono',monospace;}
  .brk{color:var(--brass-soft);background:rgba(216,164,74,.16);border-bottom:1px solid var(--brass);
    padding:0 2px;border-radius:2px;font-weight:700;}
  .paren{color:var(--text-dim);}

  /* ===== ПРАКТИКА ===== */
  .practice-instruction{color:var(--text-dim);font-size:14.2px;margin:0 0 15px;line-height:1.55;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:10px;margin-bottom:15px;}
  .word-card{background:linear-gradient(160deg, rgba(216,164,74,.06), rgba(216,164,74,.012));
    border:1px solid var(--line);border-radius:3px;padding:10px 12px;
    box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);}
  .word-card .word-text{font-family:'PT Mono',monospace;font-size:14.8px;margin-bottom:9px;line-height:1.5;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--text-dim);background:transparent;color:var(--text);border-radius:2px;
    padding:0 11px;min-height:40px;font-size:13.5px;cursor:pointer;font-family:'PT Sans',sans-serif;font-weight:700;white-space:nowrap;}
  .chip:hover{border-color:var(--brass);color:var(--brass-soft);}
  .chip.selected{background:var(--brass);color:var(--ink);border-color:var(--brass);}
  .chip.selected.anim{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.12);}100%{transform:scale(1);}}
  .word-card.correct{border-color:var(--green);background:var(--green-soft);}
  .word-card.wrong{border-color:var(--red);background:var(--red-soft);}
  .word-card.unans{border-color:var(--yellow);background:rgba(232,197,95,.08);}
  .word-card.locked .chip{cursor:default;opacity:.5;}
  .word-card.locked .chip.selected{opacity:1;}
  .verdict{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;display:none;}
  .word-card.correct .verdict{display:block;color:var(--green);}
  .word-card.wrong .verdict{display:block;color:var(--red);}
  .word-card.unans .verdict{display:block;color:var(--yellow);}
  .why{font-size:13.4px;color:var(--text-dim);margin-top:8px;line-height:1.55;display:none;
    border-top:1px solid rgba(255,255,255,.08);padding-top:7px;}
  .why b{color:var(--brass-soft);font-family:'PT Mono',monospace;}
  .word-card.revealed .why{display:block;}

  .practice-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .btn{font-family:'PT Sans',sans-serif;font-weight:700;border:1px solid transparent;border-radius:2px;
    padding:0 22px;min-height:44px;cursor:pointer;font-size:14px;}
  .btn-primary{background:linear-gradient(180deg,#F0CE88,var(--brass));color:var(--ink);
    box-shadow:0 3px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--brass);color:var(--brass-soft);}
  .btn:disabled{opacity:.35;cursor:default;filter:none;}
  .practice-result{font-family:'Playfair Display',serif;font-weight:600;font-size:15.5px;}
  .practice-result .ok{color:var(--green);} .practice-result .no{color:var(--red);} .practice-result .un{color:var(--yellow);}
  .hint-line{font-size:13.4px;color:var(--text-dim);margin-top:9px;line-height:1.5;}

  /* ===== СОРТИРОВКА ===== */
  .sort-pool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;padding:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:3px;min-height:52px;}
  .sort-chip{border:1px solid var(--brass);background:rgba(216,164,74,.08);color:var(--text);
    border-radius:2px;padding:0 13px;min-height:38px;font-size:13.8px;cursor:pointer;
    font-family:'PT Mono',monospace;display:inline-flex;align-items:center;}
  .sort-chip.selecting{background:var(--brass);color:var(--ink);}
  .sort-chip.correct{border-color:var(--green);background:var(--green-soft);}
  .sort-chip.wrong{border-color:var(--red);background:var(--red-soft);}
  .sort-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
  .sort-bucket{background:rgba(255,255,255,.02);border:1px dashed var(--line);border-radius:3px;
    padding:10px;min-height:96px;cursor:pointer;}
  .sort-bucket:hover{border-color:var(--brass);}
  .sort-bucket-title{font-weight:700;color:var(--brass-soft);font-size:12.5px;margin-bottom:8px;text-align:center;
    text-transform:uppercase;letter-spacing:.12em;}
  .sort-bucket .row{display:flex;flex-wrap:wrap;gap:6px;}

  /* ===== ФЛЕШ-КАРТЫ ===== */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;gap:15px;}
  .flash-card{width:100%;max-width:430px;height:200px;perspective:1000px;cursor:pointer;}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .flash-inner.flipped{transform:rotateY(180deg);}
  .flash-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:3px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;flex-direction:column;gap:9px;
    border:1px solid var(--line);}
  .flash-front{background:var(--panel);font-family:'PT Mono',monospace;font-size:21px;}
  .flash-front .hint{font-size:12.5px;color:var(--text-dim);font-family:'PT Sans',sans-serif;}
  .flash-back{background:rgba(216,164,74,.1);transform:rotateY(180deg);}
  .flash-back .ans{font-family:'PT Mono',monospace;font-size:22px;color:var(--brass-soft);}
  .flash-back .tag{font-size:13.2px;color:var(--text-dim);line-height:1.5;max-width:330px;}
  .flash-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;}
  .flash-counter{color:var(--text-dim);font-size:13px;min-width:64px;text-align:center;}

  /* ===== ВИКТОРИНА ===== */
  .quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px;max-width:640px;}
  .quiz-card .q-prompt{font-size:16px;margin:0 0 16px;line-height:1.5;}
  .quiz-options{display:flex;flex-direction:column;gap:9px;}
  .quiz-option{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:2px;
    padding:12px 15px;min-height:44px;font-size:14.2px;text-align:left;cursor:pointer;font-family:'PT Sans',sans-serif;line-height:1.5;}
  .quiz-option:hover{border-color:var(--brass);}
  .quiz-option.correct{border-color:var(--green);background:var(--green-soft);}
  .quiz-option.wrong{border-color:var(--red);background:var(--red-soft);}
  .quiz-option:disabled{cursor:default;}
  .quiz-progress{color:var(--text-dim);font-size:13px;margin-bottom:10px;font-weight:700;letter-spacing:.05em;}

  /* ===== ЕГЭ ===== */
  .ege-ask{border:1px solid var(--brass);background:rgba(216,164,74,.1);border-radius:3px;padding:12px 16px;
    font-size:14.4px;line-height:1.55;margin-bottom:14px;}
  .ege-ask b{color:var(--brass-soft);text-transform:uppercase;letter-spacing:.06em;}
  .ege-row{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:12px 14px;margin-bottom:9px;}
  .ege-row .sent{font-size:15px;line-height:1.65;margin-bottom:10px;}
  .ege-row .sent .mono{font-size:14.4px;}
  .ege-num{font-family:'Playfair Display',serif;color:var(--brass);font-weight:700;margin-right:7px;}
  .ege-words{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:9px;}
  .ege-word{border:1px solid rgba(255,255,255,.09);border-radius:2px;padding:8px 10px;}
  .ege-word .w{font-family:'PT Mono',monospace;font-size:14.2px;margin-bottom:7px;}
  .ege-verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.4px;color:var(--text-dim);}
  .ege-row.correct{border-color:var(--green);background:var(--green-soft);}
  .ege-row.wrong{border-color:var(--red);background:var(--red-soft);}
  .ege-row.unans{border-color:var(--yellow);background:rgba(232,197,95,.07);}
  .ege-answer{margin-top:10px;font-size:13.4px;color:var(--text-dim);line-height:1.55;display:none;
    border-top:1px solid rgba(255,255,255,.08);padding-top:8px;}
  .ege-row.revealed .ege-answer{display:block;}
  .ege-answer b{color:var(--brass-soft);font-family:'PT Mono',monospace;}

  /* ===== ИТОГ ===== */
  .gauges{display:flex;gap:26px;flex-wrap:wrap;margin:20px 0;justify-content:flex-start;}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .gauge svg{width:148px;height:148px;}
  .gauge .gauge-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700;}
  .topic-list{margin-top:6px;display:grid;gap:7px;}
  .topic{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:3px;
    padding:10px 13px;background:var(--panel);cursor:pointer;text-align:left;color:var(--text);
    font-family:'PT Sans',sans-serif;font-size:14px;width:100%;}
  .topic:hover{border-color:var(--brass);}
  .topic .bar{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
  .topic .bar i{display:block;height:100%;}
  .topic .pct{font-family:'PT Mono',monospace;font-size:13px;min-width:44px;text-align:right;}
  .topic .name{min-width:150px;}
  .topic .goto{font-size:12px;color:var(--brass);white-space:nowrap;}
  .final-box{border:1px solid var(--line);border-left:3px solid var(--brass);background:var(--panel);
    border-radius:3px;padding:16px 20px;margin-top:18px;}
  .final-box h3{font-family:'Playfair Display',serif;margin:0 0 10px;color:var(--brass-soft);font-size:17px;}
  .copy-area{width:100%;height:140px;margin-top:10px;background:#0a0705;color:var(--text-dim);
    border:1px solid var(--line);border-radius:2px;font-family:'PT Mono',monospace;font-size:12.5px;padding:10px;display:none;}

  /* ===== НАВИГАЦИЯ ===== */
  .navbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 18px;border-top:1px solid var(--line);background:var(--panel-solid);position:relative;z-index:2;}
  .navbar button{font-family:'PT Sans',sans-serif;font-weight:700;background:transparent;
    border:1px solid var(--line);color:var(--text);border-radius:2px;padding:0 18px;min-height:44px;cursor:pointer;font-size:13.5px;}
  .navbar button:hover:not(:disabled){border-color:var(--brass);color:var(--brass-soft);}
  .navbar button:disabled{opacity:.3;cursor:default;}
  .nav-mid{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .slide-counter{color:var(--text-dim);font-size:13px;font-family:'PT Mono',monospace;}
  .toc-btn{background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--text-dim);
    font-family:'PT Mono',monospace;font-size:13px;padding:4px 12px;min-height:32px;cursor:pointer;}
  .toc-btn:hover{border-color:var(--brass);color:var(--brass-soft);}
  .toc-overlay{position:fixed;inset:0;z-index:30;background:rgba(6,4,2,.88);display:none;
    align-items:center;justify-content:center;padding:20px;}
  .toc-overlay.open{display:flex;}
  .toc-panel{background:var(--panel-solid);border:1px solid var(--line);border-radius:3px;
    width:min(760px,100%);max-height:86dvh;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);}
  .toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);}
  .toc-head h2{margin:0;font-size:19px;color:var(--brass-soft);}
  .toc-close{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:2px;

  .calm-btn{font-size:12px !important;padding:0 12px !important;min-height:34px !important;}
  .calm-btn.on{border-color:var(--patina);color:var(--patina);}

  /* ===== СПОКОЙНЫЙ РЕЖИМ ===== */

    .ege-words{grid-template-columns:1fr;}
    .navbar{padding:9px 12px;}
    .navbar button{padding:0 13px;font-size:13px;}
    .gauge svg{width:124px;height:124px;}
    .topic{flex-wrap:wrap;} .topic .name{min-width:100%;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.05s !important;}
    .dust{display:none;}
  }
</style>

<script>
/* ==========================================================================
   ЗАДАНИЕ 14 ЕГЭ. Слитное, раздельное, дефисное написание слов.
   Тренажёр-презентация. Один файл, без внешних зависимостей (кроме шрифтов).
   ========================================================================== */

var SL="слитно", DF="через дефис", RZ="раздельно";
var SRD=[SL,DF,RZ];
var ONE=["одно слово","два слова"];

/* ---------- БЛОК 1: одно слово или два ---------- */
var P_ONE=[
 {w:"Договорились (НА)СЧЁТ поездки",a:"одно слово",full:"насчёт поездки",why:"Здесь <b>насчёт</b> = предлог «о»: договорились <b>о поездке</b>. Предлог заменяется другим предлогом — значит, это одно слово."},
 {w:"Положить деньги (НА)СЧЁТ в банке",a:"два слова",full:"на счёт",why:"«Счёт» — существительное: можно вставить слово (<b>на</b> мой <b>счёт</b>) и задать вопрос «на что?». Предлог + существительное — два слова."},
 {w:"Идти (НА)ВСТРЕЧУ ветру",a:"одно слово",full:"навстречу ветру",why:"<b>Навстречу</b> — производный предлог при слове «ветру», заменяется на «к» (идти <b>к</b> ветру). Вставить слово нельзя."},
 {w:"Опоздать (НА)ВСТРЕЧУ с другом",a:"два слова",full:"на встречу",why:"«Встреча» — существительное: опоздать <b>на</b> важную <b>встречу</b>. Вставляется прилагательное — пишем раздельно."},
 {w:"(В)ВИДУ непогоды рейс отменили",a:"одно слово",full:"ввиду непогоды",why:"<b>Ввиду</b> = «из-за», причина. Это производный предлог, одно слово."},
 {w:"Иметь (В)ВИДУ сроки",a:"два слова",full:"в виду",why:"Устойчивое сочетание <b>иметь в виду</b> пишется в три слова — это исключение, которое надо просто запомнить."},
 {w:"(В)СЛЕДСТВИЕ ошибки прибор сломался",a:"одно слово",full:"вследствие ошибки",why:"<b>Вследствие</b> = «из-за»: предлог причины, одно слово. Кончается на Е."},
 {w:"(В)СЛЕДСТВИИ по делу нашли улику",a:"два слова",full:"в следствии",why:"«Следствие» здесь — существительное (расследование): <b>в</b> этом <b>следствии</b>. Предлог + существительное, на конце И."},
 {w:"Подняться (НА)ВЕРХ и осмотреться",a:"одно слово",full:"наверх",why:"Отвечает на вопрос «куда?» и не имеет при себе зависимого существительного — это наречие, одно слово."},
 {w:"Взобраться (НА)ВЕРХ повозки",a:"два слова",full:"на верх повозки",why:"Есть зависимое слово «повозки»: <b>верх</b> — существительное. Сравните: на <b>самый</b> верх повозки."},
 {w:"Готовил подарок (В)ТАЙНЕ от всех",a:"одно слово",full:"втайне",why:"Отвечает на вопрос «как?» — наречие <b>втайне</b> (= тайно, скрытно)."},
 {w:"Держать планы (В)ТАЙНЕ",a:"два слова",full:"в тайне",why:"Держать <b>в</b> строгой <b>тайне</b> — существительное с предлогом, слово вставляется."}
];

/* ---------- БЛОК 2: производные предлоги ---------- */
var P_PREP=[
 {w:"(В)ТЕЧЕНИЕ часа никто не пришёл",a:RZ,full:"в течение часа",why:"Предлог времени <b>в течение</b> всегда пишется раздельно, на конце Е. Проверка: «в течение» отвечает на вопрос «как долго?»."},
 {w:"(В)ТЕЧЕНИИ реки много порогов",a:RZ,full:"в течении реки",why:"Тоже раздельно, но это существительное «течение» с предлогом — и на конце И. Задание 14 проверяет только пробел, а Е/И спрашивают в других заданиях."},
 {w:"(В)СЛЕДСТВИЕ засухи река обмелела",a:SL,full:"вследствие засухи",why:"Предлог причины <b>вследствие</b> = «из-за», пишется слитно."},
 {w:"Сооружение (НА)ПОДОБИЕ зонта",a:SL,full:"наподобие зонта",why:"<b>Наподобие</b> = «вроде», производный предлог, слитно."},
 {w:"Язык (В)РОДЕ испанского",a:SL,full:"вроде испанского",why:"<b>Вроде</b> = «наподобие», предлог, слитно."},
 {w:"Он последний (В)РОДЕ Романовых",a:RZ,full:"в роде Романовых",why:"«Род» — существительное (<b>в</b> старинном <b>роде</b>), значит предлог с существительным, раздельно."},
 {w:"(ИЗ)ЗА туч показалось солнце",a:DF,full:"из-за",why:"Сложные предлоги <b>из-за, из-под, по-над, по-за</b> пишутся через дефис. Их всего четыре — просто запомнить."},
 {w:"(ИЗ)ПОД снега пробилась трава",a:DF,full:"из-под",why:"<b>Из-под</b> — сложный предлог, всегда через дефис."},
 {w:"(НЕ)СМОТРЯ на поломку, часы шли",a:SL,full:"несмотря на поломку",why:"Предлог уступки <b>несмотря на</b> = «хотя», пишется слитно (в два слова с «на»)."},
 {w:"Шёл, (НЕ)СМОТРЯ по сторонам",a:RZ,full:"не смотря по сторонам",why:"Здесь настоящее деепричастие: он действительно не смотрел глазами. НЕ с деепричастием — раздельно."},
 {w:"(В)МЕСТО ответа он пожал плечами",a:SL,full:"вместо ответа",why:"<b>Вместо</b> = «за», предлог, слитно. Сравните: попасть <b>в</b> нужное <b>место</b> — там существительное."},
 {w:"(В)ЗАКЛЮЧЕНИЕ доклада он пошутил",a:RZ,full:"в заключение доклада",why:"<b>В заключение</b> (= в конце) — раздельно, как и «в течение», «в продолжение», «в отличие»."}
];

/* ---------- БЛОК 3: союзы и омонимы ---------- */
var P_CONJ=[
 {w:"Он пришёл, ЧТО(БЫ) помочь",a:SL,full:"чтобы",why:"Союз цели: заменяется на «для того чтобы». БЫ отбросить нельзя — значит, слитно."},
 {w:"ЧТО(БЫ) мне почитать вечером?",a:RZ,full:"что бы",why:"Здесь местоимение «что» + частица «бы»: частицу можно убрать или переставить — «Что мне почитать?». Раздельно."},
 {w:"Я ТО(ЖЕ) люблю старые часы",a:SL,full:"тоже",why:"Союз <b>тоже</b> = «и»: «И я люблю старые часы». Слитно."},
 {w:"Он повторил ТО(ЖЕ) слово",a:RZ,full:"то же",why:"Местоимение «то» + частица «же»: подставляется «самое» — <b>то же самое</b> слово. Раздельно."},
 {w:"Мастер ТАК(ЖЕ) не спешил",a:SL,full:"также",why:"Союз <b>также</b> = «и»: «И мастер не спешил». Слитно."},
 {w:"Всё ТАК(ЖЕ) тихо, как вчера",a:RZ,full:"так же",why:"Наречие «так» + частица «же», рядом стоит «как» — конструкция «так же…, как». Раздельно."},
 {w:"Прибор стар, ЗА(ТО) надёжен",a:SL,full:"зато",why:"Союз <b>зато</b> = «но». Слитно."},
 {w:"Он спрятался ЗА(ТО) дерево",a:RZ,full:"за то дерево",why:"Предлог «за» + указательное местоимение «то»: за <b>то самое</b> дерево. Раздельно."},
 {w:"(ОТ)ЧЕГО ты сегодня молчишь?",a:SL,full:"отчего",why:"<b>Отчего</b> = «почему», наречие. Слитно."},
 {w:"Я тут ни (ПРИ)ЧЁМ",a:RZ,full:"ни при чём",why:"Предлог «при» + местоимение «чём»: <b>ни при чём</b> — три слова. Сравните с союзом «притом» (= к тому же), который пишется слитно."},
 {w:"Молчал, (ПО)ТОМУ что обижен",a:SL,full:"потому что",why:"Союз причины: «потому» пишется слитно, а «что» — отдельное слово. Проверка: заменяется на «так как»."},
 {w:"Скучаю (ПО)ТОМУ, что было",a:RZ,full:"по тому",why:"Предлог «по» + местоимение «тому»: скучаю по <b>тому самому</b>. Раздельно."}
];

/* ---------- БЛОК 4: частицы ---------- */
var P_PART=[
 {w:"Кто(ТО) оставил записку",a:DF,full:"кто-то",why:"Частицы <b>-то, -либо, -нибудь, -ка, кое-, -таки</b> пишутся через дефис."},
 {w:"Где(НИБУДЬ) здесь есть лавка",a:DF,full:"где-нибудь",why:"Частица <b>-нибудь</b> — через дефис."},
 {w:"КОЕ(КТО) уже ушёл",a:DF,full:"кое-кто",why:"Приставка-частица <b>кое-</b> пишется через дефис."},
 {w:"Я узнал об этом КОЕ(ОТ)КОГО",a:RZ,full:"кое от кого",why:"Если между «кое» и словом появился предлог, всё пишется раздельно, в три слова: <b>кое у кого, кое от кого, кое с кем</b>."},
 {w:"Принеси(КА) отвёртку",a:DF,full:"принеси-ка",why:"Частица <b>-ка</b> при глаголе — через дефис."},
 {w:"Он ВСЁ(ТАКИ) починил механизм",a:DF,full:"всё-таки",why:"<b>Всё-таки</b> и <b>так-таки</b> — через дефис. Также через дефис -таки после глаголов и наречий: пришёл-таки."},
 {w:"Мастер(БЫ) не согласился",a:RZ,full:"мастер бы",why:"Частицы <b>бы, ли, же</b> пишутся раздельно всегда. Их можно убрать или переставить."},
 {w:"Что(ЖЕ) ты молчишь?",a:RZ,full:"что же",why:"Частица <b>же</b> — раздельно."},
 {w:"Вряд(ЛИ) он успеет",a:RZ,full:"вряд ли",why:"Частица <b>ли</b> раздельно, даже в сращении «вряд ли»."},
 {w:"Он молчал, КАК(БУДТО) не слышал",a:RZ,full:"как будто",why:"<b>Как будто</b> — раздельно, в два слова. А вот сам союз <b>будто</b> пишется слитно (там нет частицы «то»)."},
 {w:"НЕУЖЕ(ЛИ) всё сломалось?",a:SL,full:"неужели",why:"<b>Неужели, даже, разве</b> — цельные частицы, пишутся слитно, хотя «ли» внутри слышится."},
 {w:"ДА(ЖЕ) не пытайся",a:SL,full:"даже",why:"<b>Даже</b> — цельная частица, слитно: «да» без «же» здесь не существует."}
];

/* ---------- БЛОК 5: наречия через дефис ---------- */
var P_ADV_DEF=[
 {w:"Сделай (ПО)НОВОМУ",a:DF,full:"по-новому",why:"Формула дефиса: приставка <b>ПО-</b> + окончание <b>-ОМУ/-ЕМУ/-И</b>. Отвечает на вопрос «как?»."},
 {w:"(ПО)ВЕСЕННЕМУ тепло на улице",a:DF,full:"по-весеннему",why:"ПО- + -ЕМУ, наречие, отвечает на вопрос «как?» (тепло как?)."},
 {w:"Мы шли (ПО)ЗИМНЕМУ парку",a:RZ,full:"по зимнему парку",why:"Это не наречие, а прилагательное с предлогом: шли <b>по</b> какому? <b>парку</b>. Вставляется слово: по <b>заснеженному</b> зимнему парку."},
 {w:"Пусть всё будет (ПО)ВАШЕМУ",a:DF,full:"по-вашему",why:"ПО- + -ЕМУ у наречия: будет <b>как?</b> по-вашему. Дефис."},
 {w:"(ВО)ПЕРВЫХ, проверьте пружину",a:DF,full:"во-первых",why:"Приставки <b>В-/ВО-</b> + суффикс <b>-ЫХ/-ИХ</b> дают дефис: во-первых, в-третьих."},
 {w:"(ВО)ВТОРЫХ классах шли уроки",a:RZ,full:"во вторых классах",why:"Здесь числительное с существительным: во вторых <b>классах</b>. Есть зависимое слово — раздельно."},
 {w:"Часы шли ЕЛЕ(ЕЛЕ)",a:DF,full:"еле-еле",why:"Наречия, образованные повтором слова, пишутся через дефис: еле-еле, чуть-чуть, давным-давно."},
 {w:"Деталь подошла ТОЧЬ(В)ТОЧЬ",a:DF,full:"точь-в-точь",why:"<b>Точь-в-точь</b> — дефисное наречие-повтор с предлогом внутри. Запомнить вместе с «крест-накрест», «бок о бок» (а вот последнее — раздельно!)."},
 {w:"Пришлось согласиться ВОЛЕЙ(НЕВОЛЕЙ)",a:DF,full:"волей-неволей",why:"Повтор синонимичных или созвучных слов — дефис: волей-неволей, худо-бедно, подобру-поздорову."},
 {w:"Надпись сделана (ПО)ЛАТЫНИ",a:DF,full:"по-латыни",why:"ПО- + -И: по-латыни, по-русски, по-французски."},
 {w:"Мы пойдём (ПО)ВАШЕМУ сценарию",a:RZ,full:"по вашему сценарию",why:"Формула ПО- + -ЕМУ здесь не работает: рядом существительное «сценарию», значит это местоимение с предлогом. Сравните: «будь <b>по-вашему</b>» — наречие, дефис."},
 {w:"Мы шли БОК(О)БОК",a:RZ,full:"бок о бок",why:"Главная ловушка блока: <b>бок о бок</b> пишется в три слова, хотя внешне похоже на «точь-в-точь». Так же раздельно — «с глазу на глаз», «честь по чести»."}
];

/* ---------- БЛОК 6: сортировка наречий ---------- */
var SORT_ADV={
 buckets:["Слитно","Раздельно"],
 items:[
  {t:"(во)время прийти",b:0,full:"вовремя",why:"Наречие <b>вовремя</b> (= своевременно) — слитно. Раздельно только «во время урока», где есть существительное."},
  {t:"(в)общем",b:1,full:"в общем",why:"<b>В общем</b> — всегда раздельно. Слова «вобщем» в русском языке нет."},
  {t:"(с)начала подумай",b:0,full:"сначала",why:"Наречие времени <b>сначала</b> — слитно. Раздельно: «с начала пути», где есть зависимое слово."},

 {type:"rule",section:"Наречия: слитно и раздельно",title:"Наречия слитно и раздельно",

   {h:"Правила, которые действительно работают",p:"Полного правила здесь нет — есть закономерности и список ФИПИ. Вот то, на что можно опереться:",ex:"1. Предлог + прилагательное на -УЮ → слитно: врассыпную, вслепую, вплотную, вручную.\n   Исключения: в открытую, на попятную, на боковую, на мировую.\n2. Приставка + наречие → слитно: донельзя, навсегда, назавтра, послезавтра.\n3. Корень отдельно не живёт → слитно: наизусть, наугад, наутёк, впросак, настежь, вдребезги.\n4. Сочетания с БЕЗ → раздельно: без умолку, без толку, без спросу, без оглядки.\n5. Предлог + существительное на гласную → раздельно: в обнимку, в одиночку, в упор."},

   {h:"Частотный список: раздельно",p:"И столько же с обратным написанием.",ex:"в общем, без умолку, в открытую, по очереди, на ходу, до сих пор, по двое, за границу, в сердцах, в рассрочку, на мировую, в конце концов"}

 {type:"rule",section:"Наречие или предлог с существительным",title:"Ловушка: наречие против предлога с существительным",
  blocks:[

   {h:"Пары, которые нужно узнавать в лицо",p:"Слева — наречие (слитно), справа — предлог с существительным или прилагательным (раздельно).",ex:"вначале было тихо — в начале пути\nзатем рассмеялся — за тем домом\nнапрямую сказать — на прямую дорогу\nзаодно с ним — принять два за одно\nнасовсем уехать — сослаться на совсем старые данные\nвтайне готовить — сохранить в тайне\nпоэтому опоздали — по этому мосту\nнаверх подняться — на верх повозки\nвовремя пришёл — во время бури\nвмиг исчез — в миг опасности\nнаутро выехали — на утро назначили\nвовсю старался — во всю ширь\nотроду не видел — от роду двадцать лет\nвправду обиделся — верить в правду"}
  ],
  trap:"Признак раздельного написания почти всегда один: <b>рядом появилось зависимое слово</b>. «Затем» — наречие («затем рассмеялся»), но «за тем домом» — уже местоимение с предлогом, потому что дальше стоит существительное. Тот же приём и с остальными парами: если можно спросить «за тем чем?», «на утро чего?» — пишем раздельно."},

/* ============================= ПАМЯТЬ ============================= */
var KEY="zad14_v2";
var ST={ans:{},stage:{},locked:{},first:{},flash:{},quiz:{},calm:false,idx:0};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){var p=JSON.parse(raw); if(p&&typeof p==="object"){ST=Object.assign(ST,p);} }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
function A(k){ if(!ST.ans[k])ST.ans[k]={}; return ST.ans[k]; }
function stage(k){ return ST.stage[k]||0; }
function L(k){ if(!ST.locked[k])ST.locked[k]=[]; return ST.locked[k]; }

/* ============================= УТИЛИТЫ ============================= */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function markBrackets(s){ return esc(s).replace(/\(([^)]*)\)/g,'<span class="paren">(</span><span class="brk">$1</span><span class="paren">)</span>'); }
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var ORDER={};
function ordered(key,items){
  if(!ORDER[key]){
    var idx=items.map(function(it,i){return i;});
    ORDER[key]=shuffle(idx);
  }
  return ORDER[key].map(function(i){return {it:items[i],id:"i"+i};});
}
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

/* ============================= РЕНДЕР ============================= */

var progressFill=document.getElementById("progressFill");
var slideCounter=document.getElementById("slideCounter");

var nextBtn=document.getElementById("nextBtn");

  else if(s.type==="practice"){ renderPractice(slide,s,k); }
  else if(s.type==="sort"){ renderSort(slide,s,k); }
  else if(s.type==="flash"){ renderFlash(slide,s,k); }
  else if(s.type==="quiz"){ renderQuiz(slide,s,k); }

  else if(s.type==="ege"){ renderEge(slide,s,k); }
  else if(s.type==="final"){ renderFinal(slide); }
  updateNav();
}

}

   ["3","<i>Союзы и омонимы</i>: чтобы / что бы, тоже / то же, зато / за то"],

   ["7","<i>Наречие или предлог с существительным</i>: вначале — в начале"],
   ["8","<i>ПОЛ- и ПОЛУ-</i>: правило трёх условий"],

/* ---------- ПРАВИЛО ---------- */
function renderRule(slide,s){
  head(slide,s);
  (s.blocks||[]).forEach(function(b){
    var h='<div class="rule-block"><h3>'+esc(b.h)+"</h3><p>"+b.p+"</p>";
    if(b.ex){ h+='<span class="ex">'+esc(b.ex).replace(/\n/g,"<br>")+"</span>"; }
    h+="</div>";
    slide.appendChild(el(h));
  });
  if(s.algo){
    var lis=s.algo.map(function(t){return "<li>"+t+"</li>";}).join("");
    slide.appendChild(el('<div class="rule-block"><h3>Порядок действий</h3><ol class="algo-steps">'+lis+"</ol></div>"));
  }
  if(s.memo){ slide.appendChild(el('<div class="memo-box">'+s.memo+"</div>")); }
  if(s.trap){ slide.appendChild(el('<div class="trap-box">'+s.trap+"</div>")); }
  if(s.note){ slide.appendChild(el('<div class="note-box">'+s.note+"</div>")); }
}

/* ---------- ПРАКТИКА ---------- */
function renderPractice(slide,s,k){
  head(slide,s);
  var opts=s.opts||SRD;
  var list=ordered(k,s.items);
  var grid=document.createElement("div");
  grid.className="word-grid";
  slide.appendChild(grid);
  var ans=A(k);

  list.forEach(function(o){
    var card=document.createElement("div");
    card.className="word-card";
    card.dataset.id=o.id;
    var chips=opts.map(function(op){
      return '<button class="chip" data-v="'+esc(op)+'">'+esc(op)+"</button>";
    }).join("");
    card.innerHTML='<div class="verdict"></div><div class="word-text">'+markBrackets(o.it.w)+"</div>"+
      '<div class="chip-row">'+chips+"</div>"+
      '<div class="why"></div>';
    card.querySelectorAll(".chip").forEach(function(ch){
      ch.onclick=function(){
        if(card.classList.contains("locked"))return;
        ans[o.id]=ch.dataset.v;
        card.querySelectorAll(".chip").forEach(function(c){c.classList.remove("selected","anim");});
        ch.classList.add("selected","anim");
        save();
      };
    });
    grid.appendChild(card);
  });

  var footer=document.createElement("div");
  footer.className="practice-footer";
  footer.innerHTML='<button class="btn btn-primary" id="checkBtn">Проверить</button>'+
    '<button class="btn btn-ghost" id="retryBtn" style="display:none">Ещё попытка</button>'+
    '<div class="practice-result" id="res"></div>';
  slide.appendChild(footer);
  var hint=el('<div class="hint-line"></div>');
  slide.appendChild(hint);

  function paint(){
    var st=stage(k), locked=L(k);
    list.forEach(function(o){
      var card=grid.querySelector('[data-id="'+o.id+'"]');
      var v=ans[o.id];
      card.className="word-card";
      card.querySelectorAll(".chip").forEach(function(c){
        c.classList.toggle("selected", c.dataset.v===v);
      });
      var isLocked = st>=2 || (st<2 && locked.indexOf(o.id)>=0);
      if(st>=1 || locked.indexOf(o.id)>=0){
        if(!v && st>=1){ card.classList.add("unans"); card.querySelector(".verdict").textContent="не отвечено"; }
        else if(v===o.it.a){ card.classList.add("correct"); card.querySelector(".verdict").textContent="верно"; }
        else if(v && st>=1){ card.classList.add("wrong"); card.querySelector(".verdict").textContent="ошибка"; }
      }
      if(isLocked) card.classList.add("locked");
      if(st>=2){
        card.classList.add("revealed","locked");
        card.querySelector(".why").innerHTML="<b>"+esc(o.it.full)+"</b> — "+o.it.why;
      }
    });
    var checkBtn=footer.querySelector("#checkBtn");
    var retryBtn=footer.querySelector("#retryBtn");
    var res=footer.querySelector("#res");
    if(st===0){ checkBtn.textContent="Проверить"; retryBtn.style.display="none"; }
    if(st===1){
      checkBtn.textContent="Показать ответы";
      retryBtn.style.display="";
      hint.textContent="Исправьте только отмеченные позиции. Правильные буквы откроются после второй проверки — сначала вспомните сами.";
    }
    if(st>=2){ checkBtn.disabled=true; checkBtn.textContent="Проверено"; retryBtn.style.display="none"; hint.textContent=""; }
    if(st>=1){
      var c=0,w=0,u=0;
      list.forEach(function(o){ var v=ans[o.id]; if(!v)u++; else if(v===o.it.a)c++; else w++; });
      res.innerHTML='<span class="ok">верно '+c+"</span> · "+'<span class="no">ошибок '+w+"</span> · "+'<span class="un">не отвечено '+u+"</span>";
    } else { res.textContent=""; }
  }

  footer.querySelector("#checkBtn").onclick=function(){
    var st=stage(k);
    if(st===0){
      var c=0,w=0,u=0;
      list.forEach(function(o){ var v=ans[o.id]; if(!v)u++; else if(v===o.it.a)c++; else w++; });
      if(!ST.first[k]){ ST.first[k]={c:c,w:w,u:u,sec:s.section}; }
      ST.stage[k]= (w===0&&u===0) ? 2 : 1;
    } else if(st===1){ ST.stage[k]=2; }
    save(); paint();
  };
  footer.querySelector("#retryBtn").onclick=function(){
    var locked=[];
    list.forEach(function(o){ if(ans[o.id]===o.it.a) locked.push(o.id); });
    ST.locked[k]=locked;
    ST.stage[k]=0;
    save(); paint();
    hint.textContent="Верные позиции закрыты. Исправьте остальные и нажмите «Проверить».";
  };
  paint();
}

/* ---------- СОРТИРОВКА ---------- */
function renderSort(slide,s,k){
  head(slide,s);
  var d=s.data;
  var list=ordered(k,d.items);
  var ans=A(k);
  var pool=el('<div class="sort-pool"></div>');
  var buckets=el('<div class="sort-buckets"></div>');
  d.buckets.forEach(function(name,i){
    buckets.appendChild(el('<div class="sort-bucket" data-b="'+i+'"><div class="sort-bucket-title">'+esc(name)+'</div><div class="row"></div></div>'));
  });
  slide.appendChild(pool); slide.appendChild(buckets);
  var footer=el('<div class="practice-footer"><button class="btn btn-primary" id="checkBtn">Проверить</button>'+
    '<button class="btn btn-ghost" id="retryBtn" style="display:none">Ещё попытка</button>'+
    '<div class="practice-result" id="res"></div></div>');
  slide.appendChild(footer);
  var why=el('<div class="hint-line"></div>');
  slide.appendChild(why);
  var sel=null;

  function paint(){
    var st=stage(k), locked=L(k);
    pool.innerHTML="";
    buckets.querySelectorAll(".row").forEach(function(r){ r.innerHTML=""; });
    list.forEach(function(o){
      var b=ans[o.id];
      var chip=el('<button class="sort-chip">'+markBrackets(o.it.t)+"</button>");
      var isLocked = st>=2 || locked.indexOf(o.id)>=0;
      if(st>=1 || locked.indexOf(o.id)>=0){
        if(b===undefined||b===null){ /* не разложено */ }
        else if(b===o.it.b) chip.classList.add("correct");
        else if(st>=1) chip.classList.add("wrong");
      }
      chip.onclick=function(){
        if(isLocked||st>=2)return;
        if(b===undefined||b===null){
          if(sel===o.id){ sel=null; } else { sel=o.id; }
          paint();
        } else {
          delete ans[o.id]; sel=null; save(); paint();
        }
      };
      if(sel===o.id) chip.classList.add("selecting");
      if(b===undefined||b===null){ pool.appendChild(chip); }
      else { buckets.querySelector('[data-b="'+b+'"] .row').appendChild(chip); }
    });
    buckets.querySelectorAll(".sort-bucket").forEach(function(bk){
      bk.onclick=function(ev){
        if(ev.target!==bk && !ev.target.classList.contains("row") && !ev.target.classList.contains("sort-bucket-title"))return;
        if(stage(k)>=2)return;
        if(sel===null)return;
        ans[sel]=parseInt(bk.dataset.b,10); sel=null; save(); paint();
      };
    });

function renderEge(slide,s,k){
  head(slide,s);

  slide.appendChild(el('<div class="ege-ask">Укажите варианты ответов, в которых все выделенные слова пишутся <b>'+esc(d.ask)+"</b>. Отметьте подходящие предложения.</div>"));

      return '<div class="ege-word"><div class="w">'+markBrackets(w.t)+'</div><div class="chip-row">'+chips+"</div></div>";
    }).join("");

  var footer=el('<div class="practice-footer"><button class="btn btn-primary" id="checkBtn">Проверить</button>'+

    '<div class="practice-result" id="res"></div></div>');
  slide.appendChild(footer);
  var hint=el('<div class="hint-line"></div>');

  function rowRight(ri){

  function paint(){
    var st=stage(k), locked=L(k);

        r.querySelector(".ege-answer").innerHTML=txt+". Предложение "+(rowRight(ri)==="yes"?"<b>подходит</b>":"не подходит")+" под условие «"+esc(d.ask)+"».";

    if(st===0){ checkBtn.textContent="Проверить"; retryBtn.style.display="none"; }
    if(st===1){ checkBtn.textContent="Показать ответы"; retryBtn.style.display=""; hint.textContent="Отмечены ряды с ошибкой. Исправьте их и проверьте снова — правильные написания откроются после второй проверки."; }
    if(st>=2){
      checkBtn.disabled=true; checkBtn.textContent="Проверено"; retryBtn.style.display="none";

        var wordsOk=row.w.every(function(x,wi){ return ans["w"+ri+"_"+wi]===x.a; });
        if(!vd&&!anyWord)u++; else if(vd===rowRight(ri)&&wordsOk)c++; else w++;
      });
      if(!ST.first[k]) ST.first[k]={c:c,w:w,u:u,sec:s.section};
      ST.stage[k]=(w===0&&u===0)?2:1;

/* ---------- ИТОГ ---------- */
function gaugeSVG(pct,color,valueText){
  var r=58, cx=74, cy=74, circ=2*Math.PI*r, off=circ*(1-pct/100);
  return '<svg viewBox="0 0 148 148">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" '+
      'stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+cx+" "+cy+')"/>'+
    '<text x="'+cx+'" y="'+(cy+8)+'" text-anchor="middle" fill="#F3E7D3" font-family="Playfair Display,serif" font-size="27">'+valueText+"</text>"+
    "</svg>";
}
function collect(){
  var bySec={};
  Object.keys(ST.first).forEach(function(k){
    var f=ST.first[k]; if(!f||!f.sec)return;
    if(!bySec[f.sec]) bySec[f.sec]={c:0,w:0,u:0,slide:null};
    bySec[f.sec].c+=f.c; bySec[f.sec].w+=f.w; bySec[f.sec].u+=f.u;
  });
  SLIDES.forEach(function(s,i){
    if(s.type==="rule"&&s.section&&bySec[s.section]&&bySec[s.section].slide===null) bySec[s.section].slide=i;
  });
  return bySec;
}
function renderFinal(slide){
  var bySec=collect();
  var secs=Object.keys(bySec);
  var tc=0,tw=0,tu=0;
  secs.forEach(function(n){ tc+=bySec[n].c; tw+=bySec[n].w; tu+=bySec[n].u; });
  var answered=tc+tw;
  var pct= answered? Math.round(tc/answered*100):0;
  var color = pct>=80?"#5FBFA8":(pct>=55?"#E8C55F":"#D9634F");

  var html='<div class="eyebrow">Итог</div><h1>Показания приборов</h1>';
  if(!answered && !tu){
    html+='<p class="subtitle">Пока ни одно упражнение не проверено. Пройдите блоки и нажмите «Проверить» — тогда здесь появится разбор по темам.</p>';
    slide.innerHTML=html; return;
  }
  html+='<div class="gauges">'+
    '<div class="gauge">'+gaugeSVG(pct,color,pct+"%")+'<div class="gauge-label">точность</div></div>'+
    '<div class="gauge">'+gaugeSVG(answered?Math.round(tc/(answered+tu)*100):0,"#D8A44A",String(tc))+'<div class="gauge-label">верных ответов</div></div>'+
    "</div>"+
    '<p class="subtitle">Верно: '+tc+" · Ошибок: "+tw+" · Не отвечено: "+tu+". Пропущенные позиции не считаются ошибками — они просто не вошли в статистику.</p>";

  var rows=secs.map(function(n){
    var d=bySec[n], a=d.c+d.w;
    return {name:n, pct: a?Math.round(d.c/a*100):null, c:d.c, w:d.w, u:d.u, slide:d.slide};
  }).sort(function(x,y){
    if(x.pct===null)return 1; if(y.pct===null)return -1; return x.pct-y.pct;
  });

  html+='<div class="final-box"><h3>Темы на повторение</h3>'+
    '<p class="subtitle" style="font-size:13.5px">От самой проблемной к усвоенной. Нажмите на тему — вернётесь к её теории.</p>'+
    '<div class="topic-list">';
  rows.forEach(function(r){
    var col = r.pct===null?"#B09A7C":(r.pct>=80?"#5FBFA8":(r.pct>=55?"#E8C55F":"#D9634F"));
    html+='<button class="topic" data-slide="'+(r.slide===null?"":r.slide)+'">'+
      '<span class="name">'+esc(r.name)+"</span>"+
      '<span class="bar"><i style="width:'+(r.pct===null?0:r.pct)+"%;background:"+col+'"></i></span>'+
      '<span class="pct" style="color:'+col+'">'+(r.pct===null?"—":r.pct+"%")+"</span>"+
      (r.slide===null?"":'<span class="goto">к теории →</span>')+
      "</button>";
  });
  html+="</div></div>";
  html+='<div class="practice-footer" style="margin-top:16px">'+
    '<button class="btn btn-primary" id="copyBtn">Скопировать итог</button>'+
    '<button class="btn btn-ghost" id="resetBtn">Сбросить прогресс</button>'+
    '<div class="practice-result" id="copyRes"></div></div>'+
    '<textarea class="copy-area" id="copyArea" readonly></textarea>';
  slide.innerHTML=html;

  slide.querySelectorAll(".topic").forEach(function(b){
    b.onclick=function(){ var i=b.dataset.slide; if(i!=="") goTo(parseInt(i,10)); };
  });

  var text="Задание 14. Итог тренажёра\n"+
    "Верно: "+tc+" · Ошибок: "+tw+" · Не отвечено: "+tu+" · Точность: "+pct+"%\n\nПо темам (от слабой к сильной):\n"+
    rows.map(function(r){ return "— "+r.name+": "+(r.pct===null?"не проходилась":r.pct+"% (верно "+r.c+", ошибок "+r.w+", пропущено "+r.u+")"); }).join("\n");
  var ta=slide.querySelector("#copyArea");
  ta.value=text;
  slide.querySelector("#copyBtn").onclick=function(){
    var res=slide.querySelector("#copyRes");
    function fallback(){ ta.style.display="block"; ta.select(); try{document.execCommand("copy");}catch(e){} res.textContent="Скопировано (или выделено — скопируйте вручную)"; }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ res.textContent="Скопировано"; },fallback);
    } else fallback();
  };
  slide.querySelector("#resetBtn").onclick=function(){
    if(!confirm("Стереть все ответы и начать заново?"))return;
    ST={ans:{},stage:{},locked:{},first:{},flash:{},quiz:{},calm:ST.calm,idx:0};
    save(); ORDER={}; goTo(0);
  };
}

/* оглавление */
var tocOverlay=document.getElementById("tocOverlay");
var tocBody=document.getElementById("tocBody");
var TAGS={title:"Начало",map:"Карта",rule:"Правило",practice:"Практика",sort:"Практика",
  flash:"Карточки",quiz:"Викторина",egeIntro:"Формат ЕГЭ",ege:"Задание ЕГЭ",final:"Итог"};
function slideName(s,i){
  if(s.type==="title")return "Титульный слайд";
  if(s.type==="map")return "Карта задания 14";
  if(s.type==="egeIntro")return "Как устроены задания ЕГЭ";
  if(s.type==="final")return "Итог и темы на повторение";
  return s.title||TAGS[s.type]||"Слайд "+(i+1);
}
function buildTOC(){
  var html="",lastSec=null;
  SLIDES.forEach(function(s,i){
    var sec=s.section||null;
    if(sec&&sec!==lastSec){ html+='<div class="toc-group">'+esc(sec)+"</div>"; lastSec=sec; }
    if(!sec&&lastSec!==null&&(s.type==="title"||s.type==="map"||s.type==="egeIntro"||s.type==="final")){ lastSec=null; }
    var f=ST.first["s"+i], score="";
    if(f){
      var a=f.c+f.w, pct=a?Math.round(f.c/a*100):null;
      var col = pct===null?"var(--text-dim)":(pct>=80?"var(--green)":(pct>=55?"var(--yellow)":"var(--red)"));
      score='<span class="toc-score" style="color:'+col+'">'+(pct===null?"—":pct+"%")+"</span>";
    } else { score='<span class="toc-score" style="color:var(--text-dim)">·</span>'; }
    html+='<button class="toc-item'+(i===curr?" current":"")+'" data-i="'+i+'">'+
      '<span class="toc-num">'+(i+1)+"</span>"+
      '<span class="toc-name">'+esc(slideName(s,i))+"</span>"+
      '<span class="toc-tag">'+esc(TAGS[s.type]||"")+"</span>"+score+"</button>";
  });
  tocBody.innerHTML=html;
  tocBody.querySelectorAll(".toc-item").forEach(function(b){
    b.onclick=function(){ closeTOC(); goTo(parseInt(b.dataset.i,10)); };
  });
  var cur=tocBody.querySelector(".toc-item.current");
  if(cur) setTimeout(function(){ cur.scrollIntoView({block:"center"}); },0);
}
function openTOC(){ buildTOC(); tocOverlay.classList.add("open"); }
function closeTOC(){ tocOverlay.classList.remove("open"); }
slideCounter.onclick=openTOC;
document.getElementById("tocClose").onclick=closeTOC;
tocOverlay.onclick=function(e){ if(e.target===tocOverlay) closeTOC(); };

prevBtn.onclick=function(){ goTo(curr-1); };
nextBtn.onclick=function(){ goTo(curr+1); };
document.addEventListener("keydown",function(e){
  if(e.target&&(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"))return;
  if(e.key==="Escape"){ closeTOC(); return; }
  if(tocOverlay.classList.contains("open"))return;
  if(e.key==="ArrowRight")goTo(curr+1);
  if(e.key==="ArrowLeft")goTo(curr-1);
});

/* спокойный режим */
function applyCalm(){
  document.body.classList.toggle("calm",!!ST.calm);
  calmBtn.classList.toggle("on",!!ST.calm);
  calmBtn.textContent = ST.calm ? "Спокойный режим: вкл" : "Спокойный режим";
}
calmBtn.onclick=function(){ ST.calm=!ST.calm; save(); applyCalm(); };
applyCalm();

/* пылинки */
(function(){
  var d=document.getElementById("dust");
  for(var i=0;i<16;i++){
    var s=document.createElement("i");
    s.style.left=(Math.random()*100)+"%";
    s.style.animationDuration=(11+Math.random()*13)+"s";
    s.style.animationDelay=(Math.random()*14)+"s";
    d.appendChild(s);
  }
})();

goTo(ST.idx&&ST.idx<SLIDES.length?ST.idx:0);
</script>
</body>
</html>
