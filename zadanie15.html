<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задание 15 ЕГЭ. Правописание Н и НН</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0a0c11; --bg2:#11151d; --bg3:#181d27;
  --panel:#1c222c;
  --panel-2:#232a36;
  --line:#39424f;
  --bevel-lite:rgba(255,255,255,.10);
  --bevel-dark:rgba(0,0,0,.45);

  --text:#E9ECF2;
  --dim:#9AA5B5;

  --grass:#6BBF4A;
  --grass-lite:#8FE06A;
  --dirt:#7A5232;
  --stone:#7C848F;
  --emerald:#25D366;
  --diamond:#54E8DC;
  --gold:#F7C33B;
  --redstone:#E8503C;
  --lapis:#4A7BE0;
  --amethyst:#A472E8;

  --head:'Russo One','Rubik',system-ui,sans-serif;
  --ui:'Rubik',system-ui,sans-serif;

  --ok:#6BBF4A; --ok-soft:rgba(107,191,74,.14);
  --bad:#E8503C; --bad-soft:rgba(232,80,60,.14);
  --skip:#F7C33B; --skip-soft:rgba(247,195,59,.14);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:
    radial-gradient(ellipse 70% 45% at 15% 0%, rgba(74,123,224,.10) 0%, transparent 58%),
    radial-gradient(ellipse 60% 45% at 88% 6%, rgba(107,191,74,.10) 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  color:var(--text);
  font-family:var(--ui);font-size:16px;
  display:flex;flex-direction:column;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
}

/* ---------- фон: пиксельная сетка + частицы ---------- */
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:32px 32px;}
.motes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.motes i{position:absolute;bottom:-10px;width:5px;height:5px;background:var(--gold);
  box-shadow:0 0 8px rgba(247,195,59,.55);opacity:0;animation:moteRise linear infinite;}
@keyframes moteRise{
  0%{transform:translateY(0);opacity:0;}
  10%{opacity:.75;}
  60%{opacity:.35;}
  100%{transform:translateY(-105dvh);opacity:0;}
}
.bedrock{position:fixed;left:0;right:0;bottom:0;height:60px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));}

body.calm .motes{display:none;}
body.calm *{animation:none !important;transition:none !important;}
@media (prefers-reduced-motion: reduce){
  .motes{display:none;}
  *{animation:none !important;transition:none !important;}
}

/* ---------- полоса опыта ---------- */
.xpwrap{position:relative;z-index:3;flex-shrink:0;background:#0a0c11;border-bottom:2px solid #000;}
.xpbar{height:12px;background:repeating-linear-gradient(90deg,#242b36 0 6px,#1d232c 6px 12px);}
.xpfill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--grass-lite) 0 6px,var(--grass) 6px 12px);
  box-shadow:0 0 12px rgba(107,191,74,.45);transition:width .35s steps(12);}

/* ---------- шапка ---------- */
header{position:relative;z-index:3;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:8px 14px;border-bottom:2px solid #000;background:rgba(10,12,17,.75);}
.brand{font-family:var(--head);font-size:15px;letter-spacing:.5px;color:var(--grass-lite);
  text-shadow:2px 2px 0 #000;}
.brand small{display:block;font-family:'Rubik';font-size:10px;color:var(--dim);letter-spacing:0;text-shadow:none;}
.headtools{display:flex;gap:8px;align-items:center;}

/* ---------- блочные кнопки ---------- */
.btn{
  font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.5px;
  min-height:44px;padding:10px 18px;border:2px solid #000;cursor:pointer;
  background:var(--stone);color:#14181f;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.35), 0 3px 0 #000;
  transition:transform .08s steps(2), filter .15s;
  text-shadow:none;
}
.btn:hover{filter:brightness(1.12);}
.btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 rgba(255,255,255,.25), inset -2px -2px 0 rgba(0,0,0,.35), 0 1px 0 #000;}
.btn:disabled{opacity:.4;cursor:default;}
.btn-primary{background:var(--grass);color:#0b1a06;}
.btn-gold{background:var(--gold);color:#231a02;}
.btn-lapis{background:var(--lapis);color:#eef3ff;}
.btn-ghost{background:var(--panel-2);color:var(--text);
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark), 0 3px 0 #000;}
.btn-sm{min-height:40px;padding:8px 12px;font-size:13px;}

.toggle{font-family:'Rubik';font-size:12px;color:var(--dim);border:2px solid #000;background:var(--panel-2);
  padding:8px 10px;min-height:40px;cursor:pointer;display:flex;align-items:center;gap:6px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.toggle b{color:var(--text);font-weight:500;}
.toggle .dot{width:10px;height:10px;background:var(--stone);border:1px solid #000;}
.toggle.on .dot{background:var(--grass-lite);box-shadow:0 0 6px var(--grass-lite);}

/* ---------- сцена ---------- */
main{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 14px 96px;}
.slide{max-width:920px;margin:0 auto;animation:slideIn .28s steps(4);}
@keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.section-tag{display:inline-block;font-family:var(--head);font-size:12.5px;letter-spacing:1px;
  color:#0b1a06;background:var(--grass);padding:4px 10px;border:2px solid #000;margin-bottom:10px;}
h1{font-family:var(--head);font-size:clamp(24px,5vw,40px);margin:0 0 10px;line-height:1.15;
  text-shadow:3px 3px 0 #000;}
h2{font-family:var(--head);font-size:clamp(19px,3.6vw,27px);margin:0 0 14px;line-height:1.2;
  text-shadow:2px 2px 0 #000;}
h3{font-family:var(--ui);font-weight:700;font-size:18px;letter-spacing:.2px;margin:0 0 8px;color:var(--gold);text-shadow:2px 2px 0 #000;}
p{line-height:1.6;margin:0 0 12px;}

.panel{background:var(--panel);border:2px solid #000;padding:16px;margin-bottom:14px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.panel.accent{border-left:8px solid var(--grass);}
.panel.warn{border-left:8px solid var(--redstone);}
.panel.note{border-left:8px solid var(--lapis);}
.panel.gold{border-left:8px solid var(--gold);}

code,.mono{font-family:'JetBrains Mono',monospace;}
.ex{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--diamond);background:rgba(84,232,220,.07);
  border:2px solid #000;padding:9px 11px;display:block;margin-top:8px;line-height:1.8;}
.ex b{color:var(--gold);}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:720px){.cols{grid-template-columns:1fr;}}

/* ---------- титул ---------- */
.title-slide{text-align:center;padding-top:4dvh;}
.logo-block{display:inline-grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:18px;}
.logo-block span{width:52px;height:52px;border:2px solid #000;display:grid;place-items:center;
  font-family:var(--head);font-size:26px;color:#0b1a06;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.3), inset -3px -3px 0 rgba(0,0,0,.35);}
.logo-block span:nth-child(1){background:var(--grass);}
.logo-block span:nth-child(2){background:var(--gold);}
.logo-block span:nth-child(3){background:var(--lapis);color:#eef3ff;}
.logo-block span:nth-child(4){background:var(--diamond);}
.lead{color:var(--dim);max-width:560px;margin:0 auto 20px;}

/* ---------- карта ---------- */
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.map-cell{background:var(--panel-2);border:2px solid #000;padding:12px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.map-cell b{display:block;font-family:var(--ui);font-weight:700;color:var(--gold);margin-bottom:4px;font-size:15px;}
.map-cell span{font-size:13px;color:var(--dim);line-height:1.5;}

/* ---------- практика ---------- */
.instruction{color:var(--dim);font-size:14px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
@media(max-width:640px){.grid{grid-template-columns:1fr;}}
.card{background:var(--panel-2);border:2px solid #000;padding:12px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.card.correct{background:var(--ok-soft);border-color:#000;box-shadow:inset 0 0 0 2px var(--ok);}
.card.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);}
.card.skipped{background:var(--skip-soft);box-shadow:inset 0 0 0 2px var(--skip);}
.card.pulse{animation:pop .3s steps(3);}
@keyframes pop{0%{transform:scale(.96);}60%{transform:scale(1.03);}100%{transform:scale(1);}}

.word{font-family:'JetBrains Mono',monospace;font-size:17px;line-height:1.5;margin-bottom:10px;word-break:break-word;}
.blank{display:inline-block;min-width:34px;text-align:center;color:var(--gold);
  border-bottom:3px solid var(--gold);margin:0 2px;font-weight:700;}
.chips{display:flex;gap:8px;}
.chip{flex:1;min-height:44px;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;
  border:2px solid #000;background:var(--stone);color:#14181f;cursor:pointer;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -2px 0 rgba(0,0,0,.3);}
.chip.selected{background:var(--lapis);color:#fff;}
.chip:disabled{opacity:.55;cursor:default;}
.why{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:9px;padding-top:9px;border-top:2px solid rgba(255,255,255,.08);display:none;}
.why.show{display:block;}
.why b{color:var(--gold);font-weight:500;}
.status{font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.4px;margin-top:8px;display:none;}
.status.show{display:block;}
.status.s-ok{color:var(--ok);} .status.s-bad{color:var(--bad);} .status.s-skip{color:var(--skip);}

.footer-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;}
.result{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000;}

/* ---------- сортировка ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:44px;}
.sortchip{font-family:'JetBrains Mono',monospace;font-size:14px;min-height:44px;padding:8px 12px;border:2px solid #000;
  background:var(--panel-2);color:var(--text);cursor:pointer;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.sortchip.picked{background:var(--gold);color:#231a02;}
.sortchip.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);}
.sortchip.no{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:640px){.buckets{grid-template-columns:1fr;}}
.bucket{background:var(--panel);border:2px solid #000;padding:12px;min-height:110px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.bucket h4{font-family:var(--ui);font-weight:700;margin:0 0 10px;font-size:15px;color:var(--diamond);}
.bucket .drop{display:flex;flex-wrap:wrap;gap:8px;}

/* ---------- флеш-карты ---------- */
.flashwrap{perspective:1000px;}
.flash{background:var(--panel-2);border:2px solid #000;min-height:190px;display:grid;place-items:center;
  padding:24px;text-align:center;cursor:pointer;
  box-shadow:inset 3px 3px 0 var(--bevel-lite), inset -3px -3px 0 var(--bevel-dark);}
.flash .f-front{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--gold);line-height:1.5;}
.flash .f-back{font-size:15px;line-height:1.6;color:var(--text);}
.flash .f-back b{color:var(--grass-lite);}
.flash-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;}
.flash-count{font-family:var(--ui);font-weight:700;color:var(--dim);font-size:14px;}
.tip{font-size:12px;color:var(--dim);margin-top:8px;}

/* ---------- квиз ---------- */
.qopt{display:block;width:100%;text-align:left;min-height:44px;padding:12px;margin-bottom:8px;
  border:2px solid #000;background:var(--panel-2);color:var(--text);cursor:pointer;font-family:'Rubik';font-size:14px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.qopt.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);}
.qopt.no{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);}
.qfb{font-size:13.5px;color:var(--dim);line-height:1.6;margin-top:10px;display:none;}
.qfb.show{display:block;}

/* ---------- ЕГЭ ---------- */
.ege-task{font-size:17px;line-height:2.4;font-family:'JetBrains Mono',monospace;}
.gap{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 2px;}
.gap .num{font-family:var(--ui);font-weight:700;font-size:11px;color:var(--gold);background:#000;
  padding:1px 4px;border:1px solid var(--gold);}
.gapbtn{min-width:34px;min-height:34px;padding:2px 6px;border:2px solid #000;background:var(--stone);color:#14181f;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -2px 0 rgba(0,0,0,.3);}
.gapbtn.selected{background:var(--lapis);color:#fff;}
.gapbtn:disabled{opacity:.55;cursor:default;}
.gapwrap.correct .num{border-color:var(--ok);color:var(--ok);}
.gapwrap.wrong .num{border-color:var(--bad);color:var(--bad);}
.gapwrap.skipped .num{border-color:var(--skip);color:var(--skip);}
.answerline{font-family:var(--head);font-size:18px;margin-top:14px;color:var(--diamond);}
.answerline span{color:var(--gold);}
.ege-why{margin-top:12px;display:none;}
.ege-why.show{display:block;}
.ege-why div{font-size:13px;color:var(--dim);line-height:1.6;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.ege-why div b{color:var(--gold);font-weight:500;}

/* ---------- финал ---------- */
.score-hero{text-align:center;padding:14px 0 4px;}
.score-num{font-family:var(--head);font-size:56px;color:var(--gold);text-shadow:4px 4px 0 #000;line-height:1;}
.score-sub{color:var(--dim);font-size:14px;margin-top:6px;}
.topic{background:var(--panel-2);border:2px solid #000;padding:12px;margin-bottom:9px;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.topic-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.topic-name{font-family:var(--ui);font-weight:700;font-size:15px;}
.topic-val{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);}
.tbar{height:10px;background:#0e1218;border:2px solid #000;margin-top:8px;}
.tbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--grass-lite) 0 5px,var(--grass) 5px 10px);}
.tbar i.mid{background:repeating-linear-gradient(90deg,#ffd964 0 5px,var(--gold) 5px 10px);}
.tbar i.low{background:repeating-linear-gradient(90deg,#ff7a68 0 5px,var(--redstone) 5px 10px);}
.topic-link{font-size:12px;color:var(--diamond);cursor:pointer;text-decoration:underline;margin-top:7px;display:inline-block;}

/* ---------- оглавление ---------- */
.toc-backdrop{position:fixed;inset:0;z-index:20;background:rgba(4,6,10,.82);display:flex;align-items:flex-end;justify-content:center;}
.toc-panel{width:100%;max-width:720px;max-height:82dvh;display:flex;flex-direction:column;
  background:var(--panel);border:2px solid #000;border-bottom:none;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), 0 -6px 0 rgba(0,0,0,.4);
  animation:tocUp .2s steps(4);}
@keyframes tocUp{from{transform:translateY(28px);opacity:0;}to{transform:none;opacity:1;}}
.toc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;
  border-bottom:2px solid #000;background:var(--panel-2);flex-shrink:0;}
.toc-head b{font-family:var(--head);font-size:17px;text-shadow:2px 2px 0 #000;}
.toc-body{overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch;}
.toc-group{font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.6px;color:var(--diamond);
  text-transform:uppercase;margin:16px 0 7px;padding-bottom:5px;border-bottom:2px solid rgba(255,255,255,.08);}
.toc-group:first-child{margin-top:2px;}
.toc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:46px;
  padding:9px 11px;margin-bottom:5px;cursor:pointer;color:var(--text);font-family:var(--ui);font-size:14.5px;
  background:var(--panel-2);border:2px solid #000;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.toc-item:hover{filter:brightness(1.15);}
.toc-item.here{background:var(--lapis);color:#fff;}
.toc-item .n{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);min-width:26px;flex-shrink:0;}
.toc-item.here .n{color:#dbe6ff;}
.toc-item .label{flex:1;line-height:1.35;}
.toc-item .kind{font-size:11px;color:var(--dim);display:block;margin-top:2px;}
.toc-item.here .kind{color:#cfdcff;}
.toc-item .mark{width:11px;height:11px;flex-shrink:0;border:2px solid #000;background:var(--stone);}
.toc-item .mark.part{background:var(--gold);}
.toc-item .mark.done{background:var(--grass-lite);}

/* ---------- навигация ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;background:rgba(10,12,17,.92);border-top:2px solid #000;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.counter{font-family:var(--ui);font-weight:600;font-size:13.5px;color:var(--dim);
  background:var(--panel-2);border:2px solid #000;min-height:44px;padding:8px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;
  box-shadow:inset 2px 2px 0 var(--bevel-lite), inset -2px -2px 0 var(--bevel-dark);}
.counter:hover{filter:brightness(1.15);}
.counter small{font-size:10.5px;color:var(--grass-lite);}
</style>
</head>
<body>

<div class="gridbg"></div>
<div class="motes" id="motes"></div>
<div class="bedrock"></div>

<div class="xpwrap"><div class="xpbar"><div class="xpfill" id="xpfill"></div></div></div>

<header>
  <div class="brand">ЗАДАНИЕ 15<small>Правописание Н и НН</small></div>
  <div class="headtools">
    <button class="toggle" id="calmBtn"><span class="dot"></span><b>Мирный режим</b></button>
  </div>
</header>

<main id="main"></main>

<div class="nav">
  <button class="btn btn-ghost btn-sm" id="prevBtn">◀ Назад</button>
  <button class="counter" id="counter" aria-haspopup="dialog"></button>
  <button class="btn btn-primary btn-sm" id="nextBtn">Дальше ▶</button>
</div>

<div id="tocRoot"></div>

<script>
/* ============================================================
   ДАННЫЕ
   ============================================================ */

/* --- 1. Сортировка: от чего образовано слово --- */
const SORT_ORIGIN = {
  left:"От существительного", right:"От глагола",
  items:[
    {w:"кожаный",       side:"left",  note:"кожа"},
    {w:"туманный",      side:"left",  note:"туман"},
    {w:"лебединый",     side:"left",  note:"лебедь"},
    {w:"революционный", side:"left",  note:"революция"},
    {w:"песчаный",      side:"left",  note:"песок"},
    {w:"торжественный", side:"left",  note:"торжество"},
    {w:"жареный",       side:"right", note:"жарить"},
    {w:"решённый",      side:"right", note:"решить"},
    {w:"кипячёный",     side:"right", note:"кипятить"},
    {w:"крашеный",      side:"right", note:"красить"},
    {w:"брошенный",     side:"right", note:"бросить"},
    {w:"маринованный",  side:"right", note:"мариновать"}

function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function orderFor(idx,n){ if(!ORDER[idx]) ORDER[idx]=shuffled(n); return ORDER[idx]; }

const esc = s=>s;

function render(){
  const s = SLIDES[current];
  main.scrollTop = 0;
  main.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "slide";
  main.appendChild(wrap);

  if(s.type==="title") renderTitle(wrap);
  else if(s.type==="map") renderMap(wrap);
  else if(s.type==="rule") renderRule(wrap, s);
  else if(s.type==="sort") renderSort(wrap, s);
  else if(s.type==="practice") renderPractice(wrap, s);
  else if(s.type==="flash") renderFlash(wrap, s);
  else if(s.type==="quiz") renderQuiz(wrap, s);
  else if(s.type==="egeIntro") renderEgeIntro(wrap);
  else if(s.type==="ege") renderEge(wrap, s);
  else if(s.type==="final") renderFinal(wrap);

  document.getElementById("counter").innerHTML = "Слайд "+(current+1)+" из "+SLIDES.length+"<small>оглавление</small>";
  document.getElementById("xpfill").style.width = ((current)/(SLIDES.length-1)*100)+"%";
  document.getElementById("prevBtn").disabled = current===0;
  document.getElementById("nextBtn").disabled = current===SLIDES.length-1;
  S.idx = current; save();
}

function goTo(i){ if(i<0||i>=SLIDES.length) return; closeToc(); current=i; render(); }

const KIND = {
  title:"Начало", map:"Карта задания", rule:"Правило", practice:"Упражнение",
  sort:"Сортировка", flash:"Флеш-карты", quiz:"Викторина",
  egeIntro:"Формат ЕГЭ", ege:"Задание ЕГЭ", final:"Итог"
};

function slideLabel(s, i){
  if(s.type==="title") return "Титульный слайд";
  if(s.type==="map") return "Что проверяет задание 15";
  if(s.type==="egeIntro") return "Как устроен блок заданий ЕГЭ";
  if(s.type==="final") return "Итог и темы на повторение";
  return s.title || ("Слайд "+(i+1));
}

/* 0 — не начато, 1 — в работе, 2 — пройдено */
function slideProgress(s, i){
  if(s.type==="practice"){ const st=S.practice[i]; if(!st) return 0; if(st.stage>=3) return 2; if(st.stage>=1||Object.keys(st.ans).length) return 1; return 0; }
  if(s.type==="sort"){ const st=S.sort[i]; if(!st) return 0; if(st.stage>=2) return 2; if(st.stage>=1||Object.keys(st.pick).length) return 1; return 0; }
  if(s.type==="ege"){ const st=S.ege[i]; if(!st) return 0; if(st.stage>=3) return 2; if(st.stage>=1||Object.keys(st.ans).length) return 1; return 0; }
  if(s.type==="quiz"){ const st=S.quiz[i]; if(!st) return 0; const n=Object.keys(st.ans).length;
    return n===0?0:(n===s.items.length?2:1); }
  if(s.type==="flash"){ const st=S.flash[i]; if(!st||!st.known.length) return 0;
    return st.known.length===s.items.length?2:1; }
  return 0;
}

function closeToc(){ document.getElementById("tocRoot").innerHTML=""; }

function openToc(){
  const root = document.getElementById("tocRoot");
  let html = `<div class="toc-backdrop" id="tocBack"><div class="toc-panel" role="dialog" aria-label="Оглавление">
    <div class="toc-head"><b>Оглавление</b><button class="btn btn-ghost btn-sm" id="tocClose">Закрыть ✕</button></div>
    <div class="toc-body">`;

  let lastGroup = null;
  SLIDES.forEach((s,i)=>{
    const group = s.group || s.section || (
      s.type==="title"||s.type==="map" ? "Начало" :
      s.type==="egeIntro" ? "Формат ЕГЭ" :
      s.type==="final" ? "Финал" : "Прочее");
    if(group !== lastGroup){ html += `<div class="toc-group">${group}</div>`; lastGroup = group; }
    const p = slideProgress(s,i);
    const mark = p===2 ? "done" : (p===1 ? "part" : "");
    html += `<button class="toc-item ${i===current?"here":""}" data-go="${i}">
        <span class="n">${i+1}</span>
        <span class="label">${slideLabel(s,i)}<span class="kind">${KIND[s.type]||""}</span></span>
        <span class="mark ${mark}"></span>
      </button>`;
  });

  html += `</div></div></div>`;
  root.innerHTML = html;

  root.querySelector("#tocClose").addEventListener("click", closeToc);
  root.querySelector("#tocBack").addEventListener("click", e=>{ if(e.target.id==="tocBack") closeToc(); });
  root.querySelectorAll(".toc-item").forEach(b=>b.addEventListener("click", ()=>goTo(+b.dataset.go)));
  const here = root.querySelector(".toc-item.here");
  if(here) here.scrollIntoView({block:"center"});
}

document.getElementById("prevBtn").addEventListener("click", ()=>goTo(current-1));
document.getElementById("nextBtn").addEventListener("click", ()=>goTo(current+1));
document.getElementById("counter").addEventListener("click", ()=>{
  if(document.getElementById("tocRoot").innerHTML) closeToc(); else openToc();
});
document.addEventListener("keydown", e=>{
  const tocOpen = !!document.getElementById("tocRoot").innerHTML;
  if(e.key==="Escape"){ if(tocOpen) closeToc(); return; }
  if(tocOpen) return;
  if(e.target.tagName==="BUTTON" && (e.key===" "||e.key==="Enter")) return;
  if(e.key==="ArrowLeft") goTo(current-1);
  if(e.key==="ArrowRight") goTo(current+1);
});

/* --- практика (два шага) --- */
function renderPractice(el, s){
  const idx = current;
  if(!S.practice[idx]) S.practice[idx] = {ans:{}, stage:0};
  const st = S.practice[idx];
  const items = s.items;
  const order = orderFor(idx, items.length);

  el.innerHTML = `
    <span class="section-tag">${s.section}</span>
    <h2>${s.title}</h2>
    <p class="instruction">${s.instruction}</p>
    <div class="grid" id="grid"></div>
    <div class="footer-bar">
      <button class="btn btn-primary" id="checkBtn">Проверить</button>
      <button class="btn btn-ghost btn-sm" id="resetBtn">Сбросить</button>
      <div class="result" id="res"></div>
    </div>`;

  const grid = el.querySelector("#grid");
  order.forEach(i=>{
    const it = items[i];
    const card = document.createElement("div");
    card.className = "card";
    card.id = "c"+i;
    card.innerHTML = `
      <div class="word">${it.b}<span class="blank" id="bl${i}">__</span>${it.a}</div>
      <div class="chips">
        <button class="chip" data-i="${i}" data-v="н">Н</button>
        <button class="chip" data-i="${i}" data-v="нн">НН</button>
      </div>
      <div class="status" id="st${i}"></div>
      <div class="why" id="wh${i}">${it.why}</div>`;
    grid.appendChild(card);
  });

  grid.addEventListener("click", e=>{
    const b = e.target.closest(".chip");
    if(!b || b.disabled) return;
    const i = +b.dataset.i, v = b.dataset.v;
    st.ans[i] = v; save();
    paint();
  });

  el.querySelector("#checkBtn").addEventListener("click", ()=>{
    if(st.stage===0){ st.stage=1; }
    else if(st.stage===1){ st.stage=2; }
    else if(st.stage===2){ st.stage=3; }
    save(); paint();
  });
  el.querySelector("#resetBtn").addEventListener("click", ()=>{
    S.practice[idx] = {ans:{}, stage:0}; save(); render();
  });

  function paint(){
    const st2 = S.practice[idx];
    const stage = st2.stage; // 0 ввод, 1 первая проверка, 2 вторая попытка, 3 финал
    let correct=0, wrong=0, skip=0;

    order.forEach(i=>{
      const it = items[i];
      const card = el.querySelector("#c"+i);
      const chosen = st2.ans[i];
      const isRight = chosen === it.ans;
      const blank = el.querySelector("#bl"+i);
      const status = el.querySelector("#st"+i);
      const why = el.querySelector("#wh"+i);

      card.classList.remove("correct","wrong","skipped");
      status.className="status"; status.textContent="";
      why.classList.remove("show");

      blank.textContent = chosen ? chosen.toUpperCase() : "__";

      card.querySelectorAll(".chip").forEach(c=>{
        c.classList.toggle("selected", c.dataset.v===chosen);
        // блокировка: верное на 2-й попытке заморожено, на финале всё заморожено
        let lock = false;
        if(stage===2 && isRight) lock = true;
        if(stage>=3) lock = true;
        if(stage===1) lock = true;
        c.disabled = lock;
      });

      if(stage>=1){
        if(!chosen){ skip++; card.classList.add("skipped"); status.className="status show s-skip"; status.textContent="НЕ ОТВЕЧЕНО"; }
        else if(isRight){ correct++; card.classList.add("correct"); status.className="status show s-ok"; status.textContent="ВЕРНО"; }
        else { wrong++; card.classList.add("wrong"); status.className="status show s-bad"; status.textContent = (stage>=3)? "ОШИБКА" : "НЕВЕРНО — ИСПРАВЬТЕ"; }
      }
      if(stage===2 && !isRight){
        card.classList.remove("wrong","skipped");
        status.className="status"; status.textContent="";
      }
      if(stage>=3){
        blank.textContent = it.ans.toUpperCase();
        why.classList.add("show");
      }
    });

    const btn = el.querySelector("#checkBtn");
    const res = el.querySelector("#res");
    if(stage===0){ btn.textContent="Проверить"; btn.className="btn btn-primary"; res.textContent=""; }
    else if(stage===1){
      btn.textContent="Ещё попытка ↻"; btn.className="btn btn-gold";
      res.textContent = `Верно ${correct} из ${items.length}` + (skip?` · пропущено ${skip}`:"");
    }
    else if(stage===2){
      btn.textContent="Проверить"; btn.className="btn btn-primary";
      res.textContent = `Верные ответы заморожены. Исправьте остальное.`;
    }
    else {
      btn.textContent="Готово"; btn.className="btn btn-ghost"; btn.disabled=true;
      res.textContent = `Итог: ${correct} из ${items.length}` + (skip?` · пропущено ${skip}`:"");
    }

    if(stage>=1) recordScore(idx, s.section, correct, wrong, skip, items.length, stage>=3);
  }
  paint();
}

/* --- сортировка --- */
function renderSort(el, s){
  const idx = current;
  if(!S.sort[idx]) S.sort[idx] = {pick:{}, stage:0};
  const st = S.sort[idx];
  const items = s.data.items;
  const order = orderFor(idx, items.length);
  let selected = null;

  el.innerHTML = `
    <span class="section-tag">${s.section}</span>
    <h2>${s.title}</h2>
    <p class="instruction">${s.instruction}</p>
    <div class="pool" id="pool"></div>
    <div class="buckets">
      <div class="bucket"><h4>${s.data.left}</h4><div class="drop" id="bL" data-side="left"></div></div>
      <div class="bucket"><h4>${s.data.right}</h4><div class="drop" id="bR" data-side="right"></div></div>
    </div>
    <div class="footer-bar">
      <button class="btn btn-primary" id="checkBtn">Проверить</button>
      <button class="btn btn-ghost btn-sm" id="resetBtn">Сбросить</button>
      <div class="result" id="res"></div>
    </div>`;

  const pool = el.querySelector("#pool");
  function draw(){
    pool.innerHTML=""; el.querySelector("#bL").innerHTML=""; el.querySelector("#bR").innerHTML="";
    order.forEach(i=>{
      const it = items[i];
      const c = document.createElement("button");
      c.className="sortchip"; c.textContent=it.w; c.dataset.i=i;
      if(selected===i) c.classList.add("picked");
      const side = st.pick[i];
      if(st.stage>=1 && side){
        c.classList.add(side===it.side ? "ok":"no");
        if(st.stage>=2) c.textContent = it.w+" ("+it.note+")";
      }
      (side ? el.querySelector(side==="left"?"#bL":"#bR") : pool).appendChild(c);
    });
  }
  draw();

  el.addEventListener("click", e=>{
    const chip = e.target.closest(".sortchip");
    const drop = e.target.closest(".drop");
    if(chip && st.stage<2){ selected = +chip.dataset.i; draw(); return; }
    if(drop && selected!==null && st.stage<2){
      st.pick[selected]=drop.dataset.side; selected=null; save(); draw();
    }
  });

  el.querySelector("#checkBtn").addEventListener("click", ()=>{
    st.stage = st.stage===0?1:2; save();
    let ok=0,bad=0,skip=0;
    items.forEach((it,i)=>{ const p=st.pick[i]; if(!p) skip++; else if(p===it.side) ok++; else bad++; });
    draw();
    const btn=el.querySelector("#checkBtn");
    if(st.stage===1){ btn.textContent="Ещё попытка ↻"; btn.className="btn btn-gold"; }
    else { btn.textContent="Готово"; btn.className="btn btn-ghost"; btn.disabled=true; }
    el.querySelector("#res").textContent = `Верно ${ok} из ${items.length}` + (skip?` · не разобрано ${skip}`:"");
    recordScore(idx, s.section, ok, bad, skip, items.length, st.stage>=2);
  });
  el.querySelector("#resetBtn").addEventListener("click", ()=>{ S.sort[idx]={pick:{},stage:0}; save(); render(); });

  if(st.stage>=1){
    let ok=0,bad=0,skip=0;
    items.forEach((it,i)=>{ const p=st.pick[i]; if(!p) skip++; else if(p===it.side) ok++; else bad++; });
    const btn=el.querySelector("#checkBtn");
    if(st.stage===1){ btn.textContent="Ещё попытка ↻"; btn.className="btn btn-gold"; }
    else { btn.textContent="Готово"; btn.className="btn btn-ghost"; btn.disabled=true; }
    el.querySelector("#res").textContent = `Верно ${ok} из ${items.length}` + (skip?` · не разобрано ${skip}`:"");
  }
}

/* --- флеш-карты --- */
function renderFlash(el, s){
  const idx = current;
  if(!S.flash[idx]) S.flash[idx] = {pos:0, known:[]};
  const st = S.flash[idx];
  const items = s.items;
  const order = orderFor(idx, items.length);
  let flipped = false;

  el.innerHTML = `
    <span class="section-tag">${s.section}</span>
    <h2>${s.title}</h2>
    <p class="instruction">${s.instruction}</p>
    <div class="flashwrap"><div class="flash" id="flash"></div></div>
    <div class="flash-meta">
      <span class="flash-count" id="fc"></span>
      <span style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" id="again">Повторить</button>
        <button class="btn btn-primary btn-sm" id="know">Знаю ✓</button>
      </span>
    </div>
    <p class="tip">Карточки не идут в счёт: это блок на запоминание, а не на проверку.</p>`;

  const card = el.querySelector("#flash");
  function draw(){
    const list = order.filter(i=>!st.known.includes(i));
    if(list.length===0){
      card.innerHTML = `<div class="f-back" style="font-size:17px"><b>Сундук разобран.</b><br>Все карточки отмечены как известные.</div>`;
      el.querySelector("#fc").textContent = "0 карточек осталось";
      el.querySelector("#know").disabled = true; el.querySelector("#again").textContent="Начать заново";
      return;
    }
    if(st.pos>=list.length) st.pos=0;
    const it = items[list[st.pos]];
    card.innerHTML = flipped ? `<div class="f-back">${it.b}</div>` : `<div class="f-front">${it.f}</div>`;
    el.querySelector("#fc").textContent = `Осталось: ${list.length}`;
  }
  card.addEventListener("click", ()=>{ flipped=!flipped; draw(); });
  el.querySelector("#know").addEventListener("click", ()=>{
    const list = order.filter(i=>!st.known.includes(i));
    if(!list.length) return;
    st.known.push(list[st.pos]); flipped=false; save(); draw();
  });
  el.querySelector("#again").addEventListener("click", ()=>{
    const list = order.filter(i=>!st.known.includes(i));
    if(!list.length){ st.known=[]; st.pos=0; }
    else st.pos = (st.pos+1)%list.length;
    flipped=false; save(); draw();
  });
  draw();
}

function renderQuiz(el, s){
  const idx = current;
  if(!S.quiz[idx]) S.quiz[idx] = {ans:{}};
  const st = S.quiz[idx];
  el.innerHTML = `<span class="section-tag">${s.section}</span><h2>${s.title}</h2><p class="instruction">${s.instruction}</p><div id="qwrap"></div>`;
  const wrap = el.querySelector("#qwrap");
  s.items.forEach((q,qi)=>{
    const p = document.createElement("div");
    p.className="panel";
    p.innerHTML = `<h3>${qi+1}. ${q.q}</h3>` +
      q.opts.map((o,oi)=>`<button class="qopt" data-q="${qi}" data-o="${oi}">${o}</button>`).join("") +
      `<div class="qfb" id="fb${qi}">${q.fb}</div>`;
    wrap.appendChild(p);
  });
  function paint(){
    s.items.forEach((q,qi)=>{
      const chosen = st.ans[qi];
      wrap.querySelectorAll(`.qopt[data-q="${qi}"]`).forEach(b=>{
        b.classList.remove("ok","no");
        if(chosen!==undefined){
          if(+b.dataset.o===q.ok) b.classList.add("ok");
          else if(+b.dataset.o===chosen) b.classList.add("no");
          b.disabled=true;
        }
      });
      el.querySelector("#fb"+qi).classList.toggle("show", chosen!==undefined);
    });
    const done = Object.keys(st.ans).length;
    if(done===s.items.length){
      let ok=0; s.items.forEach((q,qi)=>{ if(st.ans[qi]===q.ok) ok++; });
      recordScore(idx, s.section, ok, s.items.length-ok, 0, s.items.length, true);
    }
  }
  wrap.addEventListener("click", e=>{
    const b=e.target.closest(".qopt"); if(!b||b.disabled) return;
    st.ans[+b.dataset.q] = +b.dataset.o; save(); paint();
  });
  paint();
}

/* --- интро к ЕГЭ --- */

      <b>«Укажите все цифры, на месте которых пишется одна буква Н»</b><br><br>

/* --- ЕГЭ --- */
function renderEge(el, s){
  const idx = current;
  const d = s.data;
  if(!S.ege[idx]) S.ege[idx] = {ans:{}, stage:0};
  const st = S.ege[idx];
  const need = d.task;
  const instr = need==="нн"
    ? "Укажите все цифры, на месте которых пишется НН."
    : "Укажите все цифры, на месте которых пишется одна буква Н.";

  const parts = d.text.split(/%(\d+)%/);
  let html = "";
  for(let k=0;k<parts.length;k++){
    if(k%2===0) html += parts[k];
    else{
      const n = +parts[k];
      html += `<span class="gap gapwrap" id="gw${n}"><span class="num">${n}</span>` +
              `<button class="gapbtn" data-n="${n}" data-v="н">Н</button>` +
              `<button class="gapbtn" data-n="${n}" data-v="нн">НН</button></span>`;
    }
  }

  el.innerHTML = `
    <span class="section-tag">${s.section}</span>
    <h2>${s.title}</h2>
    <div class="panel gold" style="padding:12px 14px"><p style="margin:0;font-size:15px"><b>${instr}</b></p></div>
    <div class="panel"><div class="ege-task">${html}</div>
      <div class="answerline">Ваш ответ: <span id="ansline">—</span></div>
    </div>
    <div class="ege-why panel note" id="whyBox">${d.gaps.map((g,i)=>`<div><b>${i+1}.</b> ${g.why}</div>`).join("")}</div>
    <div class="footer-bar">
      <button class="btn btn-primary" id="checkBtn">Проверить</button>
      <button class="btn btn-ghost btn-sm" id="resetBtn">Сбросить</button>
      <div class="result" id="res"></div>
    </div>`;

  el.addEventListener("click", e=>{
    const b = e.target.closest(".gapbtn");
    if(!b||b.disabled) return;
    st.ans[+b.dataset.n] = b.dataset.v; save(); paint();
  });
  el.querySelector("#checkBtn").addEventListener("click", ()=>{
    st.stage = st.stage===0?1:(st.stage===1?2:3); save(); paint();
  });
  el.querySelector("#resetBtn").addEventListener("click", ()=>{ S.ege[idx]={ans:{},stage:0}; save(); render(); });

  function paint(){
    const stage = st.stage;
    let ok=0, bad=0, skip=0;
    const chosenDigits=[], rightDigits=[];
    d.gaps.forEach((g,i)=>{
      const n=i+1;
      const chosen = st.ans[n];
      const isRight = chosen===g.ans;
      const gw = el.querySelector("#gw"+n);
      gw.classList.remove("correct","wrong","skipped");
      gw.querySelectorAll(".gapbtn").forEach(b=>{
        b.classList.toggle("selected", b.dataset.v===chosen);
        let lock=false;
        if(stage===1) lock=true;
        if(stage===2 && isRight) lock=true;
        if(stage>=3) lock=true;
        b.disabled=lock;
      });
      if(stage===1||stage>=3){
        if(!chosen){ skip++; gw.classList.add("skipped"); }
        else if(isRight){ ok++; gw.classList.add("correct"); }
        else { bad++; gw.classList.add("wrong"); }
      } else if(stage===2){
        if(isRight){ ok++; gw.classList.add("correct"); }
        else if(!chosen) skip++; else bad++;
      } else {
        if(!chosen) skip++; else if(isRight) ok++; else bad++;
      }
      if(chosen===need) chosenDigits.push(n);
      if(g.ans===need) rightDigits.push(n);
      if(stage>=3){
        gw.querySelectorAll(".gapbtn").forEach(b=>{ b.classList.toggle("selected", b.dataset.v===g.ans); });
      }
    });

    el.querySelector("#ansline").textContent = chosenDigits.length? chosenDigits.join("") : "—";
    const btn = el.querySelector("#checkBtn");
    const res = el.querySelector("#res");
    el.querySelector("#whyBox").classList.toggle("show", stage>=3);

    if(stage===0){ btn.textContent="Проверить"; btn.className="btn btn-primary"; res.textContent=""; }
    else if(stage===1){ btn.textContent="Ещё попытка ↻"; btn.className="btn btn-gold";
      res.textContent = `Верных пропусков: ${ok} из ${d.gaps.length}` + (skip?` · пропущено ${skip}`:""); }
    else if(stage===2){ btn.textContent="Проверить"; btn.className="btn btn-primary";
      res.textContent = "Верное заморожено. Исправьте остальное."; }
    else { btn.textContent="Готово"; btn.className="btn btn-ghost"; btn.disabled=true;
      res.innerHTML = `Итог: ${ok} из ${d.gaps.length} · правильный ответ: <span style="color:var(--diamond)">${rightDigits.join("")}</span>`; }

    if(stage>=1) recordScore(idx, s.section, ok, bad, skip, d.gaps.length, stage>=3);
  }
  paint();
}

/* ============================================================
   СЧЁТ И ДИАГНОСТИКА
   ============================================================ */
const SCORES = {};
function recordScore(idx, section, correct, wrong, skip, total, final){
  SCORES[idx] = {section, correct, wrong, skip, total, final};
}

function collectStats(){
  const by = {};
  Object.values(SCORES).forEach(r=>{
    if(!by[r.section]) by[r.section]={correct:0,wrong:0,skip:0,total:0};
    by[r.section].correct+=r.correct;
    by[r.section].wrong+=r.wrong;
    by[r.section].skip+=r.skip;
    by[r.section].total+=r.total;
  });
  return by;
}

function renderFinal(el){
  const by = collectStats();
  const keys = Object.keys(by);
  let allC=0, allT=0;
  keys.forEach(k=>{ allC+=by[k].correct; allT+=by[k].total; });
  const pct = allT? Math.round(allC/allT*100) : 0;

  const rows = keys.map(k=>{
    const b = by[k];
    const answered = b.correct + b.wrong;
    const acc = answered ? Math.round(b.correct/answered*100) : 0;
    return {name:k, acc, ...b};
  }).sort((a,b)=>a.acc-b.acc);

  let html = `
    <span class="section-tag">ИНВЕНТАРЬ</span>
    <h2>Итог занятия</h2>
    <div class="panel">
      <div class="score-hero">
        <div class="score-num">${pct}%</div>
        <div class="score-sub">${allC} верных из ${allT} выполненных позиций</div>
      </div>
    </div>`;

  if(!rows.length){
    html += `<div class="panel note"><p style="margin:0">Пока нет ни одного проверенного упражнения. Пройдите блоки — и здесь появится разбор по темам, от самой проблемной к усвоенной.</p></div>`;
  } else {
    html += `<h3 style="font-size:19px;margin:18px 0 10px">Темы на повторение</h3>
             <p class="instruction">Отсортировано от самой проблемной к усвоенной. Нажмите на ссылку, чтобы вернуться к теории.</p>`;
    rows.forEach(r=>{
      const cls = r.acc>=85?"":(r.acc>=60?"mid":"low");
      const back = SECTION_RULE[r.name];
      html += `<div class="topic">
        <div class="topic-head">
          <span class="topic-name">${r.name}</span>
          <span class="topic-val">${r.correct}/${r.correct+r.wrong} · ${r.acc}%${r.skip?` · пропущено ${r.skip}`:""}</span>
        </div>
        <div class="tbar"><i class="${cls}" style="width:${r.acc}%"></i></div>
        ${back!==undefined?`<span class="topic-link" data-go="${back}">← вернуться к теории</span>`:""}
      </div>`;
    });
  }

  html += `
    <div class="footer-bar" style="margin-top:18px">
      <button class="btn btn-gold" id="copyBtn">Скопировать итог</button>
      <button class="btn btn-ghost btn-sm" id="wipeBtn">Очистить прогресс</button>
      <div class="result" id="copyRes"></div>
    </div>
    <p class="tip">Кнопка «Скопировать итог» кладёт в буфер текст с разбивкой по темам — его можно отправить преподавателю.</p>`;

  el.innerHTML = html;

  el.querySelectorAll(".topic-link").forEach(a=>a.addEventListener("click", ()=>goTo(+a.dataset.go)));

  el.querySelector("#copyBtn").addEventListener("click", ()=>{
    let t = "Задание 15 ЕГЭ. Н и НН — итог тренажёра\n";
    t += "Общий результат: "+allC+" из "+allT+" ("+pct+"%)\n\n";
    t += "По темам (от проблемной к усвоенной):\n";
    rows.forEach(r=>{
      t += "· "+r.name+": "+r.correct+"/"+(r.correct+r.wrong)+" — "+r.acc+"%"+(r.skip?" (пропущено "+r.skip+")":"")+"\n";
    });
    if(!rows.length) t += "(упражнения не выполнялись)\n";
    const res = el.querySelector("#copyRes");
    function fallback(){
      const ta=document.createElement("textarea");
      ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      let done=false;
      try{ done=document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      if(done) res.textContent="Скопировано ✓";
      else{
        res.textContent="";
        const box=document.createElement("textarea");
        box.value=t; box.readOnly=true;
        box.style.cssText="width:100%;min-height:170px;margin-top:12px;background:var(--panel-2);color:var(--text);border:2px solid #000;padding:10px;font-family:var(--ui);font-size:13px;";
        el.appendChild(box); box.focus(); box.select();
      }
    }
    if(window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>{ res.textContent="Скопировано ✓"; }, fallback);
    } else fallback();
  });
  el.querySelector("#wipeBtn").addEventListener("click", ()=>{
    if(confirm("Удалить все сохранённые ответы и начать заново?")){
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = {practice:{}, ege:{}, quiz:{}, sort:{}, flash:{}, idx:0, calm:S.calm};
      Object.keys(SCORES).forEach(k=>delete SCORES[k]);
      current = 0; render();
    }
  });
}

/* ============================================================
   ПРЕДЗАГРУЗКА СЧЁТА ИЗ ПАМЯТИ
   ============================================================ */
(function preloadScores(){
  SLIDES.forEach((s,idx)=>{
    if(s.type==="practice" && S.practice[idx] && S.practice[idx].stage>=1){
      const st=S.practice[idx]; let ok=0,bad=0,skip=0;
      s.items.forEach((it,i)=>{ const a=st.ans[i]; if(!a) skip++; else if(a===it.ans) ok++; else bad++; });
      recordScore(idx, s.section, ok, bad, skip, s.items.length, st.stage>=3);
    }
    if(s.type==="sort" && S.sort[idx] && S.sort[idx].stage>=1){
      const st=S.sort[idx]; let ok=0,bad=0,skip=0;
      s.data.items.forEach((it,i)=>{ const p=st.pick[i]; if(!p) skip++; else if(p===it.side) ok++; else bad++; });
      recordScore(idx, s.section, ok, bad, skip, s.data.items.length, st.stage>=2);
    }
    if(s.type==="ege" && S.ege[idx] && S.ege[idx].stage>=1){
      const st=S.ege[idx]; let ok=0,bad=0,skip=0;
      s.data.gaps.forEach((g,i)=>{ const a=st.ans[i+1]; if(!a) skip++; else if(a===g.ans) ok++; else bad++; });
      recordScore(idx, s.section, ok, bad, skip, s.data.gaps.length, st.stage>=3);
    }
    if(s.type==="quiz" && S.quiz[idx]){
      const st=S.quiz[idx]; const done=Object.keys(st.ans).length;
      if(done===s.items.length){ let ok=0; s.items.forEach((q,qi)=>{ if(st.ans[qi]===q.ok) ok++; });
        recordScore(idx, s.section, ok, s.items.length-ok, 0, s.items.length, true); }
    }
  });
})();

render();
</script>
